<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusAbove</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='14' fill='%23a34b1f'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23fff7ee' stroke-width='6'/%3E%3Ccircle cx='46' cy='18' r='3' fill='%23fff7ee' fill-opacity='0.9'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --bg-accent: #eef1f4;
      --panel: #ffffff;
      --panel-solid: #ffffff;
      --panel-strong: #fbfcfd;
      --panel-muted: #f2f4f6;
      --border: rgba(78, 92, 107, 0.14);
      --border-rgb: 78, 92, 107;
      --text: #1f2933;
      --muted: #697a8c;
      --primary: #7b828a;
      --primary-rgb: 123, 130, 138;
      --primary-strong: #5f6670;
      --primary-contrast: #f8fbff;
      --primary-soft: rgba(123, 130, 138, 0.12);
      --fld-br: rgba(var(--border-rgb), 0.16);
      --fld-bg: rgba(255, 255, 255, 0.92);
      --subtle-bg: rgba(255, 255, 255, 0.82);
      --subtle-br: rgba(var(--border-rgb), 0.08);
      --subtle-bg-strong: rgba(255, 255, 255, 0.96);
      --chip-bg: rgba(255, 255, 255, 0.84);
      --chip-sh: 0 10px 24px rgba(43, 54, 67, 0.08);
      --media-bg: rgba(255, 255, 255, 0.16);
      --media-br: rgba(var(--border-rgb), 0.1);
      --tbl-bg: rgba(255, 255, 255, 0.82);
      --tbl-br: rgba(var(--border-rgb), 0.12);
      --tbl-cell-br: rgba(var(--border-rgb), 0.1);
      --tbl-head-bg: rgba(var(--primary-rgb), 0.08);
      --success: #2f7d61;
      --danger: #b45454;
      --shadow: 0 24px 80px rgba(43, 54, 67, 0.12);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --font-display: "Segoe UI Variable Display", "Pretendard Variable", "Noto Sans KR", sans-serif;
      --font-body: "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
      --chat-pane-measured-right-gap: 0px;
      --desktop-sidebar-left: 0px;
      --desktop-sidebar-width: 288px;
      --header-measured-height: 96px;
      --scroll-jump-stack-inner-offset: 24px;
      --scroll-jump-stack-right: calc(var(--chat-pane-measured-right-gap) + var(--scroll-jump-stack-inner-offset));
      --composer-measured-height: 132px;
      --scroll-jump-stack-gap: 16px;
      --scroll-jump-stack-height: 48px;
      --scroll-jump-stack-bottom: calc(var(--composer-measured-height) + var(--scroll-jump-stack-gap));
      --message-stream-bottom-padding: calc(var(--composer-measured-height) + var(--scroll-jump-stack-height) + var(--scroll-jump-stack-gap) + 24px);
    }
    :root[data-resolved-theme="dark"] {
      color-scheme: dark;
      --bg: #000000;
      --bg-accent: #050505;
      --panel: #000000;
      --panel-solid: #000000;
      --panel-strong: #090909;
      --panel-muted: #101010;
      --border: rgba(255, 255, 255, 0.12);
      --border-rgb: 255, 255, 255;
      --text: #f2f2f2;
      --muted: #a6a6a6;
      --primary: #d0d0d0;
      --primary-rgb: 208, 208, 208;
      --primary-strong: #f6f6f6;
      --primary-contrast: #101010;
      --primary-soft: rgba(208, 208, 208, 0.16);
      --fld-br: rgba(255, 255, 255, 0.14);
      --fld-bg: rgba(10, 10, 10, 0.96);
      --subtle-bg: rgba(255, 255, 255, 0.05);
      --subtle-br: rgba(255, 255, 255, 0.1);
      --subtle-bg-strong: rgba(255, 255, 255, 0.08);
      --chip-bg: rgba(12, 12, 12, 0.82);
      --chip-sh: 0 10px 24px rgba(0, 0, 0, 0.22);
      --media-bg: rgba(8, 8, 8, 0.84);
      --media-br: rgba(255, 255, 255, 0.08);
      --tbl-bg: rgba(10, 10, 10, 0.88);
      --tbl-br: rgba(255, 255, 255, 0.1);
      --tbl-cell-br: rgba(255, 255, 255, 0.08);
      --tbl-head-bg: rgba(var(--primary-rgb), 0.14);
      --success: #74c291;
      --danger: #ef9380;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }
    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(var(--primary-rgb), 0.34) transparent;
    }
    [hidden] {
      display: none !important;
    }
    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      overflow-y: auto;
    }
    html.overlay-open,
    body.overlay-open {
      overflow: hidden;
      overscroll-behavior: none;
    }
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(var(--primary-rgb), 0.42), rgba(var(--primary-rgb), 0.24));
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.36);
    }
    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(var(--primary-rgb), 0.52), rgba(var(--primary-rgb), 0.32));
    }
    *::-webkit-scrollbar-corner {
      background: transparent;
    }
    :root[data-resolved-theme="dark"] * {
      scrollbar-color: rgba(var(--primary-rgb), 0.42) transparent;
    }
    :root[data-resolved-theme="dark"] *::-webkit-scrollbar-thumb {
      background: rgba(var(--primary-rgb), 0.34);
      border-color: rgba(0, 0, 0, 0.42);
    }
    :root[data-resolved-theme="dark"] *::-webkit-scrollbar-thumb:hover {
      background: rgba(var(--primary-rgb), 0.46);
    }
    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .app-shell {
      position: relative;
      z-index: 1;
      width: min(1480px, calc(100vw - 48px));
      min-height: min(980px, calc(100vh - 32px));
      min-height: min(980px, calc(100svh - 32px));
      margin: 16px auto;
    }
    .panel {
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--panel-solid);
      box-shadow: var(--shadow);
    }
    .panel-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .overlay-panel .panel-inner {
      padding: 22px;
      gap: 18px;
    }
    .workspace-layout {
      display: block;
    }
    .desktop-tabs-sidebar {
      display: none;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: riseIn 0.5s ease;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-strong);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .brand-mark svg {
      display: block;
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: var(--primary);
    }
    .brand-mark-link {
      display: inline-flex;
      width: fit-content;
      color: inherit;
      text-decoration: none;
    }
    .brand-mark-link .brand-mark svg {
      color: #a34b1f;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .settings-form,
    .chat-form,
    .message-user-stack,
    .model-controls,
    .prompt-preset-form,
    .authors-note-form,
    .card-pane,
    .card-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .settings-inline-grid,
    .model-tuning-grid,
    .illustration-control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .rp-assistance-fields,
    .talk-group-members {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .talk-group-members[hidden] {
      display: none !important;
    }
    .talk-group-member-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 82px auto;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--subtle-br);
      border-radius: var(--radius-md);
      background: var(--subtle-bg);
    }
    #talkGroupMemberCandidateList {
      width: 100%;
      align-items: stretch;
      padding-right: 0;
      gap: 0;
      background: var(--panel-solid);
    }
    #talkGroupMemberCandidateList .talk-group-candidate-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      width: 100%;
      flex: 0 0 auto;
      height: auto;
      min-height: 72px;
      aspect-ratio: auto;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 0;
      background: var(--panel-solid);
      box-shadow: none;
      overflow: visible;
      cursor: pointer;
    }
    #talkGroupMemberCandidateList .talk-group-candidate-item + .talk-group-candidate-item {
      border-top-color: transparent;
    }
    #talkGroupMemberCandidateList .talk-group-candidate-item .card-thumb {
      width: 56px;
      height: 56px;
      min-width: 56px;
      border-radius: 12px;
      cursor: pointer;
    }
    #talkGroupMemberCandidateList .talk-group-candidate-item .talk-group-member-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .talk-group-member-row input[type="number"] {
      padding: 8px 10px;
    }
    .talk-group-limit-notice {
      margin: -2px 0 0;
      color: var(--danger);
      font-weight: 700;
    }
    .talk-group-member-remove-button {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
    }
    #settingsRpSectionGroup,
    #settingsTalkSectionGroup {
      display: contents;
    }
    .settings-divider {
      height: 1px;
      border: 0;
      margin: 4px 0;
      background: var(--tbl-br);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    input,
    select,
    textarea,
    button {
      font: inherit;
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--fld-br);
      border-radius: var(--radius-md);
      background: var(--fld-bg);
      color: var(--text);
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(var(--primary-rgb), 0.58);
      box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.12);
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, background 120ms ease;
    }
    button:hover:not(:disabled),
    .composer-upload-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }
    button:disabled {
      cursor: progress;
      opacity: 0.75;
    }
    .ghost-button,
    .toolbar-button {
      background: rgba(var(--primary-rgb), 0.1);
      color: var(--primary-strong);
    }
    .toolbar-icon-button,
    .tab-utility-button,
    .chat-item-icon-button,
    .message-action-button,
    .composer-upload-button,
    .composer-attachment-remove,
    .scroll-jump-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .toolbar-icon-button {
      width: 38px;
      min-width: 38px;
      padding-block: 10px;
    }
    .danger-button {
      background: rgba(180, 65, 45, 0.12);
      color: var(--danger);
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .button-row > * {
      flex: 1 1 0;
    }
    .tab-utility-row,
    .card-editor-actions,
    .card-editor-action-row,
    .scroll-jump-stack {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-utility-row {
      flex-wrap: wrap;
    }
    .tab-utility-button {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(var(--primary-rgb), 0.1);
      color: var(--primary-strong);
      flex: 0 0 auto;
    }
    .tab-utility-button.secondary {
      background: var(--subtle-bg);
      color: var(--muted);
      border: 1px solid var(--subtle-br);
    }
    :root[data-resolved-theme="dark"] .tab-utility-button {
      background: rgba(var(--primary-rgb), 0.12);
      color: var(--primary-strong);
    }
    .tab-utility-button svg,
    .toolbar-icon-button svg,
    .chat-item-icon-button svg,
    .message-action-button svg,
    .composer-upload-button svg,
    .composer-attachment-remove svg,
    .scroll-jump-button svg {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .tab-utility-button svg,
    .toolbar-icon-button svg {
      width: 18px;
      height: 18px;
    }
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }
    .chat-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: var(--radius-lg);
      background: var(--panel-muted);
      padding: 14px;
      color: inherit;
      min-height: 130px;
    }
    .chat-item.active {
      border-color: rgba(var(--primary-rgb), 0.28);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: inset 0 0 0 1px rgba(var(--primary-rgb), 0.08);
    }
    :root[data-resolved-theme="dark"] .chat-item.active {
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 0 1px rgba(var(--primary-rgb), 0.12);
    }
    .chat-item-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-self: stretch;
      min-width: 0;
      min-height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      color: inherit;
    }
    .chat-item-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 100%;
      min-width: 0;
    }
    .chat-item-main:focus-visible,
    .chat-item-icon-button:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.14);
    }
    .chat-item-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      flex: 0 0 auto;
      margin-left: auto;
      flex-wrap: nowrap;
    }
    .chat-item-icon-button {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid var(--subtle-br);
      background: var(--subtle-bg);
      color: var(--muted);
    }
    .chat-item-icon-button:hover:not(:disabled) {
      background: rgba(var(--primary-rgb), 0.1);
      color: var(--primary-strong);
      transform: translateY(-1px);
    }
    .chat-item.active .chat-item-icon-button {
      background: var(--subtle-bg-strong);
    }
    .chat-item-icon-button.danger,
    .card-action-icon-button.danger {
      color: var(--danger);
      background: #eef1f4;
      border-color: rgba(var(--border-rgb), 0.12);
    }
    .chat-item-icon-button.danger:hover:not(:disabled) {
      background: #eef1f4;
      color: var(--danger);
    }
    .chat-item.active .chat-item-icon-button.danger {
      background: #eef1f4;
      border-color: rgba(var(--border-rgb), 0.12);
    }
    .chat-item-icon-button svg {
      width: 16px;
      height: 16px;
    }
    .chat-item-title {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .chat-item-title-input {
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
    }
    .chat-item-meta {
      margin: auto 0 0;
      padding-top: 10px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
    }
    .main-panel {
      display: flex;
      flex-direction: column;
      overflow: visible;
      animation: riseIn 0.45s ease;
      min-height: min(980px, calc(100vh - 32px));
      min-height: min(980px, calc(100svh - 32px));
      min-width: 0;
      background: #ffffff;
    }
    :root[data-resolved-theme="dark"] .panel.main-panel {
      background: #000000;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.46);
    }
    .main-header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 12px;
      padding: 18px 24px 12px;
      border-bottom: 1px solid rgba(var(--border-rgb), 0.14);
      background: var(--panel-muted);
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: min(1480px, calc(100vw - 48px));
      top: 0;
      z-index: 12;
      box-shadow: 0 16px 34px rgba(43, 54, 67, 0.08);
    }
    :root[data-resolved-theme="dark"] .main-header {
      border-bottom-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);
    }
    .main-title {
      min-width: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      flex: 0 0 auto;
    }
    .header-actions button {
      font-size: 13px;
      line-height: 1.1;
      white-space: nowrap;
    }
    .header-mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(var(--border-rgb), 0.12);
      background: rgba(255, 255, 255, 0.84);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    :root[data-resolved-theme="dark"] .header-mode-toggle {
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    .mode-toggle-button {
      min-width: 44px;
      padding: 8px 8px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      box-shadow: none;
    }
    .mode-toggle-button.active {
      background: linear-gradient(180deg, rgba(var(--primary-rgb), 0.18), rgba(var(--primary-rgb), 0.12));
      color: var(--primary-strong);
    }
    :root[data-resolved-theme="dark"] .mode-toggle-button.active {
      background: rgba(var(--primary-rgb), 0.16);
    }
    .header-rp-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .main-title h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: -0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .main-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .message-stream {
      flex: 0 0 auto;
      min-height: 0;
      overflow: visible;
      padding: 156px 24px var(--message-stream-bottom-padding);
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .empty-state {
      margin: auto;
      max-width: 520px;
      padding: 28px;
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.8);
      border: 1px dashed rgba(var(--primary-rgb), 0.24);
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    :root[data-resolved-theme="dark"] .empty-state {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .message {
      max-width: min(100%, 760px);
      padding: 16px 18px;
      border-radius: 20px;

        overflow: hidden;
        overscroll-behavior: contain;
        animation: riseIn 0.45s ease;
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        z-index: 11;
      }
      .desktop-tabs-sidebar-inner {
        position: relative;
        left: auto;
        width: 100%;
        top: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: 100%;
        min-height: 0;
        padding: 0 16px 24px;
        border: 0;
        border-right: 1px solid rgba(var(--border-rgb), 0.16);
        border-radius: 0;
        background: #ffffff;
        box-shadow: none;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      :root[data-resolved-theme="dark"] .desktop-tabs-sidebar-inner {
        background: #000000;
        border-right-color: rgba(255, 255, 255, 0.1);
      }
      .desktop-tabs-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 1;
        padding-top: 20px;
        padding-bottom: 10px;
        background: inherit;
      }
      .desktop-tabs-toolbar .section-title {
        margin: 0;
      }
      .desktop-tabs-list-section,
      .desktop-chat-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow: visible;
      }
      .main-header {
        left: 0;
        transform: none;
        width: 100vw;
      }
      .main-panel {
        width: calc(100vw - var(--desktop-sidebar-width));
        margin-left: var(--desktop-sidebar-width);
        min-height: 100vh;
        min-height: 100svh;
        border-left: 0;
        border-radius: 0;
        border-top: 0;
        border-right: 0;
        border-bottom: 0;
        background: #ffffff;
      }
      :root[data-resolved-theme="dark"] .panel.main-panel {
        background: #000000;
      }
      .composer {
        left: 0;
        transform: none;
        width: 100vw;
      }
    }
    @media (max-width: 860px) {
      :root {
        --scroll-jump-stack-inner-offset: 18px;
        --scroll-jump-stack-gap: 12px;
      }
      .card-layout {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 12px;
        overflow: hidden;
      }
      .card-side {
        min-height: 0;
        max-width: 92px;
      }
      .card-tools {
        flex-direction: column;
        flex-wrap: nowrap;
      }
      .card-fields {
        padding-right: 0;
      }
      .card-editor-actions {
        flex-wrap: wrap;
      }
      .app-shell {
        width: 100vw;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
      }
      .main-header,
      .composer,
      .overlay-panel .panel-inner {
        padding-left: 18px;
        padding-right: 18px;
      }
      .panel.main-panel {
        min-height: 100vh;
        min-height: 100svh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-top: 0;
      }
      .main-header {
        left: 0;
        transform: none;
        width: 100vw;
        top: 0;
        padding-top: 16px;
        padding-bottom: 10px;
      }
      .main-title h2 {
        font-size: 20px;
      }
      .main-title p {
        font-size: 12px;
      }
      .header-actions {
        gap: 6px;
      }
      .header-actions button {
        padding: 8px 10px;
        font-size: 12px;
      }
      .header-actions .toolbar-icon-button {
        width: 34px;
        min-width: 34px;
        padding-inline: 0;
      }
      .header-rp-actions {
        gap: 6px;
      }
      .header-mode-toggle {
        gap: 1px;
        padding: 2px;
      }
      .header-actions .mode-toggle-button {
        min-width: 34px;
        padding: 7px 6px;
        font-size: 12px;
      }
      .composer {
        left: 0;
        transform: none;
        width: 100vw;
        grid-template-columns: minmax(0, 1fr) 92px;
        gap: 10px;
        bottom: 0;
      }
      .message-stream {
        padding: 150px 18px var(--message-stream-bottom-padding);
      }
      .overlay-shell {
        padding: 0;
        align-items: stretch;
        justify-content: stretch;
      }
      .overlay-panel {
        border-radius: 0;
        border: 0;
      }
      .media-overlay {
        padding: 0;
      }
      .overlay-panel,
      .media-overlay-panel {
        width: 100vw;
        max-height: none;
        height: 100vh;
        height: 100svh;
      }
      .media-overlay-panel .panel-inner {
        gap: 12px;
        padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
      }
      .image-crop-body {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
      }
      .image-crop-viewport {
        width: min(100%, 360px);
      }
      .image-crop-actions {
        margin-top: 0;
      }
      .image-preview-body img {
        max-height: 100%;
      }
      .overlay-content {
        padding-bottom: 18px;
      }
      .desktop-tabs-sidebar {
        display: none;
      }
    }
    @media (max-width: 860px) and (orientation: landscape) {
      :root {
        --scroll-jump-stack-gap: 10px;
        --scroll-jump-stack-height: 42px;
      }
      .main-header {
        padding-top: 12px;
        padding-bottom: 8px;
        gap: 10px;
      }
      .message-stream {
        padding: 130px 18px var(--message-stream-bottom-padding);
      }
      .empty-state {
        margin: 0 auto;
        max-width: 100%;
        padding: 20px;
      }
      .composer {
        gap: 8px;
        padding-top: 10px;
        padding-bottom: 12px;
      }
      .scroll-jump-button {
        width: 42px;
        height: 42px;
      }
      .composer textarea {
        min-height: 76px;
      }
      .composer {
        grid-template-columns: minmax(0, 1fr) 84px;
      }
      .composer-actions button {
        min-height: 34px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .composer-actions button.composer-upload-button {
        min-height: 34px;
        padding: 5px 10px;
        line-height: 0;
      }
    }
    @media (max-width: 860px) {
      .panel,
      .main-header,
      .composer,
      .scroll-jump-button,
      .status-toast {
        box-shadow: none;
      }
      :root[data-resolved-theme="dark"] .scroll-clear-button {
        background: #232323;
      }
      :root[data-resolved-theme="dark"] .status-toast.success {
        background: #18261c;
      }
      :root[data-resolved-theme="dark"] .status-toast.error {
        background: #2a1917;
      }
    }

      if (chatStatusToastTimerId) {

    function formatDate(value, withTime = false) {
      if (!value) {
        return "-";
      }
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "-";
      }
      return new Intl.DateTimeFormat(getUiLocale(), {
        month: "short",
        day: "numeric",
        hour: withTime ? "2-digit" : undefined,
        minute: withTime ? "2-digit" : undefined,
        hour12: withTime ? false : undefined,
        hourCycle: withTime ? "h23" : undefined
      }).format(date);
    }
    function formatRelativeTimeShort(value) {
      if (!value) {
        return "-";
      }
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "-";
      }
      const diffMs = Date.now() - date.getTime();
      if (diffMs < 0) {
        return t("justNow");
      }
      const diffMinutes = Math.floor(diffMs / 60000);
      if (diffMinutes < 1) {
        return t("justNow");
      }
      if (diffMinutes < 60) {
        return t("minutesAgo", { count: diffMinutes });
      }
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) {
        return t("hoursAgo", { count: diffHours });
      }
      const diffDays = Math.floor(diffHours / 24);
      return t("daysAgo", { count: diffDays });
    }
    function buildTimestampForFilename(options = {}) {
      const date = options.date instanceof Date ? options.date : new Date();
      const datePart = [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("");
      const timePart = [
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0"),
        String(date.getSeconds()).padStart(2, "0")
      ].join("");
      const millisecondPart = options.includeMilliseconds
        ? `-${String(date.getMilliseconds()).padStart(3, "0")}`
        : "";
      return `${datePart}-${timePart}${millisecondPart}`;

    function sanitizeDownloadFileName(value, fallback = "download") {
      const normalized = String(value || "")
        .replace(/[<>:"/\\|?*\x00-\x1f]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/[.\s]+$/g, "");
