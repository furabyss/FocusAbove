      const enhanced = await requestAuxiliaryChatCompletion(buildRpAuxiliaryRequestMessages(chat, [
        {
          role: "system",
          content: [
            "Rewrite RP user input before it is sent to the main model.",
            `Return only the rewritten user input in ${t("promptLanguageName")}.`,
            "Preserve intent. Do not add outcomes, control the assistant character, or narrate future results.",
            wasEmptyInput ? "The user submitted empty input. Use the opening message and recent context to write a natural concise continuation instruction; do not return only '계속' or 'continue'." : "Polish only the provided input for clarity and flow. Preserve meaning, perspective, tense, and length as much as possible; do not add prior-message context.",
            "No markdown, labels, explanations, or quotation marks."
          ].filter(Boolean).join("\n")
        },
        {
          role: "user",
          content: [
            mutableContext,
            wasEmptyInput && openingMessage ? "Opening character first message:" : "",
            wasEmptyInput && openingMessage ? openingMessage : "",
            wasEmptyInput ? "Recent RP messages:" : "",
            wasEmptyInput ? formatMessagesForAuxiliary(recentContextMessages, recentContextMessages.length, rpPlaceholders, 520) : "",
            "Original user input:",
            baseContent
          ].filter(Boolean).join("\n\n")
        }
      ]), { temperature: 0.25 });

      const cleaned = cleanAuxiliaryText(enhanced);
      if (wasEmptyInput && isContinuationRequest && (!cleaned || isRpContinueInput(cleaned))) {
        return getRpContinuationFallbackInput();
      }
      return cleaned || baseContent;
    }

    function getRecentRpInputEnhancementMessages(chat, excludeMessageId = "") {
      const messages = (Array.isArray(chat?.messages) ? chat.messages : [])
        .filter((message) => message?.id !== excludeMessageId)
        .filter((message) => message.role === "user" || message.role === "assistant");
      if (!messages.length) {
        return [];
      }

      let assistantResponseCount = 0;
      let startIndex = messages.length - 1;
      for (; startIndex >= 0; startIndex -= 1) {
        const message = messages[startIndex];
        if (message.role === "assistant" && !message.isFirstMessage) {
          assistantResponseCount += 1;
        }
        if (assistantResponseCount >= 1) {
          break;
        }
      }

      const sliceStart = Math.max(0, startIndex);
      const previousMessage = messages[sliceStart - 1];
      if (messages[sliceStart]?.role === "assistant" && previousMessage?.role === "user") {
        return messages.slice(sliceStart - 1);
      }

      return messages.slice(sliceStart);
    }

    function isRpContinueInput(value) {
      const compact = String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[\s.!?。！？…]+/g, "");
      return ["계속", "계속해", "계속해줘", "계속해주세요", "continue", "goon", "keepgoing", "proceed", "next"].includes(compact);
    }

    function getRpDefaultContinuationInput() {
      return normalizeAppLanguage(state.settings.language) === "en" ? "Continue" : "계속";
    }

    function getRpContinuationFallbackInput() {
      return normalizeAppLanguage(state.settings.language) === "en"
        ? "Continue the scene naturally from the current context, following the established mood, actions, and character dynamics."
        : "현재 맥락의 분위기, 행동, 인물 관계를 이어서 장면을 자연스럽게 계속 진행해 주세요.";
    }

    async function createRpSceneState(chat, assistantMessage) {
      const mutableContext = buildRpAuxiliaryMutableContext(chat, { includeSummary: false, includeAuthorsNote: false });
      const recentMessages = getRecentAuxiliaryMessagesExcluding(chat, assistantMessage?.id, 3);
      return cleanAuxiliaryText(await requestAuxiliaryChatCompletion(buildRpAuxiliaryRequestMessages(chat, [
        {
          role: "system",
          content: [
            "Extract the current mutable state of the RP scene.",
            `Return concise plain text in ${t("promptLanguageName")} using short bullet-like lines.`,
            "Track only location, time, participants, clothing, items, injuries, posture, emotions, relationship shifts, and immediate goals.",
            "Prioritize the latest messages. Do not invent facts or add headings/explanations."
          ].join("\n")
        },
        {
          role: "user",
          content: [
            mutableContext,
            "Recent RP messages:",
            formatMessagesForAuxiliary(recentMessages, recentMessages.length, null, 420),
            "Latest assistant response:",
            trimForAuxiliaryPrompt(assistantMessage.content || "", 900)
          ].filter(Boolean).join("\n\n")
        }
      ], { message: assistantMessage }), { temperature: 0.1 }));
    }

    async function createRpConversationSummary(chat) {
      const mutableContext = buildRpAuxiliaryMutableContext(chat, { includeSummary: false });
      const sourceMessages = getRpSummarySourceMessages(chat);
      const summaryMaxTokens = normalizeRpAssistanceSettings(state.rp?.assistance).summaryMaxTokens;
      return cleanAuxiliaryText(await requestAuxiliaryChatCompletion(buildRpAuxiliaryRequestMessages(chat, [
        {
          role: "system",
          content: [
            "Maintain a compact long-term summary for this RP chat.",
            `Return the updated summary in ${t("promptLanguageName")}.`,
            `Keep the summary within roughly ${summaryMaxTokens} tokens.`,
            "Preserve facts, relationship changes, promises, key events, emotions, mysteries, goals, and constraints.",
            "Be concise and specific. No scene prose, markdown headings, or explanations."
          ].join("\n")
        },
        {
          role: "user",
          content: [
            mutableContext,
            "Previous summary:",
            trimForAuxiliaryPrompt(chat.rpSummary || "", 1800) || "(none)",
            "Messages to fold into the summary:",
            formatMessagesForAuxiliary(sourceMessages, sourceMessages.length, null, 620)
          ].filter(Boolean).join("\n\n")
        }
      ]), { temperature: 0.15, maxTokens: summaryMaxTokens }));
    }

    async function requestAuxiliaryChatCompletion(messages, options = {}) {
      const apiBase = normalizeApiBase(state.settings.apiBaseUrl);
      const auxiliaryModel = String(state.settings.auxiliaryModel || "").trim();
      if (!apiBase || !auxiliaryModel) {
        return "";
      }

      const requestBody = {
        model: auxiliaryModel,
        stream: false,
        messages,
        reasoning: {
          max_tokens: 0
        }
      };
      if (typeof options.temperature === "number") {
        requestBody.temperature = options.temperature;
      }
      if (typeof options.maxTokens === "number") {
        requestBody.max_tokens = options.maxTokens;
      }

      const response = await fetch(`${apiBase}/chat/completions`, {
        method: "POST",
        headers: {
          ...buildHeaders(),
          "Content-Type": "application/json"
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status} ${response.statusText}`);
      }

      return cleanAuxiliaryText(extractFinalAssistantContent(await response.json()));
    }

    function buildRpAuxiliaryRequestMessages(chat, taskMessages, options = {}) {
      return [
        ...buildRpAuxiliaryPrefixMessages(chat, options.message || null),
        ...(Array.isArray(taskMessages) ? taskMessages : [])
      ];
    }

    function buildRpAuxiliaryPrefixMessages(chat, message = null) {
      const character = getRpCardById("character", chat?.characterCardId || message?.characterCardId || state.rp.activeCharacterId);
      const persona = getRpCardById("persona", message?.personaCardId || state.rp.activePersonaId);
      return [
        {
          role: "system",
          content: [
            "FocusAbove RP auxiliary request.",
            "Use stable participant names as baseline context.",
            "Follow later task instructions and return only the requested output."
          ].join("\n")
        },
        {
          role: "system",
          content: [
            "[Stable RP Context]",
            character?.name ? `Character: ${character.name}` : "Character: Unnamed Character",
            persona?.name ? `Persona: ${persona.name}` : "Persona: Unnamed Persona",
            "Full card text is omitted unless needed."
          ].filter(Boolean).join("\n")
        }
      ];
    }

    function buildRpAuxiliaryContext(chat, message = null) {
      const prefixText = buildRpAuxiliaryPrefixMessages(chat, message)
        .map((item) => item.content)
        .join("\n\n");
      const mutableContext = buildRpAuxiliaryMutableContext(chat);
      return [prefixText, mutableContext].filter(Boolean).join("\n\n");
    }

    function buildRpAuxiliaryMutableContext(chat, options = {}) {
      const includeSummary = options.includeSummary !== false;
      const includeSceneState = options.includeSceneState !== false;
      const includeAuthorsNote = options.includeAuthorsNote !== false;
      const items = [
        includeSummary && chat?.rpSummary ? `Existing RP summary: ${trimForAuxiliaryPrompt(chat.rpSummary, 1200)}` : "",
        includeSceneState && chat?.rpSceneState ? `Current scene state: ${trimForAuxiliaryPrompt(chat.rpSceneState, 700)}` : "",
        includeAuthorsNote && chat?.authorsNote ? `Author's note: ${trimForAuxiliaryPrompt(chat.authorsNote, 500)}` : ""
      ].filter(Boolean);
      if (!items.length) {
        return "";
      }
      return [
        "[Mutable RP Context]",
        ...items
      ].join("\n");
    }

    function buildRpIllustrationCardContext(chat, message = null, illustrationSettings = null) {
      const character = getRpCardById("character", chat?.characterCardId || message?.characterCardId || state.rp.activeCharacterId);
      const persona = getRpCardById("persona", message?.personaCardId || state.rp.activePersonaId);
      const rpPlaceholders = createRpPromptPlaceholders({ character, persona });
      const settings = normalizeRpIllustrationSettings(illustrationSettings);
      if (isWorldRpCard(character)) {
        return [
          "[Visual World Card Details]",
          character?.name ? `World: ${character.name}` : "",
          character?.description ? `World settings: ${trimForAuxiliaryPrompt(replaceRpPromptPlaceholders(character.description, rpPlaceholders), 1100)}` : "",
          character?.mainCharacterDescription
            ? `Major characters: ${trimForAuxiliaryPrompt(replaceRpPromptPlaceholders(character.mainCharacterDescription, rpPlaceholders), 900)}`
            : "",
          !settings.ignoreNonCharacterPeople && persona?.name ? `Persona: ${persona.name}` : "",
          !settings.ignoreNonCharacterPeople && persona?.description ? `Persona card: ${trimForAuxiliaryPrompt(replaceRpPromptPlaceholders(persona.description, rpPlaceholders), 700)}` : ""
        ].filter(Boolean).join("\n");
      }

      return [
        "[Visual Card Details]",
        character?.name ? `Character: ${character.name}` : "",
        character?.description ? `Character card: ${trimForAuxiliaryPrompt(replaceRpPromptPlaceholders(character.description, rpPlaceholders), 1100)}` : "",
        !settings.ignoreNonCharacterPeople && persona?.name ? `Persona: ${persona.name}` : "",
        !settings.ignoreNonCharacterPeople && persona?.description ? `Persona card: ${trimForAuxiliaryPrompt(replaceRpPromptPlaceholders(persona.description, rpPlaceholders), 700)}` : ""
      ].filter(Boolean).join("\n");
    }

    function getRpFirstMessageForAuxiliary(chat, rpPlaceholders = null) {
      const firstMessage = Array.isArray(chat?.messages)
        ? chat.messages.find((message) => message?.isFirstMessage && message.role === "assistant")
        : null;
      if (!firstMessage) {
        return "";
      }
      return trimForAuxiliaryPrompt(replaceRpPromptPlaceholders(firstMessage.content || "", rpPlaceholders), 1000);
    }

    function getRecentAuxiliaryMessagesBefore(chat, targetMessageId = "", limit = 6) {
      const messages = Array.isArray(chat?.messages) ? chat.messages : [];
      const targetIndex = messages.findIndex((message) => message?.id === targetMessageId);
      const sourceMessages = targetIndex >= 0 ? messages.slice(0, targetIndex) : messages;
      return sourceMessages
        .filter((message) => message.role === "user" || message.role === "assistant")
        .slice(-limit);
    }

    function getRecentAuxiliaryMessagesExcluding(chat, excludedMessageId = "", limit = 6) {
      return (Array.isArray(chat?.messages) ? chat.messages : [])
        .filter((message) => message?.id !== excludedMessageId)
        .filter((message) => message.role === "user" || message.role === "assistant")
        .slice(-limit);
    }

    function formatMessagesForAuxiliary(messages, limit = 10, rpPlaceholders = null, maxLength = 700) {
      return (Array.isArray(messages) ? messages : [])
        .filter((message) => message.role === "user" || message.role === "assistant")
        .slice(-limit)
        .map((message) => {
          const content = replaceRpPromptPlaceholders(message.content || "", rpPlaceholders);
          return `${message.role === "user" ? "User" : "Assistant"}: ${trimForAuxiliaryPrompt(content, maxLength)}`;
        })
        .join("\n\n");
    }

    function trimForAuxiliaryPrompt(value, maxLength = 2000) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      return text.length > maxLength ? `${text.slice(0, maxLength)}...` : text;
    }

    function cleanAuxiliaryText(value) {
      return String(value || "")
        .replace(/^```(?:\w+)?/i, "")
        .replace(/```$/i, "")
        .trim();
    }

    function cleanGeneratedTitle(value) {
      return cleanAuxiliaryText(value)
        .replace(/^title\s*:/i, "")
        .replace(/["'“”‘’]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 48);
    }

    async function createIllustrationPrompt(chat, assistantMessage) {
      if (!normalizeImageApiBase(state.settings.imageApiBaseUrl)) {
        throw new Error(t("illustrationImageApiRequired"));
      }

      const apiBase = normalizeApiBase(state.settings.apiBaseUrl);
      const auxiliaryModel = String(state.settings.auxiliaryModel || "").trim();
      if (!apiBase || !auxiliaryModel) {
        throw new Error(t("selectModelRequired"));
      }

      const illustrationSettings = normalizeRpIllustrationSettings(state.rp?.illustration);
      const characterCard = getRpCardById("character", chat?.characterCardId || assistantMessage?.characterCardId || state.rp.activeCharacterId);
      const stableVisualContext = buildRpIllustrationCardContext(chat, assistantMessage, illustrationSettings);
      const mutableContext = buildRpAuxiliaryMutableContext(chat, { includeSummary: false });
      const recentMessages = getRecentAuxiliaryMessagesBefore(chat, assistantMessage?.id, 2);
      const generatedPrompt = await requestAuxiliaryChatCompletion(buildRpAuxiliaryRequestMessages(chat, [
        {
          role: "system",
          content: [
            "Write one concise Stable Diffusion prompt in English only.",
            buildIllustrationPromptStyleInstruction(illustrationSettings.promptStyle),
            "Preserve stated gender and stable appearance from card details. Do not invent gender.",
            buildIllustrationPeopleScopeInstruction(illustrationSettings, { characterCard }),
            isWorldRpCard(characterCard)
              ? "For world cards, depict only the character or small set of characters actually present in the current scene. Prefer named major characters when recent context supports them. Never choose the persona/user. If solo-character mode is enabled, depict only the single most important current-scene character other than the persona/user."
              : "",
            "For clothing, pose, location, lighting, temporary states, and injuries, prefer latest context over card defaults.",
            "No markdown, explanations, text overlays, watermarks, signatures, UI elements, or camera metadata."
          ].filter(Boolean).join("\n")
        },
        {
          role: "user",
          content: [
            stableVisualContext,
            mutableContext,
            illustrationSettings.ignoreNonCharacterPeople
              ? "Recent conversation (use only the active character's visible state, pose, expression, outfit, location, lighting, and mood):"
              : "Recent conversation:",
            formatMessagesForAuxiliary(recentMessages, recentMessages.length, null, 420),
            "Latest assistant response to illustrate:",
            trimForAuxiliaryPrompt(assistantMessage.content || "", 1100)
          ].filter(Boolean).join("\n\n")
        }
      ], { message: assistantMessage }));
      const prompt = applyIllustrationArtStylePrefix(cleanIllustrationPrompt(generatedPrompt), illustrationSettings.artStyle);
      if (!prompt) {
        throw new Error(t("missingResponseContent"));
      }

      return prompt;
    }

    async function createChatT2iPrompt(chat, userMessage, options = {}) {
      const illustrationSettings = normalizeRpIllustrationSettings(state.rp?.illustration);
      const recentMessages = getRecentAuxiliaryMessagesBefore(chat, userMessage?.id, 3);
      const avoidPrompt = trimForAuxiliaryPrompt(options.avoidPrompt || "", 700);
      const generatedPrompt = await requestAuxiliaryChatCompletion([
        {
          role: "system",
          content: [
            "Classify whether the latest user message asks to create, draw, or generate an image.",
            `If it does not, output exactly ${CHAT_T2I_SKIP_TOKEN}.`,
            "If it does, output one concise Stable Diffusion prompt in English only.",
            buildIllustrationPromptStyleInstruction(illustrationSettings.promptStyle),
            avoidPrompt ? "If an earlier image prompt is provided, create meaningfully different composition and details while preserving the user's request." : "",
            "Use the latest user request as the primary source. No markdown, explanations, quotes, watermarks, signatures, or camera metadata."
          ].filter(Boolean).join("\n")
        },
        {
          role: "user",
          content: [
            "Recent conversation:",
            formatMessagesForAuxiliary(recentMessages, recentMessages.length, null, 320),
            "Latest user message:",
            trimForAuxiliaryPrompt(userMessage.content || "", 900),
            avoidPrompt ? "Earlier image prompt to avoid:" : "",
            avoidPrompt
          ].filter(Boolean).join("\n\n")
        }
      ], { temperature: avoidPrompt ? 0.45 : 0.1 });
      const cleanPrompt = cleanIllustrationPrompt(generatedPrompt);
      if (!cleanPrompt || isChatT2iSkipPrompt(cleanPrompt)) {
        return CHAT_T2I_SKIP_TOKEN;
      }
      return applyIllustrationArtStylePrefix(cleanPrompt, illustrationSettings.artStyle);
    }

    async function createChatT2iPromptForAssistantMessage(chat, assistantMessage) {
      const previousPrompt = normalizeMessageIllustration(assistantMessage?.illustration)?.prompt || "";
      const previousMessages = getRecentAuxiliaryMessagesBefore(chat, assistantMessage?.id, 12);
      const userMessage = getLatestUserMessageForChatT2i(previousMessages);
      const prompt = userMessage
        ? await createChatT2iPrompt(chat, userMessage, { avoidPrompt: previousPrompt })
        : "";
      if (!prompt || isChatT2iSkipPrompt(prompt)) {
        throw new Error(t("missingResponseContent"));
      }
      return prompt;
    }

    function isChatT2iSkipPrompt(value) {
      return cleanIllustrationPrompt(value).toUpperCase() === CHAT_T2I_SKIP_TOKEN;
    }

    function buildChatT2iMainModelInstructions(prompt, options = {}) {
      const cleanPrompt = cleanIllustrationPrompt(prompt);
      if (!cleanPrompt) {
        if (options.chat && !isRpChat(options.chat)) {
          return [[
            "[Image Generation Availability]",
            "No image generation is scheduled for this turn, and the main chat model has no image tool such as DALL-E or dalle.text2im.",
            "Do not output tool-call JSON, action/action_input, function calls, or claim an image was generated.",
            "If asked for an image, reply in normal prose that image generation is unavailable here and offer a text prompt or description instead."
          ].join("\n")];
        }

        return [];
      }

      return [[
        "[Planned Image Generation]",
        "The latest user message includes an image generation request.",
        "FocusAbove will generate the image after your text response. The main chat model has no callable image tool in this turn.",
        "Do not output tool-call JSON, action/action_input, function calls, XML tool tags, or fake image-tool code blocks/results.",
        "After your response, FocusAbove will generate an image with the image API using this prompt:",
        cleanPrompt,
        "Respond in normal prose only. Acknowledge that image generation is being handled, but do not claim the image already exists in the text response."
      ].join("\n")];
    }

    function buildIllustrationPeopleScopeInstruction(illustrationSettings, options = {}) {
      const settings = normalizeRpIllustrationSettings(illustrationSettings);
      if (!settings.ignoreNonCharacterPeople) {
        return "";
      }

      if (isWorldRpCard(options.characterCard)) {
        return [
          "Strict solo-character mode: the final image prompt must depict exactly one visible person/character.",
          "That person must be a non-persona character from the world's major cast or another clearly scene-relevant non-persona character.",
          "Never choose, describe, include, imply, or silhouette the persona/user, even if recent context centers on them.",
          "Do not include companions, crowds, background people, second bodies, or another person's hands/arms.",
          "If the scene centers on the persona/user, reinterpret it as the most important non-persona character's solo pose, expression, mood, and environment."
        ].join("\n");
      }

      return [
        "Strict solo-character mode: the final image prompt must depict exactly one visible person/character, the active character only.",
        "Do not mention, include, imply, or silhouette the persona, user, companions, crowds, background people, second bodies, or another person's hands/arms.",
        "If the scene involves another person, convert it into the active character's solo pose, expression, gaze, mood, and environment."
      ].join("\n");
    }

    function buildIllustrationPromptStyleInstruction(promptStyle) {
      if (normalizeIllustrationPromptStyle(promptStyle) === "natural-language") {
        return "Write a natural-language English prompt as one vivid sentence or short paragraph covering scene, characters, composition, mood, lighting, clothing, environment, and visual style.";
      }

      return "Write a standard Stable Diffusion tag-list prompt: concise English tags and short comma-separated phrases ordered from subject and composition to mood, lighting, clothing, environment, and visual style.";
    }

    function cleanIllustrationPrompt(value) {
      return String(value || "")
        .replace(/^```(?:\w+)?/i, "")
        .replace(/```$/i, "")
        .replace(/^prompt\s*:/i, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function applyIllustrationArtStylePrefix(prompt, artStyle) {
      const cleanPrompt = cleanIllustrationPrompt(prompt);
      const normalizedArtStyle = normalizeIllustrationArtStyle(artStyle);
      const prefix = normalizedArtStyle === "anime"
        ? "anime, manga"
        : normalizedArtStyle === "photo"
          ? "photorealistic"
          : "";
      return [prefix, cleanPrompt].filter(Boolean).join(", ");
    }

    async function generateStableDiffusionImage(prompt) {
      const imageApiBase = normalizeImageApiBase(state.settings.imageApiBaseUrl);
      if (!imageApiBase) {
        throw new Error(t("illustrationImageApiRequired"));
      }

      const illustrationSettings = normalizeRpIllustrationSettings(state.rp?.illustration);
      try {
        return await generateStableDiffusionWebUiImage(imageApiBase, prompt, illustrationSettings);
      } catch (error) {
        if (!shouldTryComfyUiFallback(error)) {
          throw error;
        }
        return generateComfyUiImage(imageApiBase, prompt, illustrationSettings);
      }
    }

    async function generateStableDiffusionWebUiImage(imageApiBase, prompt, illustrationSettings) {
      const requestBody = {
        prompt,
        negative_prompt: buildIllustrationNegativePrompt(illustrationSettings),
        cfg_scale: illustrationSettings.cfgScale,
        steps: illustrationSettings.steps,
        width: illustrationSettings.width,
        height: illustrationSettings.height,
        batch_size: 1,
        n_iter: 1,
        sampler_name: "Euler a"
      };

      if (illustrationSettings.imageModel) {
        requestBody.model = illustrationSettings.imageModel;
        requestBody.override_settings = {
          sd_model_checkpoint: illustrationSettings.imageModel
        };
        requestBody.override_settings_restore_afterwards = true;
      }

      const response = await fetch(`${imageApiBase}/sdapi/v1/txt2img`, {
        method: "POST",
        headers: {
          ...buildImageApiHeaders(),
          "Content-Type": "application/json"
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        throw createHttpError(response);
      }

      const payload = await response.json();
      const imageData = extractGeneratedImageData(payload);
      if (!imageData) {
        throw new Error(t("missingResponseContent"));
      }

      return {
        id: createId("image"),
        name: t("generatedIllustration"),
        type: imageData.type,
        size: imageData.base64.length,
        width: illustrationSettings.width,
        height: illustrationSettings.height,
        dataUrl: `data:${imageData.type};base64,${imageData.base64}`
      };
    }

    function buildIllustrationNegativePrompt(illustrationSettings) {
      const basePrompt = "text, watermark, signature, logo, speech bubble, low quality, blurry, distorted";
      if (!normalizeRpIllustrationSettings(illustrationSettings).ignoreNonCharacterPeople) {
        return basePrompt;
      }

      return [
        basePrompt,
        "multiple people, two people, couple, group, crowd, background people, extra person, other person, second character, companion"
      ].join(", ");
    }

    function shouldTryComfyUiFallback(error) {
      return error?.status === 404 || error?.status === 405;
    }

    async function generateComfyUiImage(imageApiBase, prompt, illustrationSettings) {
      const objectInfo = await fetchImageApiJson(`${imageApiBase}/object_info`);
      const checkpointNames = getComfyUiInputOptions(objectInfo, "CheckpointLoaderSimple", "ckpt_name");
      const samplerNames = getComfyUiInputOptions(objectInfo, "KSampler", "sampler_name");
      const schedulerNames = getComfyUiInputOptions(objectInfo, "KSampler", "scheduler");
      const checkpointName = illustrationSettings.imageModel || checkpointNames[0];
      if (!checkpointName) {
        throw new Error("ComfyUI checkpoint 목록을 찾지 못했습니다.");
      }

      const clientId = createId("comfy-client");
      const promptGraph = buildComfyUiPromptGraph({
        prompt,
        checkpointName,
        samplerName: samplerNames[0] || "euler",
        schedulerName: schedulerNames[0] || "normal",
        settings: illustrationSettings
      });
      const queuePayload = await fetchImageApiJson(`${imageApiBase}/prompt`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          client_id: clientId,
          prompt: promptGraph
        })
      });
      const promptId = queuePayload?.prompt_id;
      if (!promptId) {
        throw new Error("ComfyUI prompt_id를 받지 못했습니다.");
      }

      const imageRef = await waitForComfyUiImage(imageApiBase, promptId);
      const params = new URLSearchParams({
        filename: imageRef.filename,
        subfolder: imageRef.subfolder || "",
        type: imageRef.type || "output"
      });
      const imageResponse = await fetch(`${imageApiBase}/view?${params.toString()}`, {
        headers: buildImageApiHeaders()
      });
      if (!imageResponse.ok) {
        throw createHttpError(imageResponse);
      }

      const blob = await imageResponse.blob();
      return {
        id: createId("image"),
        name: t("generatedIllustration"),
        type: blob.type || "image/png",
        size: blob.size,
        width: illustrationSettings.width,
        height: illustrationSettings.height,
        dataUrl: await blobToDataUrl(blob)
      };
    }

    async function fetchImageApiJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          ...buildImageApiHeaders(),
          ...(options.headers || {})
        }
      });
      if (!response.ok) {
        throw createHttpError(response);
      }
      return response.json();
    }

    function getComfyUiInputOptions(objectInfo, nodeName, inputName) {
      const values = objectInfo?.[nodeName]?.input?.required?.[inputName]?.[0];
      return Array.isArray(values) ? values.filter((value) => typeof value === "string" && value) : [];
    }

    function buildComfyUiPromptGraph(options) {
      const { prompt, checkpointName, samplerName, schedulerName, settings } = options;
      return {
        "3": {
          class_type: "KSampler",
          inputs: {
            seed: Math.floor(Math.random() * 2 ** 32),
            steps: settings.steps,
            cfg: settings.cfgScale,
            sampler_name: samplerName,
            scheduler: schedulerName,
            denoise: 1,
            model: ["4", 0],
            positive: ["6", 0],
            negative: ["7", 0],
            latent_image: ["5", 0]
          }
        },
        "4": {
          class_type: "CheckpointLoaderSimple",
          inputs: {
            ckpt_name: checkpointName
          }
        },
        "5": {
          class_type: "EmptyLatentImage",
          inputs: {
            width: settings.width,
            height: settings.height,
            batch_size: 1
          }
        },
        "6": {
          class_type: "CLIPTextEncode",
          inputs: {
            text: prompt,
            clip: ["4", 1]
          }
        },
        "7": {
          class_type: "CLIPTextEncode",
          inputs: {
            text: buildIllustrationNegativePrompt(settings),
            clip: ["4", 1]
          }
        },
        "8": {
          class_type: "VAEDecode",
          inputs: {
            samples: ["3", 0],
            vae: ["4", 2]
          }
        },
        "9": {
          class_type: "SaveImage",
          inputs: {
            filename_prefix: "focusabove",
            images: ["8", 0]
          }
        }
      };
    }

    async function waitForComfyUiImage(imageApiBase, promptId) {
      for (let attempt = 0; attempt < 120; attempt += 1) {
        const history = await fetchImageApiJson(`${imageApiBase}/history/${encodeURIComponent(promptId)}`);
        const imageRef = extractComfyUiImageRef(history?.[promptId]);
        if (imageRef) {
          return imageRef;
        }
        await delay(1000);
      }

      throw new Error("ComfyUI 이미지 생성 시간이 초과되었습니다.");
    }

    function extractComfyUiImageRef(historyItem) {
      const outputs = historyItem?.outputs || {};
      for (const output of Object.values(outputs)) {
        const image = Array.isArray(output?.images) ? output.images[0] : null;
        if (image?.filename) {
          return image;
        }
      }
      return null;
    }

    function delay(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("이미지를 읽지 못했습니다."));
        reader.readAsDataURL(blob);
      });
    }

    function createHttpError(response) {
      const error = new Error(`HTTP ${response.status} ${response.statusText}`);
      error.status = response.status;
      return error;
    }

    function extractGeneratedImageData(payload) {
      const imageValue = Array.isArray(payload?.images) ? payload.images[0] : payload?.image;
      if (typeof imageValue !== "string" || !imageValue.trim()) {
        return null;
      }

      const dataUrlMatch = imageValue.match(/^data:([^;,]+);base64,(.+)$/i);
      if (dataUrlMatch) {
        return {
          type: dataUrlMatch[1] || "image/png",
          base64: dataUrlMatch[2]
        };
      }

      return {
        type: "image/png",
        base64: imageValue.trim()
      };
    }

    async function readAssistantResponseStream(response, assistantMessage, chat) {
      const contentType = response.headers.get("content-type") || "";
      if (!response.body || !/event-stream/i.test(contentType)) {
        const payload = await response.json();
        const assistantContent = sanitizeChatModeFakeImageToolCallOutput(extractFinalAssistantContent(payload), chat);
        if (!assistantContent.trim()) {
          throw new Error(t("missingResponseContent"));
        }
        assistantMessage.content = assistantContent.trim();
        applyTokenUsageToMessage(assistantMessage, payload?.usage || payload?.x_groq?.usage || payload?.choices?.[0]?.usage);
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      let hasVisibleContent = false;

      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });

        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() || "";

        for (const chunk of chunks) {
          if (!chunk.trim()) {
            continue;
          }

          const shouldStop = applyStreamChunk(chunk, assistantMessage, chat, {
            hasVisibleContentRef: () => hasVisibleContent,
            setHasVisibleContent: (nextValue) => {
              hasVisibleContent = nextValue;
            }
          });

          if (shouldStop) {
            break;
          }
        }

        if (done) {
          break;
        }
      }

      if (buffer.trim()) {
        applyStreamChunk(buffer, assistantMessage, chat, {
          hasVisibleContentRef: () => hasVisibleContent,
          setHasVisibleContent: (nextValue) => {
            hasVisibleContent = nextValue;
          }
        });
      }

      if (!assistantMessage.content.trim()) {
        throw new Error(t("missingStreamingResponseContent"));
      }
    }

    function finalizeAbortedAssistantMessage(chat, assistantMessage) {
      const hasVisibleContent = assistantMessage.content.trim() && !isStreamingThinkingPlaceholder(assistantMessage.content);

      if (!hasVisibleContent) {
        chat.messages = chat.messages.filter((message) => message.id !== assistantMessage.id);
        chat.updatedAt = new Date().toISOString();
        renderAppSections({
          chatList: true,
          activeChat: true,
          composerControls: true
        });
        return;
      }

      assistantMessage.status = "complete";
      assistantMessage.isThinking = false;
      assistantMessage.timestamp = new Date().toISOString();
      chat.updatedAt = assistantMessage.timestamp;
      persistState();
      replaceMessageArticleDom(chat, assistantMessage, { scrollToBottom: streamingAutoScrollPinnedToBottom });
      renderChatList();
    }

    function isAbortError(error) {
      return error?.name === "AbortError";
    }

    function applyStreamChunk(chunk, assistantMessage, chat, helpers) {
      const lines = chunk.split("\n");
      const dataLines = lines
        .map((line) => line.trim())
        .filter((line) => line.startsWith("data:"))
        .map((line) => line.slice(5).trim());

      if (!dataLines.length) {
        return false;
      }

      const data = dataLines.join("\n");
      if (data === "[DONE]") {
        return true;
      }

      let payload;
      try {
        payload = JSON.parse(data);
      } catch {
        return false;
      }

      const choice = payload?.choices?.[0] || {};
      const delta = choice.delta || {};
      const thinkingText = extractThinkingText(delta);
      const contentText = extractDeltaText(delta.content);
      const usageChanged = applyTokenUsageToMessage(
        assistantMessage,
        payload?.usage || payload?.x_groq?.usage || choice?.usage
      );
      let changed = false;
      const hasVisibleContent = helpers.hasVisibleContentRef();
      const isThinkingOnlyChunk = Boolean(thinkingText && !contentText && !hasVisibleContent);
      const streamingThinkingPlaceholder = getStreamingThinkingPlaceholder();

      if (thinkingText && !hasVisibleContent) {
        const thinkingStateChanged = !assistantMessage.isThinking || assistantMessage.content !== streamingThinkingPlaceholder;
        assistantMessage.isThinking = true;
        assistantMessage.content = streamingThinkingPlaceholder;
        if (thinkingStateChanged) {
          lastThinkingStreamingRenderAt = Date.now();
          changed = true;
        } else if (shouldRefreshThinkingStreamingCard()) {
          changed = true;
        }
      }

      if (contentText) {
        if (!hasVisibleContent) {
          assistantMessage.content = "";
          helpers.setHasVisibleContent(true);
        }
        assistantMessage.isThinking = false;
        lastThinkingStreamingRenderAt = 0;
        assistantMessage.content += contentText;
        assistantMessage.content = sanitizeChatModeFakeImageToolCallOutput(assistantMessage.content, chat);
        changed = true;
      }

      if (usageChanged && (!isThinkingOnlyChunk || changed || shouldRefreshThinkingStreamingCard())) {
        changed = true;
      }

      if (changed) {
        assistantMessage.timestamp = new Date().toISOString();
        chat.updatedAt = assistantMessage.timestamp;
        if (shouldPersistStreamingProgress()) {
          persistState();
        }
        updateStreamingMessageDom(assistantMessage);
      }

      return false;
    }

    function shouldRefreshThinkingStreamingCard() {
      const now = Date.now();
      if (now - lastThinkingStreamingRenderAt < THINKING_STREAMING_RENDER_THROTTLE_MS) {
        return false;
      }

      lastThinkingStreamingRenderAt = now;
      return true;
    }

    function shouldPersistStreamingProgress() {
      const now = Date.now();
      if (now - lastStreamingPersistRequestAt < STREAMING_PERSIST_MIN_INTERVAL_MS) {
        return false;
      }

      lastStreamingPersistRequestAt = now;
      return true;
    }

    function updateStreamingMessageDom(message) {
      pendingStreamingMessageRender = message;
      if (streamingRenderTimeoutId) {
        return;
      }

      const renderThrottleMs = state.settings.smoothStreaming === false
        ? STREAMING_RENDER_THROTTLE_MS
        : SMOOTH_STREAMING_RENDER_THROTTLE_MS;
      const elapsed = Date.now() - lastStreamingMessageRenderAt;
      if (elapsed < renderThrottleMs) {
        streamingRenderTimeoutId = window.setTimeout(() => {
          streamingRenderTimeoutId = 0;
          updateStreamingMessageDom(message);
        }, renderThrottleMs - elapsed);
        return;
      }

      if (streamingMessageRenderFrameId) {
        return;
      }

      streamingMessageRenderFrameId = window.requestAnimationFrame(() => {
        streamingMessageRenderFrameId = 0;
        lastStreamingMessageRenderAt = Date.now();
        const nextMessage = pendingStreamingMessageRender;
        pendingStreamingMessageRender = null;
        if (!nextMessage) {
          return;
        }

        performStreamingMessageDomUpdate(nextMessage);
      });
    }

    function performStreamingMessageDomUpdate(message) {
      const refs = getMessageArticleElements(message.id);
      if (!refs?.article) {
        renderActiveChat();
        return;
      }

      const timeElement = refs.timeElement;
      if (timeElement) {
        timeElement.textContent = formatDate(message.timestamp, true);
      }

      const contentElement = refs.contentElement;
      if (contentElement) {
        renderMessageContent(contentElement, message, getActiveChat());
      }

      if (message.role === "assistant") {
        const footer = refs.footerElement;
        const nextFooter = createAssistantFooter(message);
        if (footer) {
          footer.replaceWith(nextFooter);
        } else {
          refs.article.appendChild(nextFooter);
        }
        refs.footerElement = nextFooter;
      }

      if (shouldAutoScrollDuringStreaming()) {
        scheduleStreamingAutoScroll();
      }
    }

    function replaceMessageArticleDom(chat, message, options = {}) {
      const { scrollToBottom = true } = options;
      const refs = getMessageArticleElements(message.id);
      if (!refs?.article) {
        const article = buildMessageArticle(chat, message);
        elements.messageStream.appendChild(article);
        cacheMessageArticleElements(article);
      } else {
        refs.article.classList.toggle("editing", isEditingMessage(message.id));

        const timeElement = refs.timeElement;
        if (timeElement) {
          timeElement.textContent = formatDate(message.timestamp, true);
        }

        const contentElement = refs.contentElement;
        if (contentElement) {
          renderMessageContent(contentElement, message, chat);
        }

        const metaActions = refs.metaActionsElement;
        if (metaActions) {
          const nextMetaActions = buildMessageMetaActions(chat, message);
          metaActions.replaceWith(nextMetaActions);
          refs.metaActionsElement = nextMetaActions;
        }

        if (message.role === "assistant") {
          const footer = refs.footerElement;
          const nextFooter = createAssistantFooter(message);
          if (footer) {
            footer.replaceWith(nextFooter);
          } else {
            refs.article.appendChild(nextFooter);
          }
          refs.footerElement = nextFooter;
        }
      }

      if (!scrollToBottom) {
        return;
      }

      requestAnimationFrame(() => {
        scrollPageToMessageEnd();
      });
    }

    function handleComposerKeydown(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        elements.chatForm.requestSubmit();
      }
    }

    function createMessage(role, content, overrides = {}) {
      return {
        id: createId("msg"),
        role,
        content,
        attachments: [],
        timestamp: new Date().toISOString(),
        status: "complete",
        isThinking: false,
        isFirstMessage: false,
        characterCardId: isRpModeActive() ? (getActiveRpCharacter()?.id || "") : "",
        personaCardId: isRpModeActive() ? (getActiveRpPersona()?.id || "") : "",
        ...overrides
      };
    }

    function createAssistantFooter(message) {
      const footer = createElementWithClass("div", "message-footer");

      const state = createElementWithClass("div", "message-state");

      if (message.status === "streaming") {
        const spinner = createElementWithClass("span", "message-state-spinner");
        const label = createElementWithClass("span", "", message.isThinking ? t("streamingThinking") : t("streamingResponse"));
        state.append(spinner, label);
      } else {
        const dot = createElementWithClass("span", "message-state-dot");
        if (message.status === "error") {
          dot.classList.add("error");
        } else if (hasAssistantAuxiliaryStatus(message)) {
          dot.classList.add("processing");
        }
        const label = createElementWithClass("span", "", message.status === "error"
          ? t("requestFailed")
          : message.isFirstMessage
            ? t("firstMessageStatus")
            : getAssistantFooterStatusText(message));
        state.append(dot, label);
      }

      footer.appendChild(state);

      const tokenUsageText = formatMessageTokenUsage(message);
      if (tokenUsageText) {
        const usage = createElementWithClass("div", "message-token-usage", tokenUsageText);
        usage.title = tokenUsageText;
        footer.appendChild(usage);
      }

      return footer;
    }

    function getAssistantFooterStatusText(message) {
      const auxiliaryStatus = getAssistantAuxiliaryStatusKey(message);
      if (auxiliaryStatus) {
        return t(auxiliaryStatus);
      }

      return t("responseComplete");
    }

    function hasAssistantAuxiliaryStatus(message) {
      return Boolean(getAssistantAuxiliaryStatusKey(message));
    }

    function getAssistantAuxiliaryStatusKey(message) {
      return String(message?.auxiliaryStatus || "").trim();
    }

    function shouldDeferAssistantIllustrationImage(message, chat) {
      if (!message || message.role !== "assistant" || !chat) {
        return false;
      }

      const eagerMessageIds = getEagerAssistantImageMessageIds(chat);
      return !eagerMessageIds.has(message.id);
    }

    function getEagerAssistantImageMessageIds(chat) {
      const eagerIds = new Set();
      const messages = Array.isArray(chat?.messages) ? chat.messages : [];
      for (let index = messages.length - 1; index >= 0 && eagerIds.size < EAGER_ASSISTANT_IMAGE_LIMIT; index -= 1) {
        const message = messages[index];
        const illustration = normalizeMessageIllustration(message?.illustration);
        if (message?.role === "assistant" && illustration?.status === "complete" && (illustration.image?.dataUrl || illustration.image?.mediaId)) {
          eagerIds.add(message.id);
        }
      }
      return eagerIds;
    }

    function getScrollRoot() {
      return document.scrollingElement || document.documentElement;
    }

    function isPageNearBottom(threshold = 160) {
      const scrollRoot = getScrollRoot();
      return scrollRoot.scrollHeight - scrollRoot.scrollTop - scrollRoot.clientHeight < threshold;
    }

    function scrollPageToTop() {
      const scrollRoot = getScrollRoot();
      scrollRoot.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function scrollPageToBottom() {
      const scrollRoot = getScrollRoot();
      scrollRoot.scrollTo({
        top: scrollRoot.scrollHeight,
        behavior: "smooth"
      });
    }

    function scrollPageToMessageEnd() {
      const scrollRoot = getScrollRoot();
      scrollRoot.scrollTo({
        top: scrollRoot.scrollHeight,
        behavior: "auto"
      });
    }

    function shouldAutoScrollDuringStreaming() {
      return state.settings.smoothStreaming !== false || streamingAutoScrollPinnedToBottom;
    }

    function scheduleStreamingAutoScroll() {
      if (streamingAutoScrollFrameId) {
        return;
      }

      streamingAutoScrollFrameId = window.requestAnimationFrame(() => {
        streamingAutoScrollFrameId = 0;
        if (!shouldAutoScrollDuringStreaming()) {
          return;
        }

        scrollPageToMessageEnd();
      });
    }

    function clearStreamingContentRenderState(element) {
      if (!element?.dataset) {
        return;
      }

      delete element.dataset.streamingMode;
      delete element.dataset.streamingContent;
    }

    function renderStreamingAssistantContent(element, message) {
      const nextContent = getAssistantDisplayContent(message);
      const previousContent = element.dataset.streamingContent || "";
      const existingBlock = element.firstElementChild;
      const canAppendTail = existingBlock?.classList.contains("message-streaming-text")
        && element.dataset.streamingMode === "plain"
        && nextContent.startsWith(previousContent);

      if (!canAppendTail) {
        const block = document.createElement("div");
        block.className = "message-streaming-text";
        block.textContent = nextContent;
        element.replaceChildren(block);
      } else if (nextContent.length > previousContent.length) {
        existingBlock.textContent += nextContent.slice(previousContent.length);
      }

      element.dataset.streamingMode = "plain";
      element.dataset.streamingContent = nextContent;
    }

    function renderMessageContent(element, message, chat = null) {
      if (isEditingMessage(message.id)) {
        clearStreamingContentRenderState(element);
        renderMessageEditor(element, message);
        return;
      }

      if (message.role === "user") {
        clearStreamingContentRenderState(element);
        renderUserMessageContent(element, message);
        return;
      }

      if (message.role !== "assistant") {
        clearStreamingContentRenderState(element);
        element.textContent = message.content;
        return;
      }

      if (message.status === "streaming") {
        renderStreamingAssistantContent(element, message);
        return;
      }

      clearStreamingContentRenderState(element);

      const renderResult = renderAssistantMessageHtml(message, {
        enableMath: message.status !== "streaming"
      });
      element.innerHTML = renderResult.html;
      if (renderResult.shouldRenderMath) {
        renderMathContent(element);
      }
      const illustration = buildMessageIllustrationElement(message, chat);
      if (illustration) {
        element.appendChild(illustration);
      }
      const rpSceneState = buildMessageRpSceneStateElement(message);
      if (rpSceneState) {
        element.appendChild(rpSceneState);
      }
    }

    function buildMessageRpSceneStateElement(message) {
      const sceneState = String(message?.rpSceneState || "").trim();
      if (!sceneState || message?.role !== "assistant") {
        return null;
      }
      const displaySceneState = replaceRpPromptPlaceholders(sceneState, getMessageRpPlaceholders(message));

      const container = document.createElement("div");
      container.className = "message-rp-state";

      const contentId = createId("rp-state-content");
      const toggle = createButton({
        className: "message-rp-state-toggle",
        textContent: t("rpSceneStateToggleShow"),
        attributes: {
          "aria-expanded": "false",
          "aria-controls": contentId
        }
      });

      const content = document.createElement("pre");
      content.id = contentId;
      content.className = "message-rp-state-content";
      content.hidden = true;
      content.textContent = `${t("rpSceneStateLabel")}\n${displaySceneState}`;

      toggle.addEventListener("click", () => {
        const expanded = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", expanded ? "false" : "true");
        toggle.textContent = expanded ? t("rpSceneStateToggleShow") : t("rpSceneStateToggleHide");
        content.hidden = expanded;
      });

      container.append(toggle, content);
      return container;
    }

    function buildMessageIllustrationElement(message, chat = null) {
      const illustration = normalizeMessageIllustration(message?.illustration);
      if (!illustration) {
        return null;
      }
      const isRpIllustration = isRpChat(chat) || Boolean(message?.characterCardId);

      const container = document.createElement("div");
      container.className = "message-illustration";

      const header = document.createElement("div");
      header.className = "message-illustration-header";

      const title = document.createElement("div");
      title.className = "message-illustration-title";
      title.textContent = t(isRpIllustration ? "generatedIllustration" : "generatedImage");
      header.appendChild(title);

      const regenerateButton = createIconButton({
        className: "message-action-button message-illustration-action",
        label: t("regenerateIllustration"),
        iconName: "reroll",
        disabled: illustration.status === "generating",
        onClick: () => regenerateMessageIllustration(message.id)
      });
      header.appendChild(regenerateButton);
      container.appendChild(header);

      if (illustration.status === "generating") {
        const placeholder = document.createElement("div");
        placeholder.className = "message-illustration-placeholder";
        placeholder.textContent = t(isRpIllustration ? "illustrationGenerating" : "imageGenerating");
        container.appendChild(placeholder);
        return container;
      }

      if (illustration.status === "error") {
        const error = document.createElement("div");
        error.className = "message-illustration-error";
        error.textContent = t("illustrationError", { error: illustration.error || t("requestFailed") });
        container.appendChild(error);
        return container;
      }

      if (illustration.image?.dataUrl || illustration.image?.mediaId) {
        const grid = buildUserAttachmentGrid([illustration.image], {
          showCaptions: false,
          deferImages: shouldDeferAssistantIllustrationImage(message, chat)
        });
        container.appendChild(grid);
        return container;
      }

      return null;
    }

    function renderAssistantMessageHtml(message, options = {}) {
      const { enableMath = true } = options;
      const canUseCache = message.status !== "streaming";
      const displayContent = getAssistantDisplayContent(message);
      if (canUseCache) {
        const cached = assistantMessageHtmlCache.get(message);
        if (cached && cached.sourceContent === message.content && cached.displayContent === displayContent) {
          return {
            html: cached.html,
            shouldRenderMath: enableMath && cached.hasMath
          };
        }
      }

      const html = markdownToHtml(displayContent);
      const hasMath = enableMath && containsRenderableMath(displayContent);
      if (canUseCache) {
        assistantMessageHtmlCache.set(message, {
          sourceContent: message.content,
          displayContent,
          html,
          hasMath
        });
      }

      return {
        html,
        shouldRenderMath: hasMath
      };
    }

    function renderMathContent(element) {
      if (typeof window.renderMathInElement !== "function") {
        return;
      }

      window.renderMathInElement(element, {
        delimiters: MATH_RENDER_DELIMITERS,
        ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "option"],
        throwOnError: false,
        strict: "ignore"
      });
    }

    function containsRenderableMath(text) {
      const source = String(text || "");
      if (!source) {
        return false;
      }

      return MATH_RENDER_DELIMITERS.some((delimiter) => source.includes(delimiter.left));
    }

    function renderUserMessageContent(element, message) {
      const stack = createElementWithClass("div", "message-user-stack");

      if (message.status === "enhancing") {
        stack.appendChild(createElementWithClass("div", "message-user-text", t("rpInputEnhancingCard")));
        element.replaceChildren(stack);
        return;
      }

      const contentText = String(message.content || "");
      if (contentText) {
        stack.appendChild(createElementWithClass("div", "message-user-text", contentText));
      }

      if (Array.isArray(message.attachments) && message.attachments.length) {
        stack.appendChild(buildUserAttachmentGrid(message.attachments));
      }

      if (!contentText && Array.isArray(message.attachments) && message.attachments.length) {
        stack.insertBefore(createElementWithClass("div", "message-image-only-label", t("imageOnly")), stack.firstChild);
      }

      element.replaceChildren(stack);
    }

    function buildUserAttachmentGrid(attachments, options = {}) {
      const showCaptions = options.showCaptions !== false;
      const deferImages = options.deferImages === true;
      const grid = document.createElement("div");
      grid.className = "message-image-grid";

      attachments.forEach((attachment) => {
        const figure = document.createElement("figure");
        figure.className = "message-image-card";

        const button = createButton({
          className: "message-image-button",
          label: t("previewWithName", { name: attachment.name }),
          title: t("clickToPreview"),
          onClick: () => openImagePreview(attachment)
        });

        const image = document.createElement("img");
        image.alt = attachment.name;
        image.loading = "lazy";

        button.appendChild(image);
        queueImageElementSource(image, attachment, { defer: deferImages });
        figure.appendChild(button);
        if (showCaptions) {
          const caption = document.createElement("figcaption");
          caption.textContent = attachment.name;
          figure.appendChild(caption);
        }
        grid.appendChild(figure);
      });

      return grid;
    }

    function renderMessageEditor(element, message) {
      const editor = document.createElement("textarea");
      editor.className = "message-content-editor";
      editor.value = message.content;
      editor.setAttribute("aria-label", "메시지 수정");
      element.replaceChildren(editor);
    }

    function isEditableMessage(message) {
      return (message?.role === "user" || message?.role === "assistant") && message.status !== "enhancing";
    }

    function isEditingMessage(messageId) {
      return Boolean(messageId) && editingMessageId === messageId;
    }

    function hasEditingMessageInChat(chat) {
      return Boolean(chat && editingMessageId && chat.messages.some((message) => message.id === editingMessageId));
    }

    function toggleMessageEditing(chatId, messageId) {
      if (isSending) {
        return;
      }

      const chat = findChatById(chatId);
      const message = chat?.messages.find((item) => item.id === messageId) || null;
      if (!chat || !message || !isEditableMessage(message)) {
        return;
      }

      if (isEditingMessage(messageId)) {
        saveEditedMessage(chat, message);
        return;
      }

      if (hasEditingMessageInChat(chat)) {
        setChatStatus(t("saveOpenMessageEditFirst"), "error");
        focusMessageEditor(editingMessageId);
        return;
      }

      const previousEditingMessageId = editingMessageId;
      editingMessageId = messageId;

      if (previousEditingMessageId && previousEditingMessageId !== messageId) {
        rerenderMessageById(chat, previousEditingMessageId, { scrollToBottom: false });
      }

      replaceMessageArticleDom(chat, message, { scrollToBottom: false });
      refreshActiveMessageMetaActions();
      renderComposerControls();
      focusMessageEditor(messageId);
    }

    function saveEditedMessage(chat, message) {
      const article = getMessageArticleElements(message.id)?.article;
      const editor = article?.querySelector(".message-content-editor");
      const nextContent = normalizeMessageEditorValue(editor?.value ?? message.content);

      if (!nextContent.trim() && !normalizeImageAttachments(message.attachments).length) {
        setChatStatus(t("emptyMessageCannotSave"), "error");
        if (editor) {
          editor.focus();
        }
        return;
      }

      message.content = nextContent;
      message.timestamp = new Date().toISOString();
      chat.updatedAt = message.timestamp;
      editingMessageId = "";
      persistState();
      replaceMessageArticleDom(chat, message, { scrollToBottom: false });
      renderChatList();
      refreshActiveMessageMetaActions();
      renderComposerControls();
      setChatStatus(t("messageUpdatedToast"), "success");
    }

    function rerenderMessageById(chat, messageId, options = {}) {
      const message = chat?.messages.find((item) => item.id === messageId);
      if (!message) {
        return;
      }

      replaceMessageArticleDom(chat, message, options);
    }

    function focusMessageEditor(messageId) {
      requestAnimationFrame(() => {
        const editor = getMessageArticleElements(messageId)?.article?.querySelector(".message-content-editor");
        if (!editor) {
          return;
        }

        editor.focus();
        const textLength = editor.value.length;
        editor.setSelectionRange(textLength, textLength);
      });
    }

    function normalizeMessageEditorValue(value) {
      return String(value || "").replace(/\r\n?/g, "\n");
    }

    async function handleImageUploadSelection(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) {
        return;
      }

      try {
        files.forEach(validateImageUploadFile);

        const currentPendingBytes = sumImageAttachmentBytes(pendingImageAttachments);
        const nextAttachments = await Promise.all(files.map(readImageAttachmentFile));
        const nextBytes = sumImageAttachmentBytes(nextAttachments);
        if (currentPendingBytes + nextBytes > MAX_PENDING_IMAGE_BYTES) {
          throw new Error(t("imageSizeLimitExceeded", { bytes: formatByteSize(MAX_PENDING_IMAGE_BYTES) }));
        }

        pendingImageAttachments.push(...nextAttachments);
        renderComposerAttachments();
        renderComposerControls();
        setChatStatus(t("imagesAttached", { count: nextAttachments.length }), "success");
      } catch (error) {
        console.error("Failed to read image attachments", error);
        setChatStatus(t("imageAttachFailed", { error: error.message }), "error");
      } finally {
        elements.imageUploadInput.value = "";
      }
    }

    function removePendingAttachment(attachmentId) {
      pendingImageAttachments = pendingImageAttachments.filter((attachment) => attachment.id !== attachmentId);
      renderComposerAttachments();
      renderComposerControls();
    }

    function clearPendingImageAttachments() {
      pendingImageAttachments = [];
      elements.imageUploadInput.value = "";
      renderComposerAttachments();
      renderComposerControls();
    }

    async function readImageAttachmentFile(file) {
      validateImageUploadFile(file);

      const preparedImage = await prepareImageAttachment(file);
      return {
        id: createId("img"),
        name: file.name || "image",
        mimeType: preparedImage.mimeType,
        sizeBytes: preparedImage.sizeBytes,
        dataUrl: preparedImage.dataUrl
      };
    }

    function cloneImageAttachment(attachment) {
      return {
        id: typeof attachment?.id === "string" && attachment.id ? attachment.id : createId("img"),
        mediaId: typeof attachment?.mediaId === "string" ? attachment.mediaId : "",
        name: typeof attachment?.name === "string" && attachment.name ? attachment.name : "image",
        mimeType: typeof attachment?.mimeType === "string" && attachment.mimeType ? attachment.mimeType : "image/png",
        sizeBytes: normalizeOptionalInteger(attachment?.sizeBytes, { min: 0 }) ?? estimateImageAttachmentBytes(attachment?.dataUrl),
        dataUrl: typeof attachment?.dataUrl === "string" ? attachment.dataUrl : ""
      };
    }

    function normalizeImageAttachments(attachments) {
      return Array.isArray(attachments)
        ? attachments
          .map(cloneImageAttachment)
          .filter((attachment) => attachment.dataUrl || attachment.mediaId)
        : [];
    }

    function validateImageUploadFile(file) {
      if (!file || !/^image\//i.test(file.type)) {
        throw new Error(t("imageFilesOnly"));
      }
    }

    function validateImportFileSize(file) {
      const fileSize = normalizeOptionalInteger(file?.size, { min: 0 }) ?? 0;
      if (fileSize > MAX_PENDING_IMAGE_BYTES) {
        throw new Error(t("importFileSizeLimitExceeded", { bytes: formatByteSize(MAX_PENDING_IMAGE_BYTES) }));
      }
    }

    async function prepareImportedImageAttachment(attachment) {
      const normalizedAttachment = cloneImageAttachment(attachment);
      const parsedImage = parseSupportedImageDataUrl(normalizedAttachment.dataUrl);
      validateImportedImageSize(parsedImage.sizeBytes);

      const image = await loadImageElement(parsedImage.dataUrl);
      const naturalWidth = Math.max(1, image.naturalWidth || image.width || 1);
      const naturalHeight = Math.max(1, image.naturalHeight || image.height || 1);
      const resizePlan = getIntegerResizePlan(naturalWidth, naturalHeight, MAX_IMAGE_DIMENSION);
      const preparedImage = resizeImageDataUrl(
        image,
        parsedImage.mimeType,
        resizePlan.shouldResize ? resizePlan.width : naturalWidth,
        resizePlan.shouldResize ? resizePlan.height : naturalHeight
      );
      validateImportedImageSize(preparedImage.sizeBytes);

      return {
        id: normalizedAttachment.id,
        name: normalizedAttachment.name,
        mimeType: preparedImage.mimeType,
        sizeBytes: preparedImage.sizeBytes,
        dataUrl: preparedImage.dataUrl
      };
    }

    function parseSupportedImageDataUrl(dataUrl) {
      const match = String(dataUrl || "").trim().match(/^data:([^;,]+);base64,([\s\S]+)$/i);
      const mimeType = normalizeSupportedImageMimeType(match?.[1]);
      if (!match || !mimeType) {
        throw new Error(t("unsupportedImportedImageFormat"));
      }

      const base64 = match[2].replace(/\s+/g, "");
      if (!base64 || !/^[A-Za-z0-9+/]*={0,2}$/.test(base64)) {
        throw new Error(t("unsupportedImportedImageFormat"));
      }

      const normalizedDataUrl = `data:${mimeType};base64,${base64}`;
      return {
        mimeType,
        dataUrl: normalizedDataUrl,
        sizeBytes: estimateImageAttachmentBytes(normalizedDataUrl)
      };
    }

    function validateImportedImageSize(sizeBytes) {
      if ((normalizeOptionalInteger(sizeBytes, { min: 0 }) ?? 0) > MAX_PENDING_IMAGE_BYTES) {
        throw new Error(t("importedImageSizeLimitExceeded", { bytes: formatByteSize(MAX_PENDING_IMAGE_BYTES) }));
      }
    }

    function normalizeSupportedImageMimeType(mimeType) {
      const value = String(mimeType || "").trim().toLowerCase();
      if (/^image\/jpe?g$/.test(value)) {
        return "image/jpeg";
      }
      if (value === "image/png" || value === "image/webp") {
        return value;
      }
      return "";
    }

    async function prepareImageAttachment(file) {
      const dataUrl = await readFileAsDataUrl(file);
      const image = await loadImageElement(dataUrl);
      const resizePlan = getIntegerResizePlan(image.naturalWidth, image.naturalHeight, MAX_IMAGE_DIMENSION);

      if (!resizePlan.shouldResize) {
        return {
          mimeType: file.type || "image/png",
          sizeBytes: normalizeOptionalInteger(file.size, { min: 0 }) ?? estimateImageAttachmentBytes(dataUrl),
          dataUrl
        };
      }

      return resizeImageDataUrl(image, file.type || "image/png", resizePlan.width, resizePlan.height);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result !== "string") {
            reject(new Error("이미지를 읽지 못했습니다."));
            return;
          }

          resolve(reader.result);
        };
        reader.onerror = () => reject(new Error("이미지를 읽는 중 오류가 발생했습니다."));
        reader.readAsDataURL(file);
      });
    }

    function loadImageElement(dataUrl) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("이미지 해상도를 확인하지 못했습니다."));
        image.src = dataUrl;
      });
    }

    function getIntegerResizePlan(width, height, maxDimension) {
      const normalizedWidth = normalizeOptionalInteger(width, { min: 1 }) ?? 0;
      const normalizedHeight = normalizeOptionalInteger(height, { min: 1 }) ?? 0;
      const limit = normalizeOptionalInteger(maxDimension, { min: 1 }) ?? MAX_IMAGE_DIMENSION;
      const largestSide = Math.max(normalizedWidth, normalizedHeight);

      if (!largestSide || largestSide < limit) {
        return {
          shouldResize: false,
          width: normalizedWidth,
          height: normalizedHeight,
          divisor: 1
        };
      }

      const divisor = Math.max(1, Math.ceil(largestSide / limit));
      return {
        shouldResize: divisor > 1,
        width: Math.max(1, Math.round(normalizedWidth / divisor)),
        height: Math.max(1, Math.round(normalizedHeight / divisor)),
        divisor
      };
    }

    function resizeImageDataUrl(image, mimeType, width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext("2d", { alpha: true });
      if (!context) {
        throw new Error(t("resizeCanvasUnavailable"));
      }

      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.drawImage(image, 0, 0, width, height);

      const safeMimeType = /^image\/(png|jpeg|webp)$/i.test(mimeType) ? mimeType.toLowerCase() : "image/png";
      const dataUrl = canvas.toDataURL(safeMimeType);

      return {
        mimeType: safeMimeType,
        sizeBytes: estimateImageAttachmentBytes(dataUrl),
        dataUrl
      };
    }

    function cropImageDataUrl(image, mimeType, sourceX, sourceY, sourceSize, outputSize) {
      const safeOutputSize = Math.max(1, Math.round(outputSize));
      const canvas = document.createElement("canvas");
      canvas.width = safeOutputSize;
      canvas.height = safeOutputSize;

      const context = canvas.getContext("2d", { alpha: true });
      if (!context) {
        throw new Error(t("cropCanvasUnavailable"));
      }

      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.drawImage(image, sourceX, sourceY, sourceSize, sourceSize, 0, 0, safeOutputSize, safeOutputSize);

      const safeMimeType = /^image\/(png|jpeg|webp)$/i.test(mimeType) ? mimeType.toLowerCase() : "image/png";
      const dataUrl = canvas.toDataURL(safeMimeType);

      return {
        mimeType: safeMimeType,
        sizeBytes: estimateImageAttachmentBytes(dataUrl),
        dataUrl
      };
    }

    function clampNumber(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function sumImageAttachmentBytes(attachments) {
      return normalizeImageAttachments(attachments)
        .reduce((total, attachment) => total + (attachment.sizeBytes || 0), 0);
    }

    function estimateImageAttachmentBytes(dataUrl) {
      const payload = extractBase64Payload(dataUrl);
      if (!payload) {
        return 0;
      }

      const padding = payload.endsWith("==") ? 2 : payload.endsWith("=") ? 1 : 0;
      return Math.max(0, Math.floor((payload.length * 3) / 4) - padding);
    }

    function formatByteSize(bytes) {
      const value = Math.max(0, Number(bytes) || 0);
      if (value < 1024) {
        return `${value}B`;
      }

      if (value < 1024 * 1024) {
        return `${(value / 1024).toFixed(1).replace(/\.0$/, "")}KB`;
      }

      return `${(value / (1024 * 1024)).toFixed(1).replace(/\.0$/, "")}MB`;
    }

    function markdownToHtml(markdown) {
      const lines = String(markdown || "")
        .replace(/\r\n?/g, "\n")
        .split("\n");
      const html = [];
      let index = 0;
      let paragraphLines = [];
      let listType = null;
      let listItems = [];

      function flushParagraph() {
        if (!paragraphLines.length) {
          return;
        }

        html.push(`<p>${renderInlineMarkdown(paragraphLines.join("\n"))}</p>`);
        paragraphLines = [];
      }

      function flushList() {
        if (!listItems.length || !listType) {
          return;
        }

        html.push(`<${listType}>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</${listType}>`);
        listType = null;
        listItems = [];
      }

      while (index < lines.length) {
        const rawLine = lines[index];
        const trimmed = rawLine.trim();

        if (!trimmed) {
          flushParagraph();
          flushList();
          index += 1;
          continue;
        }

        if (/^```/.test(trimmed)) {
          flushParagraph();
          flushList();

          const codeLines = [];
          index += 1;
          while (index < lines.length && !/^```/.test(lines[index].trim())) {
            codeLines.push(lines[index]);
            index += 1;
          }
          html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
          index += 1;
          continue;
        }

        if (isMarkdownTable(lines, index)) {
          flushParagraph();
          flushList();

          const table = consumeMarkdownTable(lines, index);
          html.push(table.html);
          index = table.nextIndex;
          continue;
        }

        const headingMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
          flushParagraph();
          flushList();
          const level = Math.min(headingMatch[1].length, 6);
          html.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
          index += 1;
          continue;
        }

        const quoteMatch = rawLine.match(/^>\s?(.*)$/);
        if (quoteMatch) {
          flushParagraph();
          flushList();

          const quoteLines = [];
          while (index < lines.length) {
            const quoteLine = lines[index].match(/^>\s?(.*)$/);
            if (!quoteLine) {
              break;
            }
            quoteLines.push(quoteLine[1]);
            index += 1;
          }
          html.push(`<blockquote><p>${renderInlineMarkdown(quoteLines.join("\n"))}</p></blockquote>`);
          continue;
        }

        const unorderedMatch = trimmed.match(/^[-*]\s+(.*)$/);
        const orderedMatch = trimmed.match(/^\d+\.\s+(.*)$/);
        if (unorderedMatch || orderedMatch) {
          flushParagraph();
          const nextListType = unorderedMatch ? "ul" : "ol";
          if (listType && listType !== nextListType) {
            flushList();
          }
          listType = nextListType;
          listItems.push((unorderedMatch || orderedMatch)[1]);
          index += 1;
          continue;
        }

        if (listType) {
          flushList();
        }

        paragraphLines.push(trimmed);
        index += 1;
      }

      flushParagraph();
      flushList();

      return html.join("");
    }

    function renderInlineMarkdown(text) {
      const normalizedText = String(text || "").replace(/<br\s*\/?>/gi, "\n");
      const protectedMath = protectMathSegments(normalizedText);
      let html = escapeHtml(protectedMath.text);

      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
        return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      });
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      html = html.replace(/(^|\W)\*([^*]+)\*(?=\W|$)/g, "$1<em>$2</em>");
      html = html.replace(/(^|\W)_([^_]+)_(?=\W|$)/g, "$1<em>$2</em>");
      html = html.replace(/\n/g, "<br>");

      return restoreProtectedSegments(html, protectedMath.placeholders);
    }

    function protectMathSegments(text) {
      const placeholders = [];
      let result = "";
      let index = 0;

      while (index < text.length) {
        const segment = readMathSegment(text, index);
        if (!segment) {
          result += text[index];
          index += 1;
          continue;
        }

        const token = `@@MATH${placeholders.length}@@`;
        placeholders.push({
          token,
          value: escapeHtml(segment.value)
        });
        result += token;
        index = segment.end;
      }

      return { text: result, placeholders };
    }

    function readMathSegment(text, startIndex) {
      const delimiter = matchMathDelimiter(text, startIndex);
      if (!delimiter) {
        return null;
      }

      const endIndex = findMathSegmentEnd(text, startIndex + delimiter.left.length, delimiter);
      if (endIndex < 0) {
        return null;
      }

      const value = text.slice(startIndex, endIndex + delimiter.right.length);
      if (delimiter.left === "$" && !looksLikeInlineMath(value.slice(1, -1))) {
        return null;
      }

      return {
        value,
        end: endIndex + delimiter.right.length
      };
    }

    function matchMathDelimiter(text, index) {
      if (text.startsWith("$$", index)) {
        return { left: "$$", right: "$$", allowNewlines: true };
      }

      if (text.startsWith("\\[", index)) {
        return { left: "\\[", right: "\\]", allowNewlines: true };
      }

      if (text.startsWith("\\(", index)) {
        return { left: "\\(", right: "\\)", allowNewlines: false };
      }

      if (text[index] === "$" && text[index - 1] !== "\\" && text[index + 1] !== "$") {
        return { left: "$", right: "$", allowNewlines: false };
      }

      return null;
    }

    function findMathSegmentEnd(text, startIndex, delimiter) {
