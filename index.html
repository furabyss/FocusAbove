      const label = createElementWithClass("span", "message-meta-label", roleLabel(message.role, message));

      const timestamp = createElementWithClass("span", "message-meta-time", formatDate(message.timestamp, true));

      metaMain.append(label);
      if (!(message.role === "assistant" && message.isFirstMessage)) {
        metaMain.appendChild(timestamp);
      }

      const metaActions = buildMessageMetaActions(chat, message);

      meta.append(metaMain, metaActions);

      const content = createElementWithClass("div", "message-content");
      renderMessageContent(content, message, chat);

      const body = createElementWithClass("div", "message-body");
      body.append(meta, content);

      if (message.role === "assistant") {
        body.appendChild(createAssistantFooter(message));
      }

      const avatar = buildRpMessageAvatar(message);
      if (avatar) {
        const shell = createElementWithClass("div", "message-shell");
        if (message.role === "assistant") {
          shell.append(avatar, body);
        } else {
          shell.append(body, avatar);
        }
        article.appendChild(shell);
        return article;
      }

      article.appendChild(body);

      return article;
    }

    function buildRpMessageAvatar(message) {
      if (!isRpModeActive()) {
        return null;
      }

      const profileImage = message.role === "assistant"
        ? getRpCardById("character", message.characterCardId || state.rp.activeCharacterId)?.profileImage
        : message.role === "user"
          ? getRpCardById("persona", message.personaCardId || state.rp.activePersonaId)?.profileImage
          : null;

      if (!profileImage?.dataUrl && !profileImage?.mediaId) {
        return null;
      }

      const avatar = createElementWithClass("div", "message-avatar");
      const image = document.createElement("img");
      image.alt = message.role === "assistant" ? roleLabel("assistant", message) : roleLabel("user", message);
      avatar.appendChild(image);
      queueImageElementSource(image, profileImage);
      return avatar;
    }

    function buildMessageMetaActions(chat, message) {
      const metaActions = createElementWithClass("div", "message-meta-actions");
      const hasPendingMessageEdit = hasEditingMessageInChat(chat);
      const buttonConfigs = [];

      if (isEditableMessage(message)) {
        const isEditing = isEditingMessage(message.id);
        buttonConfigs.push({
          className: "message-action-button",
          label: isEditing ? t("saveEdit") : t("edit"),
          iconName: isEditing ? "check" : "edit",
          active: isEditing,
          disabled: isSending || (hasPendingMessageEdit && !isEditing),
          onClick: () => toggleMessageEditing(chat.id, message.id)
        });
      }

      if (canRerollMessage(chat, message.id)) {
        buttonConfigs.push({
          className: "message-action-button",
          label: t("reroll"),
          iconName: "reroll",
          disabled: isSending || hasPendingMessageEdit,
          onClick: () => rerollAssistantResponse(message.id)
        });
      }

      buttonConfigs.push({
        className: "message-action-button",
        label: t("delete"),
        iconName: "trash",
        tone: "danger",
        disabled: isSending || hasPendingMessageEdit,
        onClick: () => deleteMessage(chat.id, message.id)
      });

      buttonConfigs.forEach((config) => {
        metaActions.appendChild(createIconButton(config));
      });

      return metaActions;
    }

    function renderComposerControls() {
      const activeChat = getActiveChat();
      const hasPendingMessageEdit = hasEditingMessageInChat(activeChat);
      elements.sendButton.disabled = hasPendingMessageEdit;
      elements.sendButton.textContent = isSending ? t("stop") : t("send");
      elements.sendButton.title = isSending ? t("stopResponse") : t("send");
      elements.sendButton.classList.toggle("danger-button", isSending);
      elements.messageInput.disabled = isSending;
      elements.imageUploadButton.disabled = isSending;
      elements.imageUploadButton.title = t("imageUploadTitle", {
        dimension: MAX_IMAGE_DIMENSION,
        bytes: formatByteSize(MAX_PENDING_IMAGE_BYTES)
      });
      elements.imageUploadButton.setAttribute("aria-label", t("imageUpload"));
      elements.imageUploadInput.disabled = isSending;
    }

    function renderComposerAttachments() {
      const container = elements.composerAttachments;
      const nextSignature = [
        normalizeAppLanguage(state.settings.language),
        isSending ? "1" : "0",
        pendingImageAttachments.map((attachment) => `${attachment.id}:${attachment.name}:${attachment.sizeBytes || 0}`).join("|")
      ].join("~");

      container.hidden = pendingImageAttachments.length === 0;
      if (composerAttachmentRenderSignature !== nextSignature) {
        container.innerHTML = "";

        pendingImageAttachments.forEach((attachment) => {
          const chip = createElementWithClass("div", "composer-attachment-chip");

          const image = document.createElement("img");
          image.alt = attachment.name;
          chip.appendChild(image);
          queueImageElementSource(image, attachment);

          const removeButton = createIconButton({
            className: "composer-attachment-remove",
            label: `${attachment.name} ${t("remove")}`,
            title: t("remove"),
            iconName: "close",
            disabled: isSending,
            onClick: () => removePendingAttachment(attachment.id)
          });
          chip.appendChild(removeButton);

          chip.appendChild(createElementWithClass("span", "composer-attachment-name", attachment.name));

          container.appendChild(chip);
        });

        composerAttachmentRenderSignature = nextSignature;
      }

      scheduleComposerLayoutUpdate();
    }

    function scheduleComposerLayoutUpdate() {
      if (composerLayoutFrameId) {
        return;
      }

      composerLayoutFrameId = window.requestAnimationFrame(() => {
        composerLayoutFrameId = 0;
        updateComposerLayoutMetrics();
      });
    }

    function updateComposerLayoutMetrics() {
      const composerHeight = Math.ceil(elements.chatForm?.getBoundingClientRect().height || 0);
      const headerHeight = Math.ceil(document.querySelector(".main-header")?.getBoundingClientRect().height || 0);
      const mainPanelRect = document.querySelector(".main-panel")?.getBoundingClientRect();
      const desktopSidebarRect = elements.desktopTabsSidebar?.getBoundingClientRect();
      const viewportWidth = document.documentElement.clientWidth || window.innerWidth || 0;
      if (!composerHeight) {
        return;
      }

      document.documentElement.style.setProperty("--composer-measured-height", `${composerHeight}px`);
      if (headerHeight) {
        document.documentElement.style.setProperty("--header-measured-height", `${headerHeight}px`);
      }
      if (mainPanelRect && viewportWidth) {
        const panelRightGap = Math.round(viewportWidth - mainPanelRect.right);
        document.documentElement.style.setProperty("--chat-pane-measured-right-gap", `${panelRightGap}px`);
      }
      if (desktopSidebarRect?.width) {
        document.documentElement.style.setProperty("--desktop-sidebar-left", `0px`);
        document.documentElement.style.setProperty("--desktop-sidebar-width", `${Math.round(desktopSidebarRect.width)}px`);
      }
    }

    function observeComposerLayout() {
      if (composerResizeObserver || typeof ResizeObserver !== "function" || !elements.chatForm) {
        return;
      }

      composerResizeObserver = new ResizeObserver(() => {
        scheduleComposerLayoutUpdate();
      });
      composerResizeObserver.observe(elements.chatForm);
    }

    function refreshActiveMessageMetaActions() {
      const activeChat = getActiveChat();
      if (!activeChat) {
        return;
      }

      activeChat.messages.forEach((message) => {
        const refs = getMessageArticleElements(message.id);
        if (!refs?.article) {
          return;
        }

        const metaActions = refs.metaActionsElement;
        if (!metaActions) {
          return;
        }

        const nextMetaActions = buildMessageMetaActions(activeChat, message);
        metaActions.replaceWith(nextMetaActions);
        refs.metaActionsElement = nextMetaActions;
      });
    }

    async function handleSettingsSave(event) {
      event.preventDefault();
      const nextLanguage = normalizeAppLanguage(elements.languageSelect.value);
      const previousImageApiBaseUrl = normalizeImageApiBase(state.settings.imageApiBaseUrl);
      const nextImageApiBaseUrl = normalizeImageApiBase(elements.imageApiBaseUrlInput.value) || DEFAULT_SETTINGS.imageApiBaseUrl;

      state.settings.apiBaseUrl = normalizeApiBase(elements.apiBaseUrlInput.value);
      state.settings.apiKey = elements.apiKeyInput.value.trim();
      state.settings.imageApiBaseUrl = nextImageApiBaseUrl;
      state.settings.imageApiKey = elements.imageApiKeyInput.value.trim();
      if (previousImageApiBaseUrl !== nextImageApiBaseUrl) {
        state.imageModels = [];
        state.imageModelsSyncedAt = "";
        if (state.rp?.illustration) {
          state.rp.illustration.imageModel = "";
        }
      }
      state.settings.userAlias = elements.userAliasInput.value.trim() || getDefaultUserAlias(nextLanguage);
      state.settings.modelAlias = elements.modelAliasInput.value.trim() || getDefaultModelAlias(nextLanguage);
      state.settings.language = nextLanguage;
      state.settings.themeMode = normalizeThemeMode(elements.themeModeSelect.value);
      state.settings.smoothStreaming = elements.smoothStreamingInput.checked;
      if (isRpModeActive()) {
        state.rp.responsePerspective = normalizeRpResponsePerspective(elements.rpResponsePerspectiveSelect.value);
        state.rp.responseLength = normalizeRpResponseLength(elements.rpResponseLengthSelect.value);
        state.rp.assistance = {
          summaryEnabled: elements.rpSummaryEnabledInput.checked,
          summaryTokenThreshold: normalizeRpSummaryTokenThreshold(elements.rpSummaryTokenThresholdInput.value),
          summaryMaxTokens: normalizeRpSummaryMaxTokens(elements.rpSummaryMaxTokensInput.value),
          inputEnhancementEnabled: elements.rpInputEnhancementEnabledInput.checked
        };
      }
      try {
        await saveSettingsSecretsFromState();
      } catch (error) {
        console.error("Failed to securely store settings secrets", error);
        setChatStatus(t("secretStorageFailed", { error: error.message }), "error");
        return;
      }
      persistState();
      renderAll({ persist: false });
      populateSettingsForm();
      setChatStatus(t("settingsSaved"), "success");
    }

    async function resetSettingsToDefault() {
      const nextDefaultSettings = createDefaultSettings(detectInitialAppLanguage());
      state.settings.apiBaseUrl = nextDefaultSettings.apiBaseUrl;
      state.settings.apiKey = nextDefaultSettings.apiKey;
      state.settings.imageApiBaseUrl = nextDefaultSettings.imageApiBaseUrl;
      state.settings.imageApiKey = nextDefaultSettings.imageApiKey;
      state.imageModels = [];
      state.imageModelsSyncedAt = "";
      state.settings.userAlias = nextDefaultSettings.userAlias;
      state.settings.modelAlias = nextDefaultSettings.modelAlias;
      state.settings.language = nextDefaultSettings.language;
      state.settings.themeMode = nextDefaultSettings.themeMode;
      state.settings.smoothStreaming = nextDefaultSettings.smoothStreaming;
      state.settings.chatT2iEnabled = nextDefaultSettings.chatT2iEnabled;
      if (isRpModeActive() && state.rp) {
        state.rp.responsePerspective = DEFAULT_RP_RESPONSE_PERSPECTIVE;
        state.rp.responseLength = DEFAULT_RP_RESPONSE_LENGTH;
        state.rp.illustration = { ...DEFAULT_RP_ILLUSTRATION_SETTINGS };
        state.rp.assistance = { ...DEFAULT_RP_ASSISTANCE_SETTINGS };
      }
      try {
        await saveSettingsSecretsFromState();
      } catch (error) {
        console.error("Failed to securely clear settings secrets", error);
        setChatStatus(t("secretStorageFailed", { error: error.message }), "error");
        return;
      }
      populateSettingsForm();
      persistState();
      renderAll({ persist: false });
      setChatStatus(t("generalSettingsRestored"), "success");
    }

    function openAuthorsNoteOverlay() {
      if (!isRpModeActive()) {
        return;
      }

      elements.authorsNoteInput.value = getActiveChatAuthorsNote();
      openOverlay(elements.authorsNoteOverlay);
      window.requestAnimationFrame(() => elements.authorsNoteInput.focus());
    }

    function updateAuthorsNote() {
      const activeChat = getActiveChat();
      if (!activeChat) {
        return;
      }

      activeChat.authorsNote = elements.authorsNoteInput.value;
      activeChat.updatedAt = new Date().toISOString();
      persistState();
      renderAuthorsNoteButton();
      renderChatList();
    }

    function clearAuthorsNote() {
      elements.authorsNoteInput.value = "";
      updateAuthorsNote();
      elements.authorsNoteInput.focus();
      setChatStatus(t("authorsNoteCleared"), "success");
    }

    function getActiveChatAuthorsNote() {
      return String(getActiveChat()?.authorsNote || "").trim();
    }

    function handleModelSettingsSave() {
      if (!modelSettingsDraft) {
        resetModelSettingsDraft();
      }

      state.settings.selectedModel = modelSettingsDraft.selectedModel || "";
      state.settings.auxiliaryModel = modelSettingsDraft.auxiliaryModel || "";
      state.settings.systemPrompt = modelSettingsDraft.systemPrompt || "";
      state.settings.forbiddenWords = normalizeForbiddenWords(modelSettingsDraft.forbiddenWords);
      state.settings.temperature = modelSettingsDraft.temperature;
      state.settings.thinkingUnlimited = modelSettingsDraft.thinkingUnlimited !== false;
      state.settings.thinkingTokenLimit = state.settings.thinkingUnlimited ? null : modelSettingsDraft.thinkingTokenLimit;

      persistState();
      renderAppSections({
        persist: false,
        chatList: true,
        activeChat: true,
        modelSelect: true,
        modelsPanel: true,
        composerControls: true,
        header: true
      });
      resetModelSettingsDraft();
      renderAppSections({ persist: false, modelSelect: true, modelsPanel: true, activeChat: true });
      setChatStatus(t("settingsSaved"), "success");
    }

    function handleIllustrationSettingsSave() {
      if (!state.rp) {
        state.rp = createDefaultRpState();
      }

      state.rp.illustration = readIllustrationSettingsForm();
      state.settings.chatT2iEnabled = elements.chatT2iEnabledInput.checked;
      persistState();
      syncIllustrationControls();
      setChatStatus(t("settingsSaved"), "success");
    }

    function readIllustrationSettingsForm() {
      return {
        enabled: elements.illustrationEnabledInput.checked,
        promptStyle: normalizeIllustrationPromptStyle(elements.illustrationPromptStyleSelect.value),
        artStyle: normalizeIllustrationArtStyle(elements.illustrationArtStyleSelect.value),
        imageModel: elements.imageModelSelect.value || "",
        ignoreNonCharacterPeople: elements.illustrationIgnoreNonCharacterPeopleInput.checked,
        cfgScale: normalizeOptionalNumber(elements.illustrationCfgScaleInput.value, { min: 1, max: 20 }) ?? DEFAULT_RP_ILLUSTRATION_SETTINGS.cfgScale,
        steps: normalizeOptionalInteger(elements.illustrationStepsInput.value, { min: 1, max: 60 }) ?? DEFAULT_RP_ILLUSTRATION_SETTINGS.steps,
        width: normalizeImageGenerationDimension(elements.illustrationWidthInput.value),
        height: normalizeImageGenerationDimension(elements.illustrationHeightInput.value)
      };
    }

    function syncIllustrationControls() {
      const rpEnabled = elements.illustrationEnabledInput.checked;
      const chatT2iEnabled = elements.chatT2iEnabledInput.checked;
      const enabled = rpEnabled || chatT2iEnabled;
      [
        elements.illustrationCfgScaleInput,
        elements.illustrationStepsInput,
        elements.illustrationWidthInput,
        elements.illustrationHeightInput
      ].forEach((input) => {
        input.disabled = !enabled;
      });
      elements.illustrationIgnoreNonCharacterPeopleInput.disabled = !rpEnabled;

      elements.illustrationCfgScaleValue.textContent = String(elements.illustrationCfgScaleInput.value || DEFAULT_RP_ILLUSTRATION_SETTINGS.cfgScale);
      elements.illustrationStepsValue.textContent = String(elements.illustrationStepsInput.value || DEFAULT_RP_ILLUSTRATION_SETTINGS.steps);
      elements.illustrationWidthValue.textContent = String(elements.illustrationWidthInput.value || DEFAULT_RP_ILLUSTRATION_SETTINGS.width);
      elements.illustrationHeightValue.textContent = String(elements.illustrationHeightInput.value || DEFAULT_RP_ILLUSTRATION_SETTINGS.height);
    }

    function ensureSystemThemeWatcher() {
      if (systemThemeMediaQuery || typeof window.matchMedia !== "function") {
        return;
      }

      systemThemeMediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
      const handleSystemThemeChange = () => {
        if (normalizeThemeMode(state.settings.themeMode) === "system") {
          applyThemeMode();
        }
      };

      if (typeof systemThemeMediaQuery.addEventListener === "function") {
        systemThemeMediaQuery.addEventListener("change", handleSystemThemeChange);
        return;
      }

      if (typeof systemThemeMediaQuery.addListener === "function") {
        systemThemeMediaQuery.addListener(handleSystemThemeChange);
      }
    }

    function applyThemeMode() {
      const themeMode = normalizeThemeMode(state.settings.themeMode);
      const resolvedTheme = resolveThemeMode(themeMode);
      document.documentElement.dataset.themeMode = themeMode;
      document.documentElement.dataset.resolvedTheme = resolvedTheme;
    }

    function updateOverlayScrollLock() {
      const hasBlockingOverlay = Boolean(document.querySelector(".overlay-shell.open, .tab-lock-warning.open"));
      document.documentElement.classList.toggle("overlay-open", hasBlockingOverlay);
      document.body.classList.toggle("overlay-open", hasBlockingOverlay);
    }

    function resolveThemeMode(themeMode) {
      if (themeMode === "dark") {
        return "dark";
      }

      if (themeMode === "light") {
        return "light";
      }

      if (typeof systemThemeMediaQuery?.matches === "boolean") {
        return systemThemeMediaQuery.matches ? "dark" : "light";
      }

      return "light";
    }

    function openOverlay(overlay) {
      if (!overlay) {
        return;
      }

      resetOverlayScroll(overlay);
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      updateOverlayScrollLock();
      window.requestAnimationFrame(() => resetOverlayScroll(overlay));
    }

    function resetOverlayScroll(overlay) {
      overlay.scrollTop = 0;
      overlay.querySelectorAll(".panel-inner, .overlay-content, .settings-tab-panel, .card-side, .card-list, .card-edit, .card-pane, .card-fields, .panel-list").forEach((element) => {
        element.scrollTop = 0;
        element.scrollLeft = 0;
      });
    }

    function closeOverlay(overlay) {
      if (!overlay) {
        return;
      }

      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      updateOverlayScrollLock();
    }

    function handleGlobalKeydown(event) {
      if (event.key !== "Escape") {
        return;
      }

      if (elements.rpImageCropOverlay.classList.contains("open")) {
        cancelRpImageCrop({ silent: true });
        return;
      }

      if (elements.imagePreviewOverlay.classList.contains("open")) {
        closeImagePreview();
        return;
      }

      closeOverlay(elements.settingsOverlay);
      closeOverlay(elements.promptPresetOverlay);
      closeOverlay(elements.authorsNoteOverlay);
      closeOverlay(elements.tabsOverlay);
      closeOverlay(elements.characterOverlay);
      closeOverlay(elements.personaOverlay);
    }

    function getLazyImageObserver() {
      if (lazyImageObserver || typeof IntersectionObserver !== "function") {
        return lazyImageObserver;
      }

      lazyImageObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) {
            return;
          }

          lazyImageObserver.unobserve(entry.target);
          const image = entry.target.querySelector("img");
          if (image?.__focusaboveAttachment) {
            void setImageElementSourceFromAttachment(image, image.__focusaboveAttachment);
          }
        });
      }, { rootMargin: LAZY_IMAGE_ROOT_MARGIN });
      return lazyImageObserver;
    }

    async function setImageElementSourceFromAttachment(image, attachment) {
      if (!image || image.dataset.mediaLoaded === "true") {
        return;
      }

      const dataUrl = await resolveImageAttachmentDataUrl(attachment);
      if (!dataUrl || !image.isConnected) {
        return;
      }

      image.src = dataUrl;
      image.dataset.mediaLoaded = "true";
      image.classList.remove("image-loading-placeholder");
      const placeholder = image.previousElementSibling;
      if (placeholder?.classList.contains("message-image-placeholder")) {
        placeholder.remove();
      }
      image.hidden = false;
    }

    function setImageElementPlaceholderSource(image) {
      if (!image || image.dataset.mediaLoaded === "true") {
        return;
      }

      image.classList.add("image-loading-placeholder");
      if (image.getAttribute("src") !== IMAGE_PLACEHOLDER_DATA_URL) {
        image.src = IMAGE_PLACEHOLDER_DATA_URL;
      }
    }

    function handleQueuedImageError(event) {
      const image = event.currentTarget;
      if (!image || image.getAttribute("src") === IMAGE_PLACEHOLDER_DATA_URL) {
        return;
      }

      image.dataset.mediaLoaded = "false";
      setImageElementPlaceholderSource(image);
    }

    function queueImageElementSource(image, attachment, options = {}) {
      image.__focusaboveAttachment = attachment;
      if (image.dataset.mediaErrorBound !== "true") {
        image.addEventListener("error", handleQueuedImageError);
        image.dataset.mediaErrorBound = "true";
      }
      setImageElementPlaceholderSource(image);
      if (options.defer) {
        image.hidden = true;
        const placeholder = document.createElement("div");
        placeholder.className = "message-image-placeholder";
        placeholder.textContent = t("imageLoading");
        image.before(placeholder);
        const observer = getLazyImageObserver();
        if (observer) {
          observer.observe(image.parentElement || image);
          return;
        }
      }

      void setImageElementSourceFromAttachment(image, attachment);
    }

    async function openImagePreview(attachment) {
      const dataUrl = await resolveImageAttachmentDataUrl(attachment);
      if (!dataUrl) {
        return;
      }

      elements.imagePreviewImage.src = dataUrl;
      elements.imagePreviewImage.alt = attachment.name || "확대된 첨부 이미지";
      elements.imagePreviewCaption.textContent = attachment.name || "";
      openOverlay(elements.imagePreviewOverlay);
    }

    function closeImagePreview() {
      closeOverlay(elements.imagePreviewOverlay);
      elements.imagePreviewImage.removeAttribute("src");
      elements.imagePreviewImage.alt = "확대된 첨부 이미지";
      elements.imagePreviewCaption.textContent = "";
    }

    async function openRpImageCrop(kind, file) {
      validateImageUploadFile(file);

      const dataUrl = await readFileAsDataUrl(file);
      const image = await loadImageElement(dataUrl);
      const naturalWidth = Math.max(1, image.naturalWidth || image.width || 1);
      const naturalHeight = Math.max(1, image.naturalHeight || image.height || 1);

      rpImageCropState = {
        kind,
        fileName: file.name || "image",
        mimeType: file.type || "image/png",
        image,
        naturalWidth,
        naturalHeight,
        zoom: 1,
        minZoom: 1,
        maxZoom: 4,
        offsetX: 0,
        offsetY: 0,
        frameSize: 0,
        displayScale: 1,
        dragPointerId: null,
        dragStartClientX: 0,
        dragStartClientY: 0,
        dragStartOffsetX: 0,
        dragStartOffsetY: 0,
        activePointers: new Map(),
        pinchActive: false,
        pinchStartDistance: 0,
        pinchStartZoom: 1,
        pinchStartScale: 1,
        pinchStartOffsetX: 0,
        pinchStartOffsetY: 0,
        pinchStartMidpointX: 0,
        pinchStartMidpointY: 0,
        positionInitialized: false
      };

      elements.rpImageCropImage.src = dataUrl;
      elements.rpImageCropImage.alt = t("cropPreviewAlt");
      elements.rpImageCropMeta.textContent = `${naturalWidth} x ${naturalHeight}px`;
      elements.rpImageCropZoomInput.min = String(rpImageCropState.minZoom);
      elements.rpImageCropZoomInput.max = String(rpImageCropState.maxZoom);
      elements.rpImageCropZoomInput.value = String(rpImageCropState.zoom);
      openOverlay(elements.rpImageCropOverlay);
      renderRpImageCropEditor();
      requestAnimationFrame(renderRpImageCropEditor);
    }

    function cancelRpImageCrop(options = {}) {
      const { silent = false } = options;
      if (!rpImageCropState && !elements.rpImageCropOverlay.classList.contains("open")) {
        return;
      }

      closeOverlay(elements.rpImageCropOverlay);
      elements.rpImageCropViewport.classList.remove("dragging");
      elements.rpImageCropImage.removeAttribute("src");
      elements.rpImageCropImage.alt = t("cropPreviewAlt");
      elements.rpImageCropMeta.textContent = "";
      elements.rpImageCropZoomInput.value = "1";
      elements.rpImageCropZoomValue.textContent = "100%";
      rpImageCropState = null;

      if (!silent) {
        setChatStatus(t("imageCropCanceled"), "success");
      }
    }

    function renderRpImageCropEditor() {
      if (!rpImageCropState || !elements.rpImageCropOverlay.classList.contains("open")) {
        return;
      }

      syncRpImageCropViewportSize();
      const viewportSize = Math.max(1, Math.round(elements.rpImageCropViewport.clientWidth || 320));
      const baseScale = Math.max(viewportSize / rpImageCropState.naturalWidth, viewportSize / rpImageCropState.naturalHeight);
      const displayScale = baseScale * rpImageCropState.zoom;
      const displayWidth = rpImageCropState.naturalWidth * displayScale;
      const displayHeight = rpImageCropState.naturalHeight * displayScale;

      rpImageCropState.frameSize = viewportSize;
      rpImageCropState.displayScale = displayScale;

      if (!rpImageCropState.positionInitialized) {
        rpImageCropState.offsetX = (viewportSize - displayWidth) / 2;
        rpImageCropState.offsetY = (viewportSize - displayHeight) / 2;
        rpImageCropState.positionInitialized = true;
      }

      rpImageCropState.offsetX = clampNumber(rpImageCropState.offsetX, viewportSize - displayWidth, 0);
      rpImageCropState.offsetY = clampNumber(rpImageCropState.offsetY, viewportSize - displayHeight, 0);

      elements.rpImageCropImage.style.width = `${displayWidth}px`;
      elements.rpImageCropImage.style.height = `${displayHeight}px`;
      elements.rpImageCropImage.style.transform = `translate3d(${rpImageCropState.offsetX}px, ${rpImageCropState.offsetY}px, 0)`;
      elements.rpImageCropZoomValue.textContent = `${Math.round(rpImageCropState.zoom * 100)}%`;
    }

    function syncRpImageCropViewportSize() {
      const shell = elements.rpImageCropViewport.parentElement;
      if (!shell) {
        return;
      }

      const shellStyle = window.getComputedStyle(shell);
      const horizontalPadding = parseFloat(shellStyle.paddingLeft) + parseFloat(shellStyle.paddingRight);
      const verticalPadding = parseFloat(shellStyle.paddingTop) + parseFloat(shellStyle.paddingBottom);
      const availableWidth = Math.max(1, shell.clientWidth - horizontalPadding);
      const availableHeight = Math.max(1, shell.clientHeight - verticalPadding);
      const maxViewportSize = window.innerWidth <= 860 ? 360 : 420;
      const viewportSize = Math.max(1, Math.min(maxViewportSize, availableWidth, availableHeight));

      elements.rpImageCropViewport.style.width = `${viewportSize}px`;
      elements.rpImageCropViewport.style.height = `${viewportSize}px`;
    }

    function handleRpImageCropZoomInput(event) {
      const nextZoom = Number(event.target.value);
      updateRpImageCropZoom(nextZoom);
    }

    function updateRpImageCropZoom(nextZoom, focalPoint = null) {
      if (!rpImageCropState) {
        return;
      }

      const clampedZoom = clampNumber(Number.isFinite(nextZoom) ? nextZoom : 1, rpImageCropState.minZoom, rpImageCropState.maxZoom);
      const frameSize = Math.max(1, rpImageCropState.frameSize || Math.round(elements.rpImageCropViewport.clientWidth || 320));
      const fallbackScale = Math.max(frameSize / rpImageCropState.naturalWidth, frameSize / rpImageCropState.naturalHeight);
      const previousScale = Math.max(0.0001, rpImageCropState.displayScale || fallbackScale);
      const focalX = Number.isFinite(focalPoint?.x) ? focalPoint.x : frameSize / 2;
      const focalY = Number.isFinite(focalPoint?.y) ? focalPoint.y : frameSize / 2;
      const centerX = (-rpImageCropState.offsetX + focalX) / previousScale;
      const centerY = (-rpImageCropState.offsetY + focalY) / previousScale;
      const nextScale = fallbackScale * clampedZoom;

      rpImageCropState.zoom = clampedZoom;
      rpImageCropState.offsetX = focalX - centerX * nextScale;
      rpImageCropState.offsetY = focalY - centerY * nextScale;
      elements.rpImageCropZoomInput.value = String(clampedZoom);
      renderRpImageCropEditor();
    }

    function handleRpImageCropPointerDown(event) {
      if (!rpImageCropState || event.button !== 0) {
        return;
      }

      rpImageCropState.activePointers.set(event.pointerId, {
        clientX: event.clientX,
        clientY: event.clientY
      });

      if (elements.rpImageCropViewport.setPointerCapture) {
        elements.rpImageCropViewport.setPointerCapture(event.pointerId);
      }

      if (rpImageCropState.activePointers.size >= 2) {
        beginRpImageCropPinch();
        elements.rpImageCropViewport.classList.add("dragging");
        event.preventDefault();
        return;
      }

      rpImageCropState.dragPointerId = event.pointerId;
      rpImageCropState.dragStartClientX = event.clientX;
      rpImageCropState.dragStartClientY = event.clientY;
      rpImageCropState.dragStartOffsetX = rpImageCropState.offsetX;
      rpImageCropState.dragStartOffsetY = rpImageCropState.offsetY;
      elements.rpImageCropViewport.classList.add("dragging");
      event.preventDefault();
    }

    function handleRpImageCropPointerMove(event) {
      if (!rpImageCropState) {
        return;
      }

      if (rpImageCropState.activePointers.has(event.pointerId)) {
        rpImageCropState.activePointers.set(event.pointerId, {
          clientX: event.clientX,
          clientY: event.clientY
        });
      }

      if (rpImageCropState.pinchActive && rpImageCropState.activePointers.size >= 2) {
        updateRpImageCropPinchZoom();
        event.preventDefault();
        return;
      }

      if (rpImageCropState.dragPointerId !== event.pointerId) {
        return;
      }

      rpImageCropState.offsetX = rpImageCropState.dragStartOffsetX + (event.clientX - rpImageCropState.dragStartClientX);
      rpImageCropState.offsetY = rpImageCropState.dragStartOffsetY + (event.clientY - rpImageCropState.dragStartClientY);
      renderRpImageCropEditor();
    }

    function handleRpImageCropPointerUp(event) {
      if (!rpImageCropState) {
        return;
      }

      if (elements.rpImageCropViewport.hasPointerCapture(event.pointerId)) {
        elements.rpImageCropViewport.releasePointerCapture(event.pointerId);
      }

      rpImageCropState.activePointers.delete(event.pointerId);

      if (rpImageCropState.pinchActive) {
        rpImageCropState.pinchActive = false;
        if (rpImageCropState.activePointers.size >= 2) {
          beginRpImageCropPinch();
          return;
        }

        if (rpImageCropState.activePointers.size === 1) {
          const [remainingPointerId, remainingPointer] = rpImageCropState.activePointers.entries().next().value;
          rpImageCropState.dragPointerId = remainingPointerId;
          rpImageCropState.dragStartClientX = remainingPointer.clientX;
          rpImageCropState.dragStartClientY = remainingPointer.clientY;
          rpImageCropState.dragStartOffsetX = rpImageCropState.offsetX;
          rpImageCropState.dragStartOffsetY = rpImageCropState.offsetY;
          return;
        }
      }

      if (rpImageCropState.dragPointerId !== event.pointerId) {
        if (!rpImageCropState.activePointers.size) {
          elements.rpImageCropViewport.classList.remove("dragging");
        }
        return;
      }

      rpImageCropState.dragPointerId = null;
      if (!rpImageCropState.activePointers.size) {
        elements.rpImageCropViewport.classList.remove("dragging");
      }
    }

    function beginRpImageCropPinch() {
      if (!rpImageCropState) {
        return;
      }

      const pinchMetrics = getRpImageCropPinchMetrics();
      if (!pinchMetrics || pinchMetrics.distance <= 0) {
        return;
      }

      const frameSize = Math.max(1, rpImageCropState.frameSize || Math.round(elements.rpImageCropViewport.clientWidth || 320));
      const fallbackScale = Math.max(frameSize / rpImageCropState.naturalWidth, frameSize / rpImageCropState.naturalHeight);
      rpImageCropState.pinchActive = true;
      rpImageCropState.pinchStartDistance = pinchMetrics.distance;
      rpImageCropState.pinchStartZoom = rpImageCropState.zoom;
      rpImageCropState.pinchStartScale = Math.max(0.0001, rpImageCropState.displayScale || fallbackScale);
      rpImageCropState.pinchStartOffsetX = rpImageCropState.offsetX;
      rpImageCropState.pinchStartOffsetY = rpImageCropState.offsetY;
      rpImageCropState.pinchStartMidpointX = pinchMetrics.midpointX;
      rpImageCropState.pinchStartMidpointY = pinchMetrics.midpointY;
      rpImageCropState.dragPointerId = null;
    }

    function updateRpImageCropPinchZoom() {
      if (!rpImageCropState || !rpImageCropState.pinchActive) {
        return;
      }

      const pinchMetrics = getRpImageCropPinchMetrics();
      if (!pinchMetrics || pinchMetrics.distance <= 0 || rpImageCropState.pinchStartDistance <= 0) {
        return;
      }

      const frameSize = Math.max(1, rpImageCropState.frameSize || Math.round(elements.rpImageCropViewport.clientWidth || 320));
      const fallbackScale = Math.max(frameSize / rpImageCropState.naturalWidth, frameSize / rpImageCropState.naturalHeight);
      const nextZoom = clampNumber(rpImageCropState.pinchStartZoom * (pinchMetrics.distance / rpImageCropState.pinchStartDistance), rpImageCropState.minZoom, rpImageCropState.maxZoom);
      const nextScale = fallbackScale * nextZoom;
      const imageX = (rpImageCropState.pinchStartMidpointX - rpImageCropState.pinchStartOffsetX) / rpImageCropState.pinchStartScale;
      const imageY = (rpImageCropState.pinchStartMidpointY - rpImageCropState.pinchStartOffsetY) / rpImageCropState.pinchStartScale;

      rpImageCropState.zoom = nextZoom;
      rpImageCropState.offsetX = pinchMetrics.midpointX - imageX * nextScale;
      rpImageCropState.offsetY = pinchMetrics.midpointY - imageY * nextScale;
      elements.rpImageCropZoomInput.value = String(nextZoom);
      renderRpImageCropEditor();
    }

    function getRpImageCropPinchMetrics() {
      if (!rpImageCropState || rpImageCropState.activePointers.size < 2) {
        return null;
      }

      const pointers = Array.from(rpImageCropState.activePointers.values()).slice(0, 2);
      const first = pointers[0];
      const second = pointers[1];
      const viewportRect = elements.rpImageCropViewport.getBoundingClientRect();
      const midpointClientX = (first.clientX + second.clientX) / 2;
      const midpointClientY = (first.clientY + second.clientY) / 2;

      return {
        distance: Math.hypot(second.clientX - first.clientX, second.clientY - first.clientY),
        midpointX: midpointClientX - viewportRect.left,
        midpointY: midpointClientY - viewportRect.top
      };
    }

    async function applyRpImageCrop() {
      if (!rpImageCropState) {
        return;
      }

      try {
        const frameSize = Math.max(1, rpImageCropState.frameSize || Math.round(elements.rpImageCropViewport.clientWidth || 320));
        const scale = Math.max(0.0001, rpImageCropState.displayScale);
        const cropX = clampNumber(-rpImageCropState.offsetX / scale, 0, rpImageCropState.naturalWidth);
        const cropY = clampNumber(-rpImageCropState.offsetY / scale, 0, rpImageCropState.naturalHeight);
        const maxCropSize = Math.min(rpImageCropState.naturalWidth - cropX, rpImageCropState.naturalHeight - cropY);
        const cropSize = Math.max(1, Math.min(frameSize / scale, maxCropSize));
        const outputSize = Math.max(1, Math.min(MAX_IMAGE_DIMENSION, Math.round(cropSize)));
        const croppedImage = cropImageDataUrl(rpImageCropState.image, rpImageCropState.mimeType, cropX, cropY, cropSize, outputSize);
        const kind = rpImageCropState.kind;

        getRpCardDraft(kind).profileImage = await detachImageAttachmentMedia({
          id: createId("img"),
          name: rpImageCropState.fileName,
          mimeType: croppedImage.mimeType,
          sizeBytes: croppedImage.sizeBytes,
          dataUrl: croppedImage.dataUrl
        });

        cancelRpImageCrop({ silent: true });
        saveRpCard(kind);
        setChatStatus(t("rpImageApplied", { kind: getRpCardKindNoun(kind) }), "success");
      } catch (error) {
        console.error("Failed to crop RP card image", error);
        setChatStatus(t("imageCropFailed", { error: error.message }), "error");
      }
    }

    function createNewRpCard(kind) {
      ensureRpModeReady();
      const card = createRpCardRecord(kind);
      getRpCardCollection(kind).unshift(card);

      if (kind === "character") {
        state.rp.activeCharacterId = card.id;
        state.rp.chatsByCharacterId[card.id] = [createChatRecord({ characterCardId: card.id })];
        state.rp.activeChatIdsByCharacterId[card.id] = state.rp.chatsByCharacterId[card.id][0].id;
        resetModelSettingsDraft();
      } else {
        state.rp.activePersonaId = card.id;
      }

      resetRpCardDraft(kind);
      renderAll();
      setChatStatus(t("rpCardCreated", { kind: getRpCardKindNoun(kind) }), "success");
    }

    async function saveRpCard(kind) {
      const draft = getRpCardDraft(kind);
      const card = getRpCardCollection(kind).find((item) => item.id === draft.cardId);
      if (!card) {
        setChatStatus(t("rpCardNotFound", { kind: getRpCardKindNoun(kind) }), "error");
        return;
      }

      card.name = String(draft.name || "").trim() || card.name;
      card.description = String(draft.description || "");
      if (kind === "character") {
        card.isWorldCard = Boolean(draft.isWorldCard);

    async function parseImportedRpCard(file, expectedKind) {
      if (typeof window.JSZip !== "function") {
        throw new Error(t("zipImportLibraryFailed"));
      }

      validateImportFileSize(file);
      const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
      const manifestEntry = zip.file("manifest.json");
      if (!manifestEntry) {
        throw new Error(t("missingManifestJson"));
      }

      const manifest = JSON.parse(await manifestEntry.async("string"));
      if (manifest?.format !== "focusabove-rp-card") {
        throw new Error(t("unsupportedCardFormat"));
      }

      const manifestKind = manifest?.kind === "persona" ? "persona" : "character";
      if (manifestKind !== expectedKind) {
        throw new Error(t("expectedCardFile", { kind: getRpCardKindNoun(expectedKind) }));
      }

      let profileImage = null;
      const imageFileName = String(manifest?.card?.imageFileName || "").trim();
      if (imageFileName) {
        const imageEntry = zip.file(imageFileName);
        if (!imageEntry) {
          throw new Error(t("missingCardImageFile"));
        }

        const base64 = await imageEntry.async("base64");
        const mimeType = normalizeSupportedImageMimeType(manifest?.card?.imageMimeType)
          || normalizeSupportedImageMimeType(getImageMimeTypeFromExtension(imageFileName.split(".").pop() || "png"));
        profileImage = await detachImageAttachmentMedia(await prepareImportedImageAttachment({
          id: createId("img"),
          name: imageFileName,
          mimeType,
          dataUrl: `data:${mimeType};base64,${base64}`
        }));
      }

      return {
        id: createId(`${expectedKind}-card`),
        kind: expectedKind,
        name: String(manifest?.card?.name || "").trim() || t("newKindName", { kind: getRpCardKindLabel(expectedKind) }),
        description: String(manifest?.card?.description || ""),
        isWorldCard: expectedKind === "character" ? normalizeWorldCardFlag(manifest?.card?.IsWorldCard) : false,
        mainCharacterDescription: expectedKind === "character" && normalizeWorldCardFlag(manifest?.card?.IsWorldCard)
          ? String(manifest?.card?.mainCharacterDescription || "")
          : "",
        firstMessage: expectedKind === "character" ? String(manifest?.card?.firstMessage || "") : "",
        profileImage,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function getImageFileExtension(mimeType) {
      if (/image\/jpe?g/i.test(mimeType || "")) {
        return "jpg";
      }

      if (/image\/webp/i.test(mimeType || "")) {
        return "webp";
      }

      return "png";
    }

    function getImageMimeTypeFromExtension(extension) {
      const value = String(extension || "").toLowerCase();
      if (value === "jpg" || value === "jpeg") {
        return "image/jpeg";
      }

      if (value === "webp") {
        return "image/webp";
      }

      return "image/png";
    }

    async function parseImportedChats(jsonText) {
      let payload;
      try {
        payload = JSON.parse(jsonText);
      } catch {
        throw new Error(t("invalidJsonFormat"));
      }

      const rawChats = Array.isArray(payload)
        ? payload
        : Array.isArray(payload?.chats)
          ? payload.chats
          : payload && typeof payload === "object"
            ? [payload]
            : [];

      const importedChats = [];
      for (const chat of rawChats) {
        const importedChat = await createImportedChatRecord(chat);
        if (importedChat) {
          importedChats.push(importedChat);
        }
      }

      return importedChats;
    }

    async function createImportedChatRecord(chat) {
      const normalizedChat = await sanitizeImportedChatImages(normalizeChat(chat));
      if (!normalizedChat) {
        return null;
      }

      return {
        ...normalizedChat,
        id: createId("chat"),
        characterCardId: isRpModeActive() ? state.rp.activeCharacterId : normalizedChat.characterCardId,
        messages: normalizedChat.messages.map((message) => ({
          ...message,
          id: createId("msg"),
          characterCardId: isRpModeActive() ? state.rp.activeCharacterId : message.characterCardId,
          personaCardId: isRpModeActive() ? state.rp.activePersonaId : message.personaCardId
        }))
      };
    }

    async function sanitizeImportedChatImages(chat) {
      if (!chat) {
        return null;
      }

      const messages = [];
      for (const message of chat.messages) {
        const attachments = await detachImageAttachmentsMedia(await sanitizeImportedImageAttachments(message.attachments));
        const illustration = message.illustration ? { ...message.illustration } : null;
        if (illustration?.image) {
          illustration.image = await detachImageAttachmentMedia(await prepareImportedImageAttachment(illustration.image));
        }
        messages.push({
          ...message,
          attachments,
          illustration
        });
      }

      return {
        ...chat,
        messages
      };
    }

    async function sanitizeImportedImageAttachments(attachments) {
      const normalizedAttachments = normalizeImageAttachments(attachments).filter((attachment) => attachment.dataUrl);
      const safeAttachments = [];
      for (const attachment of normalizedAttachments) {
        safeAttachments.push(await prepareImportedImageAttachment(attachment));
      }
      return safeAttachments;
    }

    function canRerollLatestAssistant(chat) {
      return getLatestAssistantMessage(chat) !== null;

    function canRerollMessage(chat, messageId) {
      const latestAssistant = getLatestAssistantMessage(chat);
      return Boolean(latestAssistant && latestAssistant.id === messageId && latestAssistant.status !== "streaming");
    }

    function getLatestAssistantMessage(chat) {
      if (!chat) {
        return null;
      }

      for (let index = chat.messages.length - 1; index >= 0; index -= 1) {
        const message = chat.messages[index];
        if (message.role === "assistant") {
          return message;
        }
        if (message.role === "user") {
          break;
        }
      }

      return null;
    }

    async function refreshModels(options = {}) {
      if (isRefreshingModels) {
        return;
      }

      const apiBase = normalizeApiBase(state.settings.apiBaseUrl);
      if (!apiBase) {
        setModelsStatus("먼저 API 주소를 입력하고 저장해 주세요.", "error", options);
        return;
      }

      isRefreshingModels = true;
      elements.refreshModelsButton.disabled = true;
      setModelsStatus("/models 엔드포인트에서 모델 정보를 불러오는 중입니다.", "default", options);

      try {
        const response = await fetch(`${apiBase}/models`, {
          headers: buildHeaders()
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText}`);
        }

        const payload = await response.json();
        state.models = Array.isArray(payload?.data) ? payload.data : [];
        state.modelsSyncedAt = new Date().toISOString();
        syncSelectedModelWithModels();
        renderAppSections({
          activeChat: true,
          modelSelect: true,
          modelsPanel: true
        });
        setModelsStatus(`모델 ${state.models.length}개를 불러왔습니다.`, "success", options);
      } catch (error) {
        console.error("Failed to refresh models", error);
        setModelsStatus(`모델 조회 실패: ${error.message}`, "error", options);
      } finally {
        isRefreshingModels = false;
        elements.refreshModelsButton.disabled = false;
      }
    }

    function syncSelectedModelWithModels() {
      if (!state.models.length) {
        state.settings.selectedModel = "";
        state.settings.auxiliaryModel = "";
        return;
      }

      const validIds = new Set(state.models.map((model) => model.id));
      if (!state.settings.selectedModel || !validIds.has(state.settings.selectedModel)) {
        state.settings.selectedModel = state.models[0].id;
      }
      if (state.settings.auxiliaryModel && !validIds.has(state.settings.auxiliaryModel)) {
        state.settings.auxiliaryModel = "";
      }
    }

    async function fetchImageModelList(imageApiBase) {
      const errors = [];
      const attempts = [
        async () => normalizeImageModelList(await fetchImageApiJson(`${imageApiBase}/sdapi/v1/sd-models`)),
        async () => normalizeImageModelList((await fetchImageApiJson(`${imageApiBase}/models`))?.data),
        async () => {
          const objectInfo = await fetchImageApiJson(`${imageApiBase}/object_info`);
          return normalizeImageModelList(getComfyUiInputOptions(objectInfo, "CheckpointLoaderSimple", "ckpt_name"));
        }
      ];

      for (const attempt of attempts) {
        try {
          const models = await attempt();
          if (models.length) {
            return models;
          }
        } catch (error) {
          errors.push(error);
        }
      }

      throw errors[0] || new Error(t("missingResponseContent"));
    }

    }

    async function handleSendMessage(event) {
      event.preventDefault();
      if (isSending) {
        stopAssistantResponse();
        return;
      }

      const activeChat = getActiveChat();
      let content = elements.messageInput.value.trim();
      const wasEmptyRpInput = isRpModeActive() && !content;
      let attachments = pendingImageAttachments.map(cloneImageAttachment);

      if (!activeChat) {
        setChatStatus(t("selectChatTabFirst"), "error");
        return;
      }

      if (hasEditingMessageInChat(activeChat)) {
        setChatStatus(t("saveMessageEditsFirst"), "error");
        focusMessageEditor(editingMessageId);
        return;
      }

      if (wasEmptyRpInput) {
        content = getRpDefaultContinuationInput();
      }

      if (!content && !attachments.length) {
        setChatStatus(t("addMessageOrImage"), "error");
        return;
      }

      const apiBase = normalizeApiBase(state.settings.apiBaseUrl);
      if (!apiBase) {
        setChatStatus(t("apiBaseUrlRequired"), "error");
        return;
      }

      const selectedModel = state.settings.selectedModel || elements.modelSelect.value;
      if (!selectedModel) {
        setChatStatus(t("selectModelRequired"), "error");
        return;
      }

      attachments = await detachImageAttachmentsMedia(attachments);

      const shouldEnhanceInput = shouldEnhanceRpInput(activeChat);
      const userMessage = createMessage("user", content, {
        attachments,
        status: shouldEnhanceInput ? "enhancing" : "complete"
      });
      activeChat.messages.push(userMessage);
      activeChat.updatedAt = new Date().toISOString();
      elements.messageInput.value = "";
      clearPendingImageAttachments();
      renderAppSections({
        persist: !shouldEnhanceInput,
        chatList: true,
        activeChat: true,
        composerAttachments: true,
        composerControls: true,
        header: true
      });

      if (shouldEnhanceInput) {
        isSending = true;
        renderAppSections({
          persist: false,
          chatList: true,
          activeChat: true,
          composerControls: true,
          header: true
        });
        setChatStatus(t("rpInputEnhancing"));
        try {
          userMessage.content = await enhanceRpUserInput(activeChat, content, {
            wasEmptyInput: wasEmptyRpInput,
            excludeMessageId: userMessage.id
          });
        } catch (error) {
          console.error("Failed to enhance RP input", error);
          if (wasEmptyRpInput) {
            userMessage.content = getRpContinuationFallbackInput();
          }
        } finally {
          userMessage.status = "complete";
          activeChat.updatedAt = new Date().toISOString();
          isSending = false;
          if (shouldRetitleChat(activeChat)) {
            activeChat.title = suggestChatTitle(activeChat.messages);
          }
          renderAppSections({
            chatList: true,
            activeChat: true,
            composerControls: true,
            header: true
          });
        }
      } else if (shouldRetitleChat(activeChat)) {
        activeChat.title = suggestChatTitle(activeChat.messages);
        activeChat.updatedAt = new Date().toISOString();
        renderAppSections({
          chatList: true,
          activeChat: true,
          header: true
        });
      }

      await requestAssistantResponse(activeChat, {
        apiBase,
        selectedModel,
        sourceMessages: activeChat.messages,
        notifyMissingAuxiliaryIllustrationModel: shouldNotifyMissingAuxiliaryIllustrationModel(),
        notifyMissingIllustrationImageApi: shouldNotifyMissingIllustrationImageApi()
      });
    }

    function shouldCheckChatT2iPrompt(chat, userMessage) {
      return !isRpModeActive()
        && !isRpChat(chat)
        && state.settings.chatT2iEnabled === true
        && normalizeApiBase(state.settings.apiBaseUrl)
        && hasAuxiliaryModel()
        && normalizeImageApiBase(state.settings.imageApiBaseUrl)
        && userMessage?.role === "user"
        && String(userMessage.content || "").trim();
    }

    async function prepareChatT2iPrompt(chat, userMessage, options = {}) {
      if (!shouldCheckChatT2iPrompt(chat, userMessage)) {
        return "";
      }

      try {
        const prompt = await createChatT2iPrompt(chat, userMessage, options);
        return isChatT2iSkipPrompt(prompt) ? "" : prompt;
      } catch (error) {
        console.error("Failed to prepare chat T2I prompt", error);
        return "";
      }
    }

    function getLatestUserMessageForChatT2i(messages) {
      return (Array.isArray(messages) ? messages : [])
        .slice()
        .reverse()
        .find((message) => message?.role === "user") || null;
    }

    function shouldNotifyMissingAuxiliaryIllustrationModel() {
      return isRpModeActive()
        && normalizeRpIllustrationSettings(state.rp?.illustration).enabled
        && !String(state.settings.auxiliaryModel || "").trim();
    }

    function shouldNotifyMissingIllustrationImageApi() {
      return isRpModeActive()
        && normalizeRpIllustrationSettings(state.rp?.illustration).enabled
        && String(state.settings.auxiliaryModel || "").trim()
        && !normalizeImageApiBase(state.settings.imageApiBaseUrl);
    }

    function hasAuxiliaryModel() {
      return Boolean(String(state.settings.auxiliaryModel || "").trim());
    }

    function isRpChat(chat) {
      return Boolean(chat?.characterCardId);
    }

    function shouldUseRpSummary(chat) {
      return isRpModeActive()
        && isRpChat(chat)
        && hasAuxiliaryModel()
        && normalizeRpAssistanceSettings(state.rp?.assistance).summaryEnabled;
    }

    function shouldEnhanceRpInput(chat) {
      return isRpModeActive()
        && isRpChat(chat)
        && hasAuxiliaryModel()
        && normalizeRpAssistanceSettings(state.rp?.assistance).inputEnhancementEnabled;
    }

    function getMainRequestRpSummaryBoundary(chat, sourceMessages) {
      const messages = Array.isArray(sourceMessages) ? sourceMessages : [];
      if (!shouldUseRpSummary(chat) || !String(chat?.rpSummary || "").trim()) {
        return 0;
      }

      const summarizedCount = normalizeOptionalInteger(chat.rpSummaryUpdatedMessageCount, { min: 0 }) ?? 0;
      const summarizableCount = messages.filter((message) => message.role === "user" || message.role === "assistant").length;
      return summarizedCount > 0 && summarizedCount <= summarizableCount ? summarizedCount : 0;
    }

    function buildMainRequestSourceMessages(chat, sourceMessages) {
      const messages = Array.isArray(sourceMessages) ? sourceMessages : [];
      const summarizedCount = getMainRequestRpSummaryBoundary(chat, messages);
      if (!summarizedCount) {
        return messages;
      }

      let seenSummarizableMessages = 0;
      return messages.filter((message) => {
        if (message.role !== "user" && message.role !== "assistant") {
          return false;
        }
        seenSummarizableMessages += 1;
        return seenSummarizableMessages > summarizedCount;
      });
    }

    function stopAssistantResponse() {
      if (!isSending || !currentRequestAbortController) {
        return;
      }

      currentRequestAbortController.abort();
    }

    async function rerollAssistantResponse(messageId) {
      if (isSending) {
        return;
      }

      const activeChat = getActiveChat();
      if (hasEditingMessageInChat(activeChat)) {
        setChatStatus(t("saveMessageEditsFirst"), "error");
        focusMessageEditor(editingMessageId);
        return;
      }

      const assistantIndex = activeChat?.messages.findIndex((message) => message.id === messageId) ?? -1;
      const targetAssistant = assistantIndex >= 0 ? activeChat.messages[assistantIndex] : null;
      if (!activeChat || !targetAssistant || targetAssistant.role !== "assistant") {
        setChatStatus(t("noResponseToReroll"), "error");
        return;
      }

      if (targetAssistant.status === "streaming") {
        return;
      }

      const apiBase = normalizeApiBase(state.settings.apiBaseUrl);
      if (!apiBase) {
        setChatStatus(t("apiBaseUrlRequired"), "error");
        return;
      }

      const selectedModel = state.settings.selectedModel || elements.modelSelect.value;
      if (!selectedModel) {
        setChatStatus(t("selectModelRequired"), "error");
        return;
      }

      const previousChatT2iPrompt = !isRpChat(activeChat)
        ? normalizeMessageIllustration(targetAssistant.illustration)?.prompt || ""
        : "";

      activeChat.messages = activeChat.messages.slice(0, assistantIndex);
      activeChat.updatedAt = new Date().toISOString();
      renderAppSections({
        chatList: true,
        activeChat: true,
        composerControls: true,
        header: true
      });

      await requestAssistantResponse(activeChat, {
        apiBase,
        selectedModel,
        sourceMessages: activeChat.messages,
        chatT2iAvoidPrompt: previousChatT2iPrompt
      });
    }

    async function regenerateMessageIllustration(messageId) {
      if (isSending) {
        setChatStatus(t("streamingResponseActive"));
        return;
      }

      const activeChat = getActiveChat();
      if (hasEditingMessageInChat(activeChat)) {
        setChatStatus(t("saveMessageEditsFirst"), "error");
        focusMessageEditor(editingMessageId);
        return;
      }

      const targetMessage = findMessageInChat(activeChat, messageId);
      if (!targetMessage || targetMessage.role !== "assistant" || targetMessage.status !== "complete") {
        setChatStatus(t("noResponseToReroll"), "error");
        return;
      }

      if (normalizeMessageIllustration(targetMessage.illustration)?.status === "generating") {
        return;
      }

      if (!normalizeApiBase(state.settings.apiBaseUrl)) {
        setChatStatus(t("apiBaseUrlRequired"), "error");
        return;
      }

      if (!hasAuxiliaryModel()) {
        setChatStatus(t("illustrationAuxiliaryModelRequired"), "error");
        return;
      }

      if (!normalizeImageApiBase(state.settings.imageApiBaseUrl)) {
        setChatStatus(t("illustrationImageApiRequired"), "error");
        return;
      }

      const generationStatusKey = isRpChat(activeChat) ? "illustrationGenerating" : "imageGenerating";
      setAssistantAuxiliaryStatus(activeChat, targetMessage, generationStatusKey);
      setChatStatus(t(generationStatusKey));
      await generateIllustrationForAssistantMessage(activeChat, targetMessage, {
        scrollToBottom: false,
        createPrompt: isRpChat(activeChat) ? null : (message) => createChatT2iPromptForAssistantMessage(activeChat, message)
      });
      setAssistantAuxiliaryStatus(activeChat, targetMessage);

      const latestMessage = findMessageInChat(activeChat, messageId);
      const latestIllustration = normalizeMessageIllustration(latestMessage?.illustration);
      if (latestIllustration?.status === "complete") {
        setChatStatus(t("illustrationRegenerated"), "success");
      } else if (latestIllustration?.status === "error") {
        setChatStatus(t("illustrationError", { error: latestIllustration.error || t("requestFailed") }), "error");
      }
    }

    async function requestAssistantResponse(chat, options) {
      streamingAutoScrollPinnedToBottom = isPageNearBottom();
      lastStreamingPersistRequestAt = 0;
      const requestStatusRunId = postResponseStatusRunId + 1;
      postResponseStatusRunId = requestStatusRunId;
      const requestAbortController = new AbortController();
      const rawSourceMessages = Array.isArray(options.sourceMessages)
        ? options.sourceMessages
        : Array.isArray(chat?.messages) ? chat.messages : [];
      const rpContext = buildRpPromptContext(chat, rawSourceMessages);
      const sourceMessages = buildMainRequestSourceMessages(chat, rawSourceMessages);

      const assistantMessage = createMessage("assistant", "", {
        status: "streaming",
        isThinking: false
      });

      chat.messages.push(assistantMessage);
      chat.updatedAt = new Date().toISOString();
      currentStreamingMessageId = assistantMessage.id;
      currentRequestAbortController = requestAbortController;
      isSending = true;
      renderAppSections({
        chatList: true,
        activeChat: true,
        composerControls: true,
        header: true
      });
      setChatStatus(t("streamingResponseActive"));

      try {
        const chatT2iPrompt = typeof options.chatT2iPrompt === "string"
          ? options.chatT2iPrompt
          : await prepareChatT2iPrompt(chat, getLatestUserMessageForChatT2i(sourceMessages), {
              avoidPrompt: options.chatT2iAvoidPrompt
            });
        const requestBody = {
          model: options.selectedModel,
          messages: await buildChatRequestMessages(
            sourceMessages,
            state.settings.systemPrompt,
            rpContext,
            buildChatT2iMainModelInstructions(chatT2iPrompt, { chat })
          ),
          stream: true,
          stream_options: {
            include_usage: true
          }
        };

        if (typeof state.settings.temperature === "number") {
          requestBody.temperature = state.settings.temperature;
        }

        if (state.settings.thinkingUnlimited === false && typeof state.settings.thinkingTokenLimit === "number") {
          requestBody.reasoning = {
            max_tokens: state.settings.thinkingTokenLimit
          };
        }

        const response = await fetch(`${options.apiBase}/chat/completions`, {
          method: "POST",
          signal: requestAbortController.signal,
          headers: {
            ...buildHeaders(),
            "Content-Type": "application/json"
          },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText}`);
        }

        await readAssistantResponseStream(response, assistantMessage, chat);
        assistantMessage.status = "complete";
        assistantMessage.isThinking = false;
        chat.updatedAt = new Date().toISOString();
        persistState();
        replaceMessageArticleDom(chat, assistantMessage, { scrollToBottom: true });
        renderChatList();
        void finalizePostResponseAuxiliaryTasks(chat, assistantMessage, { ...options, chatT2iPrompt }, requestStatusRunId);
      } catch (error) {
        if (isAbortError(error)) {
          finalizeAbortedAssistantMessage(chat, assistantMessage);
          setChatStatus(t("responseStopped"), "success");
        } else {
        console.error("Failed to stream response", error);
        assistantMessage.content = `오류: ${error.message}`;
        assistantMessage.status = "error";
        assistantMessage.isThinking = false;
        assistantMessage.timestamp = new Date().toISOString();
        chat.updatedAt = assistantMessage.timestamp;
        persistState();
        replaceMessageArticleDom(chat, assistantMessage, { scrollToBottom: streamingAutoScrollPinnedToBottom });
        renderChatList();
        setChatStatus(t("requestFailedWithError", { error: error.message }), "error");
        }
      } finally {
        if (currentRequestAbortController === requestAbortController) {
          currentRequestAbortController = null;
        }
        lastStreamingPersistRequestAt = 0;
        currentStreamingMessageId = "";
        isSending = false;
        renderComposerControls();
        refreshActiveMessageMetaActions();
        persistState();
      }
    }

    function shouldGenerateIllustrationForResponse(chat, assistantMessage) {
      if (!chat || !assistantMessage || assistantMessage.role !== "assistant" || assistantMessage.status !== "complete") {
        return false;
      }

      if (!isRpModeActive() || !isRpChat(chat)) {
        return false;
      }

      if (!String(state.settings.auxiliaryModel || "").trim()) {
        return false;
      }

      if (!normalizeImageApiBase(state.settings.imageApiBaseUrl)) {
        return false;
      }

      return normalizeRpIllustrationSettings(state.rp?.illustration).enabled;
    }

    async function generateIllustrationForAssistantMessage(chat, assistantMessage, options = {}) {
      if (!normalizeImageApiBase(state.settings.imageApiBaseUrl)) {
        return;
      }

      const shouldScrollToBottom = options.scrollToBottom !== false;

      const targetMessage = findMessageInChat(chat, assistantMessage.id);
      if (!targetMessage || targetMessage.status !== "complete") {
        return;
      }

      targetMessage.illustration = {
        status: "generating",
        prompt: "",
        image: null,
        error: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      updateIllustrationMessageState(chat, targetMessage, { scrollToBottom: shouldScrollToBottom });

      try {
        const prompt = cleanIllustrationPrompt(options.prompt)
          || await (typeof options.createPrompt === "function"
            ? options.createPrompt(targetMessage)
            : createIllustrationPrompt(chat, targetMessage));
        const image = await detachImageAttachmentMedia(await generateStableDiffusionImage(prompt));
        const latestMessage = findMessageInChat(chat, targetMessage.id);
        if (!latestMessage) {
          return;
        }

        latestMessage.illustration = {
          ...latestMessage.illustration,
          status: "complete",
          prompt,
          image,
          error: "",
          updatedAt: new Date().toISOString()
        };
        updateIllustrationMessageState(chat, latestMessage, { scrollToBottom: shouldScrollToBottom });
      } catch (error) {
        console.error("Failed to generate illustration", error);
        const latestMessage = findMessageInChat(chat, targetMessage.id);
        if (!latestMessage) {
          return;
        }

        latestMessage.illustration = {
          ...latestMessage.illustration,
          status: "error",
          error: error?.message || String(error),
          updatedAt: new Date().toISOString()
        };
        updateIllustrationMessageState(chat, latestMessage, { scrollToBottom: false });
      }
    }

    function findMessageInChat(chat, messageId) {
      return chat?.messages?.find((message) => message.id === messageId) || null;
    }

    function updateIllustrationMessageState(chat, message, options = {}) {
      chat.updatedAt = new Date().toISOString();
      persistState();
      if (getActiveChat()?.id === chat.id) {
        replaceMessageArticleDom(chat, message, options);
      }
      renderChatList();
    }

    async function finalizePostResponseAuxiliaryTasks(chat, assistantMessage, options, statusRunId) {
      if (options.notifyMissingAuxiliaryIllustrationModel) {
        setPostResponseChatStatus(statusRunId, assistantMessage.id, t("illustrationAuxiliaryModelRequired"));
        return;
      }

      if (options.notifyMissingIllustrationImageApi) {
        setPostResponseChatStatus(statusRunId, assistantMessage.id, t("illustrationImageApiRequired"));
        return;
      }

      await runPostResponseAuxiliaryTasks(chat, assistantMessage, {
        statusRunId,
        chatT2iPrompt: options.chatT2iPrompt
      });
      setPostResponseChatStatus(statusRunId, assistantMessage.id, t("responseReceivedToast"), "success");
    }

    function setPostResponseChatStatus(statusRunId, messageId, message, tone = "default") {
      if (statusRunId !== postResponseStatusRunId) {
        return;
      }

      if (currentStreamingMessageId && currentStreamingMessageId !== messageId) {
        return;
      }

      setChatStatus(message, tone);
    }

    function setAssistantAuxiliaryStatus(chat, assistantMessage, statusKey = "") {
      if (!assistantMessage || assistantMessage.role !== "assistant" || assistantMessage.status !== "complete") {
        return;
      }

      if (statusKey) {
        assistantMessage.auxiliaryStatus = statusKey;
      } else {
        delete assistantMessage.auxiliaryStatus;
      }

      refreshAssistantFooterDom(assistantMessage);
    }

    function refreshAssistantFooterDom(message) {
      const refs = getMessageArticleElements(message?.id);
      if (!refs?.footerElement) {
        return;
      }

      const nextFooter = createAssistantFooter(message);
      refs.footerElement.replaceWith(nextFooter);
      refs.footerElement = nextFooter;
    }

    async function runPostResponseAuxiliaryTasks(chat, assistantMessage, options = {}) {
      if (!chat || assistantMessage?.status !== "complete") {
        return;
      }

      if (!hasAuxiliaryModel() && !options.chatT2iPrompt) {
        return;
      }

      if (state.chats.some((item) => item.id === chat.id)) {
        if (options.chatT2iPrompt) {
          setAssistantAuxiliaryStatus(chat, assistantMessage, "imageGenerating");
          setPostResponseChatStatus(options.statusRunId, assistantMessage.id, t("imageGenerating"));
          await generateIllustrationForAssistantMessage(chat, assistantMessage, { prompt: options.chatT2iPrompt });
        }
        if (shouldGenerateAutomaticChatTitle(chat, assistantMessage)) {
          setAssistantAuxiliaryStatus(chat, assistantMessage, "rpPostProcessing");
          setPostResponseChatStatus(options.statusRunId, assistantMessage.id, t("rpPostProcessing"));
        }
        await maybeGenerateAutomaticChatTitle(chat, assistantMessage);
        setAssistantAuxiliaryStatus(chat, assistantMessage);
        return;
      }

      if (!isRpChat(chat)) {
        return;
      }

      if (shouldGenerateIllustrationForResponse(chat, assistantMessage)) {
        setAssistantAuxiliaryStatus(chat, assistantMessage, "illustrationGenerating");
        setPostResponseChatStatus(options.statusRunId, assistantMessage.id, t("illustrationGenerating"));
        await generateIllustrationForAssistantMessage(chat, assistantMessage);
      }
      if (!assistantMessage.isFirstMessage) {
        setAssistantAuxiliaryStatus(chat, assistantMessage, "rpPostProcessing");
        setPostResponseChatStatus(options.statusRunId, assistantMessage.id, t("rpPostProcessing"));
      }
      await maybeUpdateRpSceneState(chat, assistantMessage);
      if (shouldUpdateRpSummary(chat)) {
        setAssistantAuxiliaryStatus(chat, assistantMessage, "rpPostProcessing");
        setPostResponseChatStatus(options.statusRunId, assistantMessage.id, t("rpPostProcessing"));
        await maybeUpdateRpSummary(chat);
      }
      setAssistantAuxiliaryStatus(chat, assistantMessage);
    }

    async function maybeGenerateAutomaticChatTitle(chat, assistantMessage) {
      if (!shouldGenerateAutomaticChatTitle(chat, assistantMessage)) {
        return;
      }

      chat.autoTitleGenerated = true;
      persistState();

      try {
        const title = await createAutomaticChatTitle(chat);
        if (!title || chat.titleManuallyEdited) {
          return;
        }

        chat.title = title;
        chat.updatedAt = new Date().toISOString();
        persistState();
        renderAppSections({ persist: false, chatList: true, activeChat: true, header: true });
      } catch (error) {
        console.error("Failed to generate chat title", error);
      }
    }

    function shouldGenerateAutomaticChatTitle(chat, assistantMessage) {
      if (!chat || isRpChat(chat) || !hasAuxiliaryModel() || chat.autoTitleGenerated || chat.titleManuallyEdited) {
        return false;
      }

      if (!assistantMessage || assistantMessage.role !== "assistant" || assistantMessage.status !== "complete") {
        return false;
      }

      const userMessages = chat.messages.filter((message) => message.role === "user");
      const assistantMessages = chat.messages.filter((message) => message.role === "assistant" && message.status === "complete");
      return userMessages.length === 1 && assistantMessages.length === 1;
    }

    async function createAutomaticChatTitle(chat) {
      const firstUserMessage = chat.messages.find((message) => message.role === "user");
      const firstAssistantMessage = chat.messages.find((message) => message.role === "assistant" && message.status === "complete");
      const title = await requestAuxiliaryChatCompletion([
        {
          role: "system",
          content: [
            "You write concise chat tab titles.",
            `Return exactly one short title in ${t("promptLanguageName")}.`,
            "No markdown, quotes, labels, or explanations.",
            "Keep it under 32 characters."
          ].join("\n")
        },
        {
          role: "user",
          content: [
            "User's first message:",
            trimForAuxiliaryPrompt(firstUserMessage?.content || "", 700),
            "Assistant's first response:",
            trimForAuxiliaryPrompt(firstAssistantMessage?.content || "", 900)
          ].join("\n\n")
        }
      ], { temperature: 0.2 });

      return cleanGeneratedTitle(title);
    }

    async function maybeUpdateRpSceneState(chat, assistantMessage) {
      if (!isRpChat(chat) || !hasAuxiliaryModel() || assistantMessage?.isFirstMessage) {
        return;
      }

      try {
        const sceneState = await createRpSceneState(chat, assistantMessage);
        if (!sceneState) {
          return;
        }

        const latestMessage = findMessageInChat(chat, assistantMessage.id);
        if (!latestMessage) {
          return;
        }

        latestMessage.rpSceneState = sceneState;
        chat.rpSceneState = sceneState;
        chat.updatedAt = new Date().toISOString();
        persistState();
        if (getActiveChat()?.id === chat.id) {
          replaceMessageArticleDom(chat, latestMessage, { scrollToBottom: false });
        }
        renderChatList();
      } catch (error) {
        console.error("Failed to extract RP scene state", error);
      }
    }

    async function maybeUpdateRpSummary(chat) {
      if (!isRpChat(chat) || !hasAuxiliaryModel()) {
        return;
      }

      if (!shouldUpdateRpSummary(chat)) {
        return;
      }

      try {
        const summary = await createRpConversationSummary(chat);
        if (!summary) {
          return;
        }

        chat.rpSummary = summary;
        chat.rpSummaryUpdatedMessageCount = getSummarizableRpMessages(chat).length;
        chat.updatedAt = new Date().toISOString();
        persistState();
        renderChatList();
      } catch (error) {
        console.error("Failed to update RP summary", error);
      }
    }

    function shouldUpdateRpSummary(chat) {
      if (!isRpChat(chat) || !hasAuxiliaryModel()) {
        return false;
      }

      const assistance = normalizeRpAssistanceSettings(state.rp?.assistance);
      if (!assistance.summaryEnabled) {
        return false;
      }

      return estimateRpSummarySourceContextTokens(chat) >= assistance.summaryTokenThreshold;
    }

    function estimateRpSummarySourceContextTokens(chat) {
      const messages = getRpSummarySourceMessages(chat);
      const context = buildRpAuxiliaryContext(chat);
      const messageText = messages
        .map((message) => `${message.role}: ${message.content || ""}`)
        .join("\n\n");
      const attachmentTokens = messages.reduce((total, message) => total + normalizeImageAttachments(message.attachments).length * 512, 0);
      return estimateTextTokens([context, messageText].filter(Boolean).join("\n\n")) + attachmentTokens;
    }

    function estimateTextTokens(value) {
      const text = String(value || "").trim();
      if (!text) {
        return 0;
      }

      return Math.ceil(text.length / 1.8);
    }

    function getSummarizableRpMessages(chat) {
      return (Array.isArray(chat?.messages) ? chat.messages : [])
        .filter((message) => message.role === "user" || message.role === "assistant");
    }

    function getRpSummarySourceMessages(chat) {
      const messages = getSummarizableRpMessages(chat);
      if (!String(chat?.rpSummary || "").trim()) {
        return messages;
      }

      const summarizedCount = Math.min(
        messages.length,
        normalizeOptionalInteger(chat.rpSummaryUpdatedMessageCount, { min: 0 }) ?? 0
      );
      const overlapCount = 4;
      return messages.slice(Math.max(0, summarizedCount - overlapCount));
    }

    async function enhanceRpUserInput(chat, content, options = {}) {
      const baseContent = String(content || "").trim() || getRpDefaultContinuationInput();
      const wasEmptyInput = Boolean(options.wasEmptyInput);
      const isContinuationRequest = wasEmptyInput || isRpContinueInput(baseContent);
      const character = getRpCardById("character", chat?.characterCardId || state.rp.activeCharacterId);
      const persona = getActiveRpPersona();
      const rpPlaceholders = createRpPromptPlaceholders({ character, persona });
      const openingMessage = wasEmptyInput ? getRpFirstMessageForAuxiliary(chat, rpPlaceholders) : "";
      const mutableContext = wasEmptyInput ? buildRpAuxiliaryMutableContext(chat, { includeSummary: false }) : "";
      const recentContextMessages = wasEmptyInput ? getRecentRpInputEnhancementMessages(chat, options.excludeMessageId) : [];
