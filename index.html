      let index = startIndex;

      while (index < text.length) {
        if (!delimiter.allowNewlines && text[index] === "\n") {
          return -1;
        }

        if (text.startsWith(delimiter.right, index) && text[index - 1] !== "\\") {
          if (delimiter.right === "$" && text[index + 1] === "$") {
            index += 1;
            continue;
          }

          return index;
        }

        index += 1;
      }

      return -1;
    }

    function looksLikeInlineMath(text) {
      const normalized = String(text || "").trim();
      if (!normalized) {
        return false;
      }

      if (/^[\d\s.,:;!?%'"()\-]+$/.test(normalized)) {
        return false;
      }

      return /[\\^_{}=+\-*/<>]/.test(normalized) || (/[A-Za-z]/.test(normalized) && /\d/.test(normalized));
    }

    function restoreProtectedSegments(text, placeholders) {
      return placeholders.reduce((result, entry) => {
        return result.split(entry.token).join(entry.value);
      }, text);
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function isMarkdownTable(lines, startIndex) {
      const header = lines[startIndex]?.trim() || "";
      const divider = lines[startIndex + 1]?.trim() || "";
      return header.includes("|") && /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(divider);
    }

    function consumeMarkdownTable(lines, startIndex) {
      const rows = [];
      let index = startIndex;

      rows.push(splitMarkdownTableRow(lines[index]));
      index += 2;

      while (index < lines.length && lines[index].trim().includes("|")) {
        rows.push(splitMarkdownTableRow(lines[index]));
        index += 1;
      }

      const [headerRow, ...bodyRows] = rows;
      const thead = `<thead><tr>${headerRow.map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`).join("")}</tr></thead>`;
      const tbody = bodyRows.length
        ? `<tbody>${bodyRows.map((row) => `<tr>${row.map((cell) => `<td>${renderInlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}</tbody>`
        : "";

      return {
        html: `<table>${thead}${tbody}</table>`,
        nextIndex: index
      };
    }

    function splitMarkdownTableRow(line) {
      return line
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map((cell) => cell.trim());
    }

    async function buildChatRequestMessages(messages, systemPrompt, rpContext = null, extraSystemInstructions = []) {
      const rpPlaceholders = createRpPromptPlaceholders(rpContext);
      const requestMessages = await Promise.all(messages
        .filter((message) => message.role === "user" || message.role === "assistant")
        .map((message) => buildApiRequestMessage(message, rpPlaceholders)));
      const normalizedPrompt = replaceRpPromptPlaceholders(String(systemPrompt || "").trim(), rpPlaceholders);
      const normalizedUserAlias = String(rpContext?.persona?.name || state.settings.userAlias || DEFAULT_SETTINGS.userAlias).trim();
      const normalizedModelAlias = String(rpContext?.character?.name || state.settings.modelAlias || DEFAULT_SETTINGS.modelAlias).trim();
      const appLanguage = normalizeAppLanguage(state.settings.language);
      const selectedModel = String(state.settings.selectedModel || "").trim();
      const systemInstructions = [];

      systemInstructions.push(buildResponseLanguageInstruction(appLanguage));

      if (normalizedUserAlias) {
        systemInstructions.push(`이 대화에서 사용자의 이름은 "${normalizedUserAlias}"입니다. 사용자를 부르거나 지칭할 때 이 이름을 사용하세요.`);
      }

      if (normalizedModelAlias) {
        systemInstructions.push(`이 대화에서 당신의 이름은 "${normalizedModelAlias}"입니다. 자신을 소개하거나 지칭할 때 이 이름을 사용하세요.`);
      }

      if (appLanguage === "ko" && /(qwen|minimax)/i.test(selectedModel)) {
        systemInstructions.push(`[Language & Character Rules]
- Write entirely in modern Korean (Hangul).
- Never use Chinese characters (hanja), even in parentheses or technical/historical terms.
- Spell out or translate Hanja idioms and Sino-Korean words into Hangul.
- Never add Chinese-character annotations.`);
      }

      systemInstructions.push([
        `[Avoiding Repetition Rules]`,
        `- Do not repeat yourself. Keep each sentence adding new information and moving the scene forward.`
      ].join("\n"));

      const forbiddenWordsInstruction = buildForbiddenWordsInstruction(state.settings.forbiddenWords);
      if (forbiddenWordsInstruction) {
        systemInstructions.push(forbiddenWordsInstruction);
      }

      if (normalizedPrompt) {
        systemInstructions.push([
          `[User Custom System Prompt]`,
          normalizedPrompt
        ].join("\n"));
      }

      (Array.isArray(extraSystemInstructions) ? extraSystemInstructions : [extraSystemInstructions])
        .filter(Boolean)
        .forEach((instruction) => systemInstructions.push(String(instruction)));

      if (rpContext?.character && (rpContext.character.name || rpContext.character.description || rpContext.character.mainCharacterDescription)) {
        systemInstructions.push(buildRpCharacterCardInstruction(rpContext, rpPlaceholders));
      }

      if (rpContext?.persona && (rpContext.persona.name || rpContext.persona.description)) {
        systemInstructions.push([
          `[RP Persona Card]`,
          `Interpret the user's messages through this persona unless they explicitly change it.`,
          `Name: ${rpContext.persona.name || "Unnamed Persona"}`,
          replaceRpPromptPlaceholders(rpContext.persona.description || "", rpPlaceholders)
        ].filter(Boolean).join("\n"));
      }

      const rpSummaryInstruction = buildRpSummaryInstruction(rpContext, rpPlaceholders);
      if (rpSummaryInstruction) {
        systemInstructions.push(rpSummaryInstruction);
      }

      const rpSceneStateInstruction = buildRpSceneStateInstruction(rpContext, rpPlaceholders);
      if (rpSceneStateInstruction) {
        systemInstructions.push(rpSceneStateInstruction);
      }

      const rpNarrativeStyleInstruction = buildRpNarrativeStyleInstruction(rpContext);
      if (rpNarrativeStyleInstruction) {
        systemInstructions.push(rpNarrativeStyleInstruction);
      }

      const rpResponseLengthInstruction = buildRpResponseLengthInstruction(rpContext);
      if (rpResponseLengthInstruction) {
        systemInstructions.push(rpResponseLengthInstruction);
      }

      const rpPerspectiveInstruction = buildRpResponsePerspectiveInstruction(rpContext);
      if (rpPerspectiveInstruction) {
        systemInstructions.push(rpPerspectiveInstruction);
      }

      const finalMessages = systemInstructions.length
        ? [
            {
              role: "system",
              content: systemInstructions.join("\n\n")
            },
            ...requestMessages
          ]
        : [...requestMessages];

      const authorsNoteInstruction = buildAuthorsNoteInstruction(rpContext);
      if (authorsNoteInstruction) {
        finalMessages.push({
          role: "system",
          content: authorsNoteInstruction
        });
      }

      return finalMessages;
    }

    function createRpPromptPlaceholders(rpContext) {
      if (!rpContext) {
        return null;
      }

      return {
        char: String(rpContext.character?.name || "Unnamed Character").trim() || "Unnamed Character",
        user: String(rpContext.persona?.name || "Unnamed Persona").trim() || "Unnamed Persona"
      };
    }

    function replaceRpPromptPlaceholders(value, placeholders) {
      if (!placeholders || typeof value !== "string") {
        return value;
      }

      return value
        .replace(/\{\{\s*char\s*\}\}/gi, placeholders.char)
        .replace(/\{\{\s*user\s*\}\}/gi, placeholders.user);
    }

    function buildRpNarrativeStyleInstruction(rpContext) {
      if (!rpContext) {
        return "";
      }

      return [
        `[RP Narrative Style]`,
        `Write each reply like a novel scene, blending action, body language, atmosphere, and dialogue.`,
        `Stay immersive and in-character, not like a dry assistant or summary.`,
        `Use dialogue for speech and prose for gestures, expressions, movement, setting, and emotion.`
      ].join("\n");
    }

    function buildRpCharacterCardInstruction(rpContext, rpPlaceholders = null) {
      const character = rpContext?.character;
      if (!character || (!character.name && !character.description && !character.mainCharacterDescription)) {
        return "";
      }

      if (!isWorldRpCard(character)) {
        return [
          `[RP Character Card]`,
          `Roleplay as this character and stay consistent with the card.`,
          `Name: ${character.name || "Unnamed Character"}`,
          replaceRpPromptPlaceholders(character.description || "", rpPlaceholders)
        ].filter(Boolean).join("\n");
      }

      return [
        `[RP World Card]`,
        `Roleplay as the world rather than one fixed character. Simulate the setting, atmosphere, consequences, factions, and present characters in response to the user's actions.`,
        `Prefer the major characters from this card when they fit. If none fit, create a suitable character consistent with the world.`,
        `Keep scenes focused on a small cast when practical, usually the most relevant 1 to 3 characters.`,
        `World name: ${character.name || "Unnamed World"}`,
        character.description ? `[World Settings]\n${replaceRpPromptPlaceholders(character.description, rpPlaceholders)}` : "",
        character.mainCharacterDescription
          ? `[Major Characters]\n${replaceRpPromptPlaceholders(character.mainCharacterDescription, rpPlaceholders)}`
          : ""
      ].filter(Boolean).join("\n");
    }

    function buildRpResponsePerspectiveInstruction(rpContext) {
      if (!rpContext) {
        return "";
      }

      const perspective = normalizeRpResponsePerspective(rpContext.responsePerspective);
      const characterName = rpContext.character?.name || "the character";
      const personaName = rpContext.persona?.name || "the persona";
      if (isWorldRpCard(rpContext.character)) {
        const worldInstructions = {
          "character-first-person": `Prefer a close first-person viewpoint from the most relevant current-scene character when it fits naturally. Still simulate the broader world instead of locking to one permanent narrator.`,
          "persona-first-person": `Write from ${personaName}'s first-person perspective while the world, NPCs, and scene developments react around ${personaName}.`,
          "third-person": `Write in third person, describing the scene, the world's reactions, and the present characters without locking narration to one permanent first-person speaker.`
        };

        return [
          `[RP Response Perspective]`,
          worldInstructions[perspective]
        ].join("\n");
      }

      const instructions = {
        "character-first-person": `Write from ${characterName}'s first-person perspective. Use first-person pronouns for ${characterName}'s thoughts, actions, and narration.`,
        "persona-first-person": `Write from ${personaName}'s first-person perspective while keeping ${characterName}'s behavior consistent with the character card.`,
        "third-person": `Write in third person. Describe ${characterName}, ${personaName}, actions, and narration without first-person narration for either role unless dialogue clearly requires it.`
      };

      return [
        `[RP Response Perspective]`,
        instructions[perspective]
      ].join("\n");
    }

    function buildRpResponseLengthInstruction(rpContext) {
      if (!rpContext) {
        return "";
      }

      const responseLength = normalizeRpResponseLength(rpContext.responseLength);
      if (!responseLength) {
        return "";
      }

      const targets = {
        "up-to-300": "300 words or less",
        "300-500": "300 to 500 words",
        "500-700": "500 to 700 words",
        "700-1000": "700 to 1000 words",
        "1000-1500": "1000 to 1500 words",
        "1500-2000": "1500 to 2000 words",
        "2000-3000": "2000 to 3000 words"
      };

      return [
        `[RP Response Length]`,
        `Use this as a soft target, not a hard quota. Do not pad with filler or cut off a natural scene just to match it.`,
        `Aim for about ${targets[responseLength]} unless the user's latest request clearly calls for a different length.`
      ].join("\n");
    }

    function buildRpSummaryInstruction(rpContext, rpPlaceholders = null) {
      const summary = String(rpContext?.summary || "").trim();
      if (!summary) {
        return "";
      }

      return [
        `[RP Conversation Summary]`,
        `This condenses earlier RP turns that may not appear in the recent message window. Preserve its facts, relationship changes, promises, unresolved events, and continuity.`,
        replaceRpPromptPlaceholders(summary, rpPlaceholders)
      ].join("\n");

    function buildRpSceneStateInstruction(rpContext, rpPlaceholders = null) {

        `[RP Scene State]`,

    function buildAuthorsNoteInstruction(rpContext) {

    function buildRpPromptContext(chat, sourceMessages = null) {

      return {

    function roleLabel(role, message = null) {
      if (role === "user") {
        if (isRpModeActive()) {
          return getRpCardById("persona", message?.personaCardId || state.rp.activePersonaId)?.name || state.settings.userAlias || DEFAULT_SETTINGS.userAlias;
        }
        return state.settings.userAlias || DEFAULT_SETTINGS.userAlias;
      }

      if (role === "assistant") {
        if (isRpModeActive()) {
          return getRpCardById("character", message?.characterCardId || state.rp.activeCharacterId)?.name || state.settings.modelAlias || DEFAULT_SETTINGS.modelAlias;
        }

    function normalizeMessageStatus(status) {

    function extractThinkingText(delta) {
      return [delta.reasoning_content, delta.reasoning, delta.thinking]
        .map((value) => extractDeltaText(value))
        .find(Boolean) || "";
    }

    function extractDeltaText(value) {
      if (typeof value === "string") {
        return value;
      }

      if (Array.isArray(value)) {
        return value.map((item) => {
          if (typeof item === "string") {
            return item;
          }
          if (item && typeof item.text === "string") {
            return item.text;
          }
          return "";
        }).join("");
      }

      if (value && typeof value.text === "string") {
        return value.text;
      }

      return "";
    }

    function extractFinalAssistantContent(payload) {
      const messageContent = payload?.choices?.[0]?.message?.content;
      const text = extractDeltaText(messageContent);
      if (text) {
        return text;
      }

      return extractDeltaText(payload?.choices?.[0]?.text);
    }

    function sanitizeChatModeFakeImageToolCallOutput(content, chat) {
      if (!content || isRpChat(chat)) {
        return content;
      }

      let nextContent = String(content);
      const structuredToolPattern = /(?:dalle\.text2im|dall-e|tool_calls|function_call|action_input|<tool\b|<function_calls?\b)/i;
      if (!structuredToolPattern.test(nextContent)) {
        return nextContent;
      }

      nextContent = nextContent.replace(/^\s*```(?:json|xml|yaml|tool)?\s*[\s\S]*?(?:dalle\.text2im|dall-e|tool_calls|function_call|action_input|<tool\b|<function_calls?\b)[\s\S]*?```\s*/i, "");
      nextContent = nextContent.replace(/^\s*(?:<tool\b[\s\S]*?<\/tool>|<function_calls?\b[\s\S]*?<\/function_calls?>)\s*/i, "");
      nextContent = nextContent.replace(/^\s*(?:\{[\s\S]{0,1600}?\}|\[[\s\S]{0,1600}?\])\s*/i, (match) => structuredToolPattern.test(match) ? "" : match);
      nextContent = nextContent.replace(/^\s*(?:(?:action|action_input|tool_calls|function_call)\s*:?\s*[^\n]*\n+)+/i, "");
      nextContent = nextContent.replace(/^\s*dalle\.text2im\s*\([^)]*\)\s*/i, "");
      return nextContent.trimStart();
    }

    function applyTokenUsageToMessage(message, usage) {
      const normalizedUsage = normalizeTokenUsage(usage);
      const nextResponseTokens = normalizedUsage?.responseTokens ?? null;
      const nextContextTokens = normalizedUsage?.contextTokens ?? null;
      const changed = message.responseTokens !== nextResponseTokens || message.contextTokens !== nextContextTokens;

      if (!changed) {
        return false;
      }

      message.responseTokens = nextResponseTokens;
      message.contextTokens = nextContextTokens;
      return true;
    }

    function normalizeTokenUsage(usage) {
      if (!usage || typeof usage !== "object") {
        return null;
      }

      const responseTokens = normalizeOptionalInteger(usage.completion_tokens ?? usage.output_tokens, { min: 0 });
      const contextTokensDirect = normalizeOptionalInteger(usage.prompt_tokens ?? usage.input_tokens, { min: 0 });
      const totalTokens = normalizeOptionalInteger(usage.total_tokens, { min: 0 });
      const contextTokens = contextTokensDirect ?? (
        typeof totalTokens === "number" && typeof responseTokens === "number"
          ? Math.max(totalTokens - responseTokens, 0)
          : null
      );

      if (typeof responseTokens !== "number" || typeof contextTokens !== "number") {
        return null;
      }

      return {
        responseTokens,
        contextTokens
      };
    }

    function formatMessageTokenUsage(message) {
      if (typeof message?.responseTokens !== "number" || typeof message?.contextTokens !== "number") {
        return "";
      }

      const totalTokens = message.responseTokens + message.contextTokens;
      return t("tokenUsage", {
        input: formatTokenCount(message.contextTokens),
        output: formatTokenCount(message.responseTokens),
        total: formatTokenCount(totalTokens)
      });
    }

    function formatTokenCount(value) {
      const locale = getUiLocale();
      if (!cachedUiNumberFormatter || cachedUiNumberFormatterLocale !== locale) {
        cachedUiNumberFormatter = new Intl.NumberFormat(locale);
        cachedUiNumberFormatterLocale = locale;
      }

      return cachedUiNumberFormatter.format(value);
    }

    function shouldRetitleChat(chat) {
      return isDefaultChatTitle(chat.title) && chat.messages.filter((message) => message.role === "user").length === 1;
    }

    function suggestChatTitle(messages) {
      const firstUserMessage = messages.find((message) => {
        if (message.role !== "user") {
          return false;
        }

        return message.content.trim() || (Array.isArray(message.attachments) && message.attachments.length);
      });
      if (!firstUserMessage) {
        return t("newChatTitle", { count: state.chats.length + 1 });
      }

      if (!firstUserMessage.content.trim() && Array.isArray(firstUserMessage.attachments) && firstUserMessage.attachments.length) {
        return firstUserMessage.attachments.length === 1
          ? t("imageTitleSingle")
          : t("imageTitleMultiple", { count: firstUserMessage.attachments.length });
      }

      const compact = firstUserMessage.content.replace(/\s+/g, " ").trim();
      return compact.length > 24 ? `${compact.slice(0, 24)}...` : compact;
    }

    async function buildApiRequestMessage(message, rpPlaceholders = null) {
      const role = message?.role || "user";
      const attachments = await Promise.all(normalizeImageAttachments(message?.attachments).map(async (attachment) => ({
        ...attachment,
        dataUrl: await resolveImageAttachmentDataUrl(attachment)
      })));
      const requestMessage = {
        role,
        content: buildApiMessageContent(role, message?.content, attachments, rpPlaceholders)
      };

      if (role === "user" && attachments.length) {
        const base64Images = attachments
          .map((attachment) => extractBase64Payload(attachment.dataUrl))
          .filter(Boolean);

        if (base64Images.length) {
          requestMessage.images = base64Images;
        }
      }

      return requestMessage;
    }

    function buildApiMessageContent(role, content, attachments = [], rpPlaceholders = null) {
      const normalizedContent = replaceRpPromptPlaceholders(String(content || ""), rpPlaceholders);
      if (role !== "user") {
        return normalizedContent;
      }

      const normalizedAttachments = normalizeImageAttachments(attachments);
      if (!normalizedAttachments.length) {
        return normalizedContent;
      }

      const parts = [];
      if (normalizedContent) {
        parts.push({
          type: "text",
          text: normalizedContent
        });
      }

      normalizedAttachments.forEach((attachment) => {
        parts.push({
          type: "image_url",
          image_url: {
            url: attachment.dataUrl,
            detail: "auto"
          }
        });
      });

      return parts;
    }

    function extractBase64Payload(dataUrl) {
      const value = String(dataUrl || "").trim();
      const match = value.match(/^data:[^;,]+;base64,(.+)$/i);
      return match?.[1] || "";
    }

    function normalizeApiBase(rawValue) {
      const value = String(rawValue || "").trim().replace(/\/+$/, "");
      if (!value) {
        return "";
      }

      if (/\/chat\/completions$/i.test(value)) {
        return value.replace(/\/chat\/completions$/i, "");
      }

      if (/\/models$/i.test(value)) {
        return value.replace(/\/models$/i, "");
      }

      if (/\/v\d+$/i.test(value)) {
        return value;
      }

      return `${value}/v1`;
    }

    function normalizeImageApiBase(rawValue) {
      return String(rawValue || "")
        .trim()
        .replace(/\/+$/, "")
        .replace(/\/sdapi\/v1\/txt2img$/i, "")
        .replace(/\/prompt$/i, "");
    }

    function buildHeaders() {

    function buildImageApiHeaders() {

    function setTabsStatus(message, tone = "default") {

    function setModelsStatus(message, tone = "default", options = {}) {

    }

    function normalizeOptionalNumber(value, options = {}) {
      const trimmed = String(value ?? "").trim();
      if (!trimmed) {
        return null;
      }

      const parsed = Number(trimmed);
      if (!Number.isFinite(parsed)) {
        return null;
      }

      if (typeof options.min === "number" && parsed < options.min) {
        return options.min;
      }

      if (typeof options.max === "number" && parsed > options.max) {
        return options.max;
      }

      return parsed;
    }

    function normalizeOptionalInteger(value, options = {}) {
      const parsed = normalizeOptionalNumber(value, options);
      return typeof parsed === "number" ? Math.trunc(parsed) : null;
    }

    function normalizeThemeMode(value) {
      return ["system", "dark", "light"].includes(value) ? value : DEFAULT_SETTINGS.themeMode;
    }

    function detectInitialAppLanguage() {
      if (typeof navigator === "undefined") {
        return "en";
      }

      const locales = Array.isArray(navigator.languages) && navigator.languages.length
        ? navigator.languages
        : [navigator.language, navigator.userLanguage].filter(Boolean);

      return locales.some((locale) => /^ko(?:[-_]|$)/i.test(String(locale || "").trim())) ? "ko" : "en";
    }

    function normalizeAppLanguage(value) {

    function normalizeRpResponsePerspective(value) {

    function normalizeRpResponseLength(value) {

        ? value
        : DEFAULT_RP_RESPONSE_LENGTH;

    function getUiLanguage() {

    function getUiLocale() {

    function t(key, params = {}) {

    function getRpCardKindLabel(kind) {

      return getAssistantFirstMessageDisplayContent(message);
    }

    function setLeadingLabelText(label, text) {
      if (!label) {
        return;
      }

      let textNode = null;
      let firstElement = null;
      for (const node of label.childNodes) {
        if (!textNode && node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
          textNode = node;
        }
        if (!firstElement && node.nodeType === Node.ELEMENT_NODE) {
          firstElement = node;
        }
        if (textNode && firstElement) {
          break;
        }
      }

      if (textNode) {
        textNode.textContent = `${text}\n`;
        return;
      }

      const fallbackTextNode = document.createTextNode(`${text}\n`);
      if (label.classList.contains("inline-checkbox") && firstElement) {
        label.insertBefore(fallbackTextNode, firstElement.nextSibling);
      } else {
        label.insertBefore(fallbackTextNode, firstElement || label.firstChild);
      }
    }

    function setFieldLabel(input, text) {
      setLeadingLabelText(input?.closest("label"), text);
    }

    function setRangeFieldLabel(input, text) {
      const span = input?.closest("label")?.querySelector("span");
      const labelText = span?.firstChild;
      if (labelText?.nodeType === Node.TEXT_NODE) {
        labelText.textContent = `${text} `;
      } else if (span) {
        span.insertBefore(document.createTextNode(`${text} `), span.firstChild);
      }
    }

    function setButtonTitleAndAria(element, text) {

    function setTextContentIfPresent(element, text) {

    function setPlaceholderIfPresent(element, text) {

    function setAriaLabelIfPresent(element, text) {

      keys.forEach((key, index) => {

    function applyTranslatedTextContent(entries) {
      entries.forEach(([element, key]) => setTextContentIfPresent(element, t(key)));

    function applyTranslatedPlaceholders(entries) {
      entries.forEach(([element, key]) => setPlaceholderIfPresent(element, t(key)));

    function applyTranslatedFieldLabels(entries) {

    function applyTranslatedButtonTitles(entries) {

    function applyTranslatedIndexedTextContent(elementsList, keys) {

    function applyTranslatedRangeFieldLabels(entries) {
      entries.forEach(([element, key]) => setRangeFieldLabel(element, t(key)));

    function applyRpCardPanelTranslations(kind) {
      const isCharacter = kind === "character";
      const prefix = isCharacter ? "character" : "persona";
      const titlePrefix = isCharacter ? "Character" : "Persona";
      const nameInput = elements[`${prefix}CardNameInput`];
      const descriptionInput = elements[`${prefix}CardDescriptionInput`];

    function isDefaultChatTitle(title) {
      return /^새 채팅 \d+$/.test(title) || /^New Chat \d+$/.test(title);
    }

    function translateStatusToastMessage(message) {
      if (getUiLanguage() !== "en") {
        return message;
      }

      const cardKind = (value) => value === "캐릭터" ? "character" : value === "페르소나" ? "persona" : value;
      const exactMatches = {
        "탭 이름을 변경했습니다.": "Renamed the tab.",
        "일반 설정을 기본값으로 복원했습니다.": "Restored general settings to defaults.",
        "작가 노트를 비웠습니다.": "Cleared the Author's Note.",
        "이미지 자르기를 취소했습니다.": "Canceled image cropping.",
        "활성 탭에서만 내보내기를 실행할 수 있습니다.": "You can only export from the active tab.",
        "압축 내보내기 라이브러리를 불러오지 못했습니다.": "Failed to load the zip export library.",
        "활성 탭에서만 가져오기를 실행할 수 있습니다.": "You can only import from the active tab.",
        "먼저 채팅 탭을 선택해 주세요.": "Select a chat tab first.",
        "메시지 수정을 먼저 저장해 주세요.": "Save your message edits first.",
        "보낼 메시지나 이미지를 추가해 주세요.": "Add a message or image to send.",
        "API 주소가 비어 있습니다. 왼쪽 설정에서 입력해 주세요.": "API base URL is empty. Enter it in Settings.",
        "사용할 모델을 선택해 주세요. 필요하면 모델 새로고침을 먼저 실행해 주세요.": "Select a model to use. Refresh the model list first if needed.",
        "다시 생성할 응답이 없습니다.": "There is no response to reroll.",
        "응답을 스트리밍하는 중입니다.": "Streaming response.",
        "응답을 받았습니다.": "Response received.",
        "응답 생성을 중지했습니다.": "Stopped response generation.",
        "열어 둔 메시지 수정을 먼저 저장해 주세요.": "Save the open message edit first.",
        "빈 메시지는 저장할 수 없습니다.": "You cannot save an empty message.",
        "메시지를 수정했습니다.": "Updated the message.",
        "RP 모드로 전환했습니다.": "Switched to RP mode.",
        "채팅 모드로 전환했습니다.": "Switched to chat mode."
      };

      if (Object.prototype.hasOwnProperty.call(exactMatches, message)) {
        return exactMatches[message];
      }

      const patterns = [
        [/^요청 실패: (.+)$/u, (_, error) => `Request failed: ${error}`],
        [/^이미지 자르기 실패: (.+)$/u, (_, error) => `Image crop failed: ${error}`],
        [/^이미지 지정 실패: (.+)$/u, (_, error) => `Failed to set image: ${error}`],
        [/^가져오기 실패: (.+)$/u, (_, error) => `Import failed: ${error}`],
        [/^이미지 첨부 실패: (.+)$/u, (_, error) => `Failed to attach images: ${error}`],
        [/^(\d+)개 이미지를 첨부했습니다\.$/u, (_, count) => `Attached ${count} image${Number(count) === 1 ? "" : "s"}.`],
        [/^(캐릭터|페르소나) 이미지를 정사각형으로 반영했습니다\. 저장해 확정하세요\.$/u, (_, kind) => `Applied the ${cardKind(kind)} image as a square. Save to confirm it.`],
        [/^(캐릭터|페르소나) 카드를 만들었습니다\.$/u, (_, kind) => `Created the ${cardKind(kind)} card.`],
        [/^(캐릭터|페르소나) 카드를 찾지 못했습니다\.$/u, (_, kind) => `Could not find the ${cardKind(kind)} card.`],
        [/^(캐릭터|페르소나) 카드를 저장했습니다\.$/u, (_, kind) => `Saved the ${cardKind(kind)} card.`],
        [/^(캐릭터|페르소나) 카드를 삭제했습니다\.$/u, (_, kind) => `Deleted the ${cardKind(kind)} card.`],
        [/^(캐릭터|페르소나) 카드가 없습니다\.$/u, (_, kind) => `There is no ${cardKind(kind)} card.`],
        [/^(캐릭터|페르소나) 카드를 가져왔습니다\.$/u, (_, kind) => `Imported the ${cardKind(kind)} card.`],
        [/^(.+) 카드를 \.charcard로 내보냈습니다\.$/u, (_, name) => `Exported ${name} as a .charcard file.`]
      ];

      for (const [pattern, formatter] of patterns) {
        const match = message.match(pattern);
        if (match) {
          return formatter(...match);
        }
      }

      return message;
    }

    function showChatStatusToast(message, tone = "default") {
      const element = elements.chatStatusToast;
      if (!element) {
        return;
      }

      if (chatStatusToastTimerId) {
        window.clearTimeout(chatStatusToastTimerId);
        chatStatusToastTimerId = 0;
      }

      element.textContent = translateStatusToastMessage(String(message ?? ""));
      element.className = `status-toast${tone === "default" ? "" : ` ${tone}`}`;
      element.classList.add("open");
      element.setAttribute("aria-hidden", "false");

      const duration = tone === "error" ? 2200 : 1500;
      chatStatusToastTimerId = window.setTimeout(() => {
        element.className = "status-toast";
        element.setAttribute("aria-hidden", "true");
        chatStatusToastTimerId = 0;
      }, duration);
    }

    function formatDate(value, withTime = false) {
      if (!value) {
        return "-";
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat(getUiLocale(), {
        month: "short",
        day: "numeric",
        hour: withTime ? "2-digit" : undefined,
        minute: withTime ? "2-digit" : undefined,
        hour12: withTime ? false : undefined,
        hourCycle: withTime ? "h23" : undefined
      }).format(date);
    }

    function formatRelativeTimeShort(value) {
      if (!value) {
        return "-";
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      const diffMs = Date.now() - date.getTime();
      if (diffMs < 0) {
        return t("justNow");
      }

      const diffMinutes = Math.floor(diffMs / 60000);
      if (diffMinutes < 1) {
        return t("justNow");
      }

      if (diffMinutes < 60) {
        return t("minutesAgo", { count: diffMinutes });
      }

      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) {
        return t("hoursAgo", { count: diffHours });
      }

      const diffDays = Math.floor(diffHours / 24);
      return t("daysAgo", { count: diffDays });
    }

    function buildTimestampForFilename() {
      const date = new Date();
      const datePart = [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("");
      const timePart = [
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0"),
        String(date.getSeconds()).padStart(2, "0")
      ].join("");

      return `${datePart}-${timePart}`;
    }

    function sanitizeDownloadFileName(value, fallback = "download") {
      const normalized = String(value || "")
        .replace(/[<>:"/\\|?*\x00-\x1f]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/[.\s]+$/g, "");

      return normalized || String(fallback || "download").trim() || "download";
    }

    function formatUnixTimestamp(unixSeconds) {
      if (!unixSeconds) {
        return "-";
      }

      return formatDate(new Date(unixSeconds * 1000).toISOString(), true);
    }
