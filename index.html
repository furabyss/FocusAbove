        console.error("Failed to read media record", error);
        return "";
      }
    }

    async function detachImageAttachmentMedia(attachment) {
      const normalized = cloneImageAttachment(attachment);
      if (!supportsIndexedDb() || !normalized.dataUrl) {
        return normalized;
      }

      const mediaId = normalized.mediaId || createId("media");
      await writeMediaRecord(mediaId, normalized);
      return {
        ...normalized,
        mediaId,
        dataUrl: ""
      };
    }

    async function detachImageAttachmentsMedia(attachments) {
      return Promise.all(normalizeImageAttachments(attachments).map(detachImageAttachmentMedia));
    }

    async function writeStoredState(snapshot) {
      if (supportsIndexedDb()) {
        try {
          const { metadataState, chatIds, chatRecords } = createIndexedDbStateWritePlan(snapshot);
          await writeIndexedDbRecord(APP_DB_RECORD_KEY, metadataState);

          const deletedChatIds = [...persistedChatRecordIds].filter((chatId) => !chatIds.has(chatId));
          await Promise.all(deletedChatIds.map((chatId) => deleteIndexedDbRecord(`${APP_CHAT_RECORD_PREFIX}${chatId}`)));
          await Promise.all(chatRecords.map((record) => writeIndexedDbRecord(record.key, record.value)));
          persistedChatRecordIds = chatIds;

          localStorage.removeItem(APP_STORAGE_KEY);
          return;
        } catch (error) {
          console.error("Failed to write state to IndexedDB", error);
        }
      }

      localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(snapshot));
    }

    function cloneStateForPersistence(nextState) {
      let snapshot;
      if (typeof structuredClone === "function") {
        try {
          snapshot = structuredClone(nextState);
          return scrubSettingsSecretsFromSnapshot(snapshot);
        } catch (error) {
          console.warn("structuredClone failed during persistence snapshot, falling back to JSON clone", error);
        }
      }

      snapshot = JSON.parse(JSON.stringify(nextState));
      return scrubSettingsSecretsFromSnapshot(snapshot);
    }

    function scrubSettingsSecretsFromSnapshot(snapshot) {
      if (supportsSettingsSecretStorage() && snapshot?.settings) {
        snapshot.settings.apiKey = "";
        snapshot.settings.imageApiKey = "";
      }
      forEachStateImageAttachment(snapshot, (attachment) => {
        if (attachment?.mediaId) {
          attachment.dataUrl = "";
        }
      });
      scrubEphemeralMessageStateFromSnapshot(snapshot);
      return snapshot;
    }

    function scrubEphemeralMessageStateFromSnapshot(snapshot) {
      const chatGroups = [snapshot?.chats, ...Object.values(snapshot?.rp?.chatsByCharacterId || {})];
      chatGroups.forEach((chats) => {
        if (!Array.isArray(chats)) {
          return;
        }

        chats.forEach((chat) => {
          if (!Array.isArray(chat?.messages)) {
            return;
          }

          chat.messages.forEach((message) => {
            if (message && typeof message === "object") {
              delete message.auxiliaryStatus;
            }
          });
        });
      });
    }

    function forEachStateImageAttachment(targetState, callback) {
      if (!targetState || typeof callback !== "function") {
        return;
      }

      [targetState.chats, ...Object.values(targetState.rp?.chatsByCharacterId || {})].forEach((chats) => {
        (Array.isArray(chats) ? chats : []).forEach((chat) => {
          (Array.isArray(chat?.messages) ? chat.messages : []).forEach((message) => {
            (Array.isArray(message?.attachments) ? message.attachments : []).forEach(callback);
            message?.illustration?.image && callback(message.illustration.image);
          });
        });
      });

      [targetState.rp?.characterCards, targetState.rp?.personaCards].forEach((cards) => {
        (Array.isArray(cards) ? cards : []).forEach((card) => {
          card?.profileImage && callback(card.profileImage);
        });
      });
    }

    async function migrateStateMediaToIndexedDb(targetState) {
      if (!supportsIndexedDb()) {
        return false;
      }

      const attachments = [];
      forEachStateImageAttachment(targetState, (attachment) => {
        if (attachment?.dataUrl) {
          attachments.push(attachment);
        }
      });

      if (!attachments.length) {
        return false;
      }

      for (const attachment of attachments) {
        const mediaId = attachment.mediaId || createId("media");
        await writeMediaRecord(mediaId, attachment, { cache: false });
        attachment.mediaId = mediaId;
        attachment.dataUrl = "";
      }

      return true;
    }

    async function hydrateSettingsSecrets(nextState) {
      if (!supportsSettingsSecretStorage()) {
        return { hadPlaintextSecrets: false };
      }

      const legacySecrets = getSettingsSecretsFromState(nextState);
      const encryptedSecrets = await readSettingsSecrets();
      const nextSecrets = {
        apiKey: typeof encryptedSecrets?.apiKey === "string" ? encryptedSecrets.apiKey : legacySecrets.apiKey,
        imageApiKey: typeof encryptedSecrets?.imageApiKey === "string" ? encryptedSecrets.imageApiKey : legacySecrets.imageApiKey
      };
      setSettingsSecretsOnState(nextState, nextSecrets);

      const hadPlaintextSecrets = hasAnySettingsSecret(legacySecrets);
      const shouldMigrateLegacySecrets = !encryptedSecrets && hadPlaintextSecrets;
      if (shouldMigrateLegacySecrets) {
        await writeSettingsSecrets(nextSecrets);
      } else {
        await ensureSettingsSecretKeyRing();
      }

      return { hadPlaintextSecrets };
    }

    function getSettingsSecretsFromState(sourceState = state) {
      return {
        apiKey: String(sourceState?.settings?.apiKey || ""),
        imageApiKey: String(sourceState?.settings?.imageApiKey || "")
      };
    }

    function setSettingsSecretsOnState(targetState, secrets) {
      if (!targetState?.settings) {
        return;
      }
      targetState.settings.apiKey = String(secrets?.apiKey || "");
      targetState.settings.imageApiKey = String(secrets?.imageApiKey || "");
    }

    function hasAnySettingsSecret(secrets) {
      return Boolean(String(secrets?.apiKey || "") || String(secrets?.imageApiKey || ""));
    }

    async function saveSettingsSecretsFromState() {
      if (!supportsSettingsSecretStorage()) {
        return false;
      }
      await writeSettingsSecrets(getSettingsSecretsFromState(state));
      return true;
    }

    async function readSettingsSecrets() {
      if (!supportsSettingsSecretStorage()) {
        return null;
      }

      const secretRecord = await readIndexedDbRecord(APP_SECRET_RECORD_KEY);
      if (!secretRecord?.probe || !secretRecord?.fields) {
        await ensureSettingsSecretKeyRing();
        return null;
      }

      const secretKey = await resolveSettingsSecretKey(secretRecord);
      if (!secretKey) {
        return null;
      }

      return {
        apiKey: secretRecord.fields.apiKey ? await decryptSecretValue(secretKey, secretRecord.fields.apiKey) : "",
        imageApiKey: secretRecord.fields.imageApiKey ? await decryptSecretValue(secretKey, secretRecord.fields.imageApiKey) : ""
      };
    }

    async function writeSettingsSecrets(secrets) {
      if (!supportsSettingsSecretStorage()) {
        return false;
      }

      const normalizedSecrets = {
        apiKey: String(secrets?.apiKey || ""),
        imageApiKey: String(secrets?.imageApiKey || "")
      };

      if (!hasAnySettingsSecret(normalizedSecrets)) {
        await ensureSettingsSecretKeyRing();
        await deleteIndexedDbRecord(APP_SECRET_RECORD_KEY);
        return true;
      }

      const existingSecretRecord = await readIndexedDbRecord(APP_SECRET_RECORD_KEY);
      const secretKey = await resolveSettingsSecretKey(existingSecretRecord) || await selectSettingsSecretKeyForWrite();
      const secretRecord = {
        version: 1,
        updatedAt: new Date().toISOString(),
        probe: await encryptSecretValue(secretKey, APP_SECRET_PROBE_TEXT),
        fields: {
          apiKey: await encryptSecretValue(secretKey, normalizedSecrets.apiKey),
          imageApiKey: await encryptSecretValue(secretKey, normalizedSecrets.imageApiKey)
        }
      };

      await writeIndexedDbRecord(APP_SECRET_RECORD_KEY, secretRecord);
      return true;
    }

    async function resolveSettingsSecretKey(secretRecord) {
      if (!secretRecord?.probe) {
        return null;
      }

      const records = await ensureSettingsSecretKeyRing();
      for (const record of records) {
        try {
          const probeText = await decryptSecretValue(record.value.key, secretRecord.probe);
          if (probeText === APP_SECRET_PROBE_TEXT) {
            return record.value.key;
          }
        } catch {
          // Decoy keys are expected to fail the probe.
        }
      }
      return null;
    }

    async function selectSettingsSecretKeyForWrite() {
      const records = await ensureSettingsSecretKeyRing();
      if (!records.length) {
        throw new Error("API 키 암호화 키를 만들지 못했습니다.");
      }
      return records[getCryptoRandomInteger(records.length)].value.key;
    }

    async function ensureSettingsSecretKeyRing() {
      const records = await readSettingsSecretKeyRecords();
      while (records.length < APP_SECRET_KEY_RING_SIZE) {
        const id = createSecretKeyRecordId();
        const value = {
          version: 1,
          createdAt: new Date().toISOString(),
          key: await generateSettingsSecretKey()
        };
        await writeIndexedDbRecord(id, value);
        records.push({ id, value });
      }
      return records;
    }

    async function readSettingsSecretKeyRecords() {
      const records = await readIndexedDbRecordsByKeyPrefix(APP_SECRET_KEY_RECORD_PREFIX);
      return records.filter((record) => record?.value?.key);
    }

    async function generateSettingsSecretKey() {
      return window.crypto.subtle.generateKey(
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptSecretValue(secretKey, value) {
      const iv = getCryptoRandomBytes(12);
      const payload = new TextEncoder().encode(String(value || ""));
      const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, secretKey, payload);
      return {
        alg: "AES-GCM",
        iv: bytesToBase64(iv),
        ciphertext: arrayBufferToBase64(ciphertext)
      };
    }

    async function decryptSecretValue(secretKey, encryptedValue) {
      if (encryptedValue?.alg !== "AES-GCM") {
        throw new Error("지원하지 않는 암호화 형식입니다.");
      }
      const iv = base64ToBytes(encryptedValue.iv);
      const ciphertext = base64ToArrayBuffer(encryptedValue.ciphertext);
      const plaintext = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, secretKey, ciphertext);
      return new TextDecoder().decode(plaintext);
    }

    function createSecretKeyRecordId() {
      return `${APP_SECRET_KEY_RECORD_PREFIX}${bytesToBase64Url(getCryptoRandomBytes(16))}`;
    }

    function getCryptoRandomBytes(length) {
      const bytes = new Uint8Array(length);
      window.crypto.getRandomValues(bytes);
      return bytes;
    }

    function getCryptoRandomInteger(maxExclusive) {
      const bytes = getCryptoRandomBytes(4);
      const value = new DataView(bytes.buffer).getUint32(0);
      return value % Math.max(1, maxExclusive);
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const byteArray = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      byteArray.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary);
    }

    function arrayBufferToBase64(buffer) {
      return bytesToBase64(new Uint8Array(buffer));
    }

    function bytesToBase64Url(bytes) {
      return bytesToBase64(bytes).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function base64ToBytes(value) {
      const binary = atob(String(value || ""));
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    function base64ToArrayBuffer(value) {
      return base64ToBytes(value).buffer;
    }

    function signalStateSync() {
      localStorage.setItem(APP_STATE_SYNC_KEY, JSON.stringify({
        updatedAt: new Date().toISOString(),
        nonce: Math.random().toString(36).slice(2, 10)
      }));
    }

    function hasPendingStatePersistWork() {
      return pendingStatePersistRequested || Boolean(persistStateTimerId) || isStatePersistWriteInFlight;
    }

    function requestInactiveChatUnload() {
      pendingInactiveChatUnloadRequested = true;
      flushPendingInactiveChatUnload();
    }

    function flushPendingInactiveChatUnload() {
      if (!pendingInactiveChatUnloadRequested || hasPendingStatePersistWork()) {
        return;
      }

      pendingInactiveChatUnloadRequested = false;
      unloadInactiveChatMessages();
    }

    function writeLegacyEmergencyStateSnapshot() {
      try {
        localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(cloneStateForPersistence(state)));
      } catch (error) {
        console.error("Failed to write legacy emergency state snapshot", error);
      }
    }

    function persistState() {
      if (!isPrimaryTab) {
        return;
      }

      pendingStatePersistRequested = true;
      if (persistStateTimerId) {
        return;
      }

      persistStateTimerId = window.setTimeout(flushPendingStatePersist, getPersistStateDebounceMs());
    }

    function persistStateNow() {
      if (!isPrimaryTab) {
        return;
      }

      pendingStatePersistRequested = true;
      if (persistStateTimerId) {
        window.clearTimeout(persistStateTimerId);
        persistStateTimerId = 0;
      }

      flushPendingStatePersist();
    }

    function flushPendingStatePersist() {
      if (persistStateTimerId) {
        window.clearTimeout(persistStateTimerId);
        persistStateTimerId = 0;
      }

      const shouldPersist = pendingStatePersistRequested;
      pendingStatePersistRequested = false;
      if (!shouldPersist) {
        flushPendingInactiveChatUnload();
        return;
      }

      const snapshot = cloneStateForPersistence(state);

      persistStateInFlight = persistStateInFlight
        .catch(() => {})
        .then(async () => {
          isStatePersistWriteInFlight = true;
          await writeStoredState(snapshot);
          signalStateSync();
        })
        .catch((error) => {
          console.error("Failed to persist state", error);
        })
        .finally(() => {
          isStatePersistWriteInFlight = false;
          flushPendingInactiveChatUnload();
          if (pendingStatePersistRequested && !persistStateTimerId) {
            persistStateTimerId = window.setTimeout(flushPendingStatePersist, getPersistStateDebounceMs());
          }
        });
    }

    function getPersistStateDebounceMs() {
      return currentStreamingMessageId
        ? STREAMING_PERSIST_STATE_DEBOUNCE_MS
        : PERSIST_STATE_DEBOUNCE_MS;
    }

    function normalizeChat(chat) {
      if (!chat || typeof chat !== "object") {
        return null;
      }

      const messagesLoaded = typeof chat.messagesLoaded === "boolean"
        ? chat.messagesLoaded
        : Array.isArray(chat.messages);
      const messages = messagesLoaded ? normalizeStoredChatMessages(chat.messages) : [];
      const messageCount = messagesLoaded
        ? messages.length
        : normalizeOptionalInteger(chat.messageCount, { min: 0 }) ?? 0;

      return {
        id: typeof chat.id === "string" && chat.id ? chat.id : createId("chat"),
        title: typeof chat.title === "string" && chat.title.trim() ? chat.title.trim() : suggestChatTitle(messages),
        systemPrompt: typeof chat.systemPrompt === "string" ? chat.systemPrompt : "",
        authorsNote: typeof chat.authorsNote === "string" ? chat.authorsNote : "",
        rpSummary: typeof chat.rpSummary === "string" ? chat.rpSummary : "",
        rpSummaryUpdatedMessageCount: normalizeOptionalInteger(chat.rpSummaryUpdatedMessageCount, { min: 0 }) ?? 0,
        rpSceneState: typeof chat.rpSceneState === "string" ? chat.rpSceneState : "",
        autoTitleGenerated: Boolean(chat.autoTitleGenerated),
        titleManuallyEdited: Boolean(chat.titleManuallyEdited),
        characterCardId: typeof chat.characterCardId === "string" ? chat.characterCardId : "",
        createdAt: typeof chat.createdAt === "string" ? chat.createdAt : new Date().toISOString(),
        updatedAt: typeof chat.updatedAt === "string" ? chat.updatedAt : new Date().toISOString(),
        messageCount,
        messagesLoaded,
        messages
      };
    }

    function normalizeStoredChatMessages(messages) {
      return Array.isArray(messages)
        ? messages
          .filter((message) => message && typeof message.content === "string")
          .map((message) => ({
            id: typeof message.id === "string" && message.id ? message.id : createId("msg"),
            role: ["system", "user", "assistant"].includes(message.role) ? message.role : "assistant",
            content: message.content,
            attachments: normalizeImageAttachments(message.attachments),
            timestamp: typeof message.timestamp === "string" ? message.timestamp : new Date().toISOString(),
            status: normalizeMessageStatus(message.status),
            isThinking: Boolean(message.isThinking),
            isFirstMessage: Boolean(message.isFirstMessage),
            illustration: normalizeMessageIllustration(message.illustration),
            rpSceneState: typeof message.rpSceneState === "string" ? message.rpSceneState : "",
            responseTokens: normalizeOptionalInteger(message.responseTokens, { min: 0 }),
            contextTokens: normalizeOptionalInteger(message.contextTokens, { min: 0 }),
            characterCardId: typeof message.characterCardId === "string" ? message.characterCardId : "",
            personaCardId: typeof message.personaCardId === "string" ? message.personaCardId : ""
          }))
        : [];
    }

    function getChatMessageCount(chat) {
      if (!chat || typeof chat !== "object") {
        return 0;
      }

      if (chat.messagesLoaded !== false && Array.isArray(chat.messages)) {
        return chat.messages.length;
      }

      return normalizeOptionalInteger(chat.messageCount, { min: 0 }) ?? 0;
    }

    function syncChatMessageCount(chat) {
      if (!chat || typeof chat !== "object") {
        return 0;
      }

      chat.messageCount = getChatMessageCount(chat);
      return chat.messageCount;
    }

    function unloadChatMessages(chat) {
      if (!chat || typeof chat !== "object") {
        return;
      }

      syncChatMessageCount(chat);
      chat.messages = [];
      chat.messagesLoaded = false;
    }

    function unloadInactiveChatMessages() {
      const activeChatId = getCurrentActiveChatId();
      if (!persistedChatRecordIds.size) {
        return;
      }

      getAllStateChats().forEach((chat) => {
        if (chat.id !== activeChatId) {
          unloadChatMessages(chat);
        }
      });
    }

    async function ensureChatMessagesLoaded(chatOrId) {
      const chat = typeof chatOrId === "string" ? findChatById(chatOrId) : chatOrId;
      if (!chat) {
        return null;
      }

      if (chat.messagesLoaded !== false) {
        syncChatMessageCount(chat);
        return chat;
      }

      if (!supportsIndexedDb()) {
        chat.messages = Array.isArray(chat.messages) ? chat.messages : [];
        chat.messagesLoaded = true;
        syncChatMessageCount(chat);
        return chat;
      }

      const existingPromise = chatMessageLoadPromises.get(chat.id);
      if (existingPromise) {
        return existingPromise;
      }

      const loadPromise = readChatMessagesFromIndexedDb(chat.id)
        .then((record) => {
          chat.messages = normalizeStoredChatMessages(record?.messages);
          chat.messagesLoaded = true;
          chat.messageCount = chat.messages.length;
          return chat;
        })
        .finally(() => {
          chatMessageLoadPromises.delete(chat.id);
        });

      chatMessageLoadPromises.set(chat.id, loadPromise);
      return loadPromise;
    }

    async function ensureChatsLoaded(chats) {
      await Promise.all((Array.isArray(chats) ? chats : []).map((chat) => ensureChatMessagesLoaded(chat)));
    }

    async function ensureCurrentActiveChatLoaded() {
      const activeChatId = getCurrentActiveChatId();
      if (!activeChatId) {
        unloadInactiveChatMessages();
        return null;
      }

      const chat = await ensureChatMessagesLoaded(activeChatId);
      if (getCurrentActiveChatId() === activeChatId) {
        unloadInactiveChatMessages();
      }
      return chat;
    }

    function normalizeMessageIllustration(illustration) {
      if (!illustration || typeof illustration !== "object") {
        return null;
      }

      const image = normalizeImageAttachments(illustration.image ? [illustration.image] : [])[0] || null;
      const status = ["generating", "complete", "error"].includes(illustration.status) ? illustration.status : (image ? "complete" : "generating");
      return {
        status,
        prompt: typeof illustration.prompt === "string" ? illustration.prompt : "",
        image,
        error: typeof illustration.error === "string" ? illustration.error : "",
        createdAt: typeof illustration.createdAt === "string" ? illustration.createdAt : new Date().toISOString(),
        updatedAt: typeof illustration.updatedAt === "string" ? illustration.updatedAt : new Date().toISOString()
      };
    }

    function readTabLockRecord() {
      try {
        const raw = localStorage.getItem(TAB_LOCK_KEY);
        if (!raw) {
          return null;
        }

        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : null;
      } catch (error) {
        console.error("Failed to read tab lock", error);
        return null;
      }
    }

    function isFreshTabLock(lockRecord) {
      if (!lockRecord || typeof lockRecord !== "object") {
        return false;
      }

      const heartbeatSource = lockRecord.heartbeatAt || lockRecord.acquiredAt;
      const heartbeatAt = Date.parse(heartbeatSource || "");
      return Number.isFinite(heartbeatAt) && Date.now() - heartbeatAt < TAB_LOCK_TTL_MS;
    }

    function claimPrimaryTab(options = {}) {
      const lockRecord = readTabLockRecord();
      if (lockRecord && lockRecord.tabId !== tabSessionId && isFreshTabLock(lockRecord)) {
        setPrimaryTabState(false);
        return false;
      }

      const nextLock = {
        tabId: tabSessionId,
        acquiredAt: lockRecord?.tabId === tabSessionId ? lockRecord.acquiredAt || tabOpenedAt : tabOpenedAt,
        heartbeatAt: new Date().toISOString()
      };

      localStorage.setItem(TAB_LOCK_KEY, JSON.stringify(nextLock));

      const confirmedLock = readTabLockRecord();
      const claimed = Boolean(confirmedLock && confirmedLock.tabId === tabSessionId);
      if (claimed) {
        if (options.skipActivation) {
          setPrimaryTabState(true);
        } else {
          void activatePrimaryTab();
        }
      } else {
        setPrimaryTabState(false);
      }

      return claimed;
    }

    async function activatePrimaryTab() {
      const wasPrimary = isPrimaryTab;
      setPrimaryTabState(true);
      if (wasPrimary) {
        return;
      }

      state = await loadState();
      syncPersistedChatRecordIds(state);
      ensureInitialChat();
      populateSettingsForm();
      syncChatSelection();
      renderAll({ persist: false });
      await ensureCurrentActiveChatLoaded();
      renderAll();
      if (state.settings.apiBaseUrl) {
        void refreshModels({ silent: true });
      }
    }

    function setPrimaryTabState(nextValue) {
      isPrimaryTab = nextValue;
      renderTabLockState();
    }

    function renderTabLockState() {
      const isLocked = !isPrimaryTab;
      elements.tabLockWarning.classList.toggle("open", isLocked);
      elements.tabLockWarning.setAttribute("aria-hidden", isLocked ? "false" : "true");
      updateOverlayScrollLock();

      if (isLocked) {
        elements.appShell.setAttribute("inert", "");
        elements.appShell.setAttribute("aria-hidden", "true");
        elements.tabLockWarningMessage.textContent = t("tabLockMessage");
        return;
      }

      elements.appShell.removeAttribute("inert");
      elements.appShell.removeAttribute("aria-hidden");
    }

    function startTabLockLoop() {
      if (tabLockIntervalId) {
        return;
      }

      tabLockIntervalId = window.setInterval(() => {
        if (isPrimaryTab) {
          const currentLock = readTabLockRecord();
          if (currentLock && currentLock.tabId !== tabSessionId && isFreshTabLock(currentLock)) {
            setPrimaryTabState(false);
            return;
          }

          localStorage.setItem(TAB_LOCK_KEY, JSON.stringify({
            tabId: tabSessionId,
            acquiredAt: currentLock?.tabId === tabSessionId ? currentLock.acquiredAt || tabOpenedAt : tabOpenedAt,
            heartbeatAt: new Date().toISOString()
          }));
          return;
        }

        claimPrimaryTab();
      }, TAB_LOCK_HEARTBEAT_MS);
    }

    function releasePrimaryTab() {
      writeLegacyEmergencyStateSnapshot();
      persistStateNow();

      if (tabLockIntervalId) {
        window.clearInterval(tabLockIntervalId);
        tabLockIntervalId = 0;
      }

      const lockRecord = readTabLockRecord();
      if (lockRecord?.tabId === tabSessionId) {
        localStorage.removeItem(TAB_LOCK_KEY);
      }
    }

    async function refreshStateFromStorage() {
      state = await loadState();
      syncPersistedChatRecordIds(state);
      populateSettingsForm();
      syncChatSelection();
      renderAll({ persist: false });
      if (isPrimaryTab) {
        await ensureCurrentActiveChatLoaded();
        renderAll({ persist: false });
      }
    }

    function handleStorageSync(event) {
      if (event.key === APP_STATE_SYNC_KEY && !isPrimaryTab) {
        void refreshStateFromStorage();
        return;
      }

      if (event.key !== TAB_LOCK_KEY) {
        return;
      }

      const lockRecord = readTabLockRecord();
      if (lockRecord?.tabId === tabSessionId && isFreshTabLock(lockRecord)) {
        void activatePrimaryTab();
        return;
      }

      if (!lockRecord || !isFreshTabLock(lockRecord)) {
        claimPrimaryTab();
        return;
      }

      setPrimaryTabState(false);
    }

    function ensureInitialChat() {
      if (isRpModeActive()) {
        ensureRpModeReady();
        return;
      }

      if (!state.chats.length) {
        const initialChat = createChatRecord();
        state.chats.push(initialChat);
        state.activeChatId = initialChat.id;
        persistState();
      }
    }

    function syncChatSelection() {
      if (isRpModeActive()) {
        ensureRpModeReady();
        const characterId = state.rp.activeCharacterId;
        if (!characterId) {
          return;
        }

        const chats = getRpChatsForCharacterId(characterId);
        const activeChatId = state.rp.activeChatIdsByCharacterId[characterId];
        if (!chats.some((chat) => chat.id === activeChatId) && chats.length) {
          state.rp.activeChatIdsByCharacterId[characterId] = chats[0].id;
        }
        return;
      }

      const activeExists = state.chats.some((chat) => chat.id === state.activeChatId);
      if (!activeExists && state.chats.length) {
        state.activeChatId = state.chats[0].id;
      }
    }

    function createChatRecord(options = {}) {
      const createdAt = new Date().toISOString();
      const characterCardId = typeof options.characterCardId === "string" ? options.characterCardId : "";
      const existingRpChats = characterCardId ? state.rp?.chatsByCharacterId?.[characterCardId] : null;
      const titleNumber = characterCardId
        ? (Array.isArray(existingRpChats) ? existingRpChats.length + 1 : 1)
        : state.chats.length + 1;
      const characterCard = characterCardId ? getRpCardById("character", characterCardId) : null;
      const firstMessage = String(characterCard?.firstMessage || "").trim();
      const messages = firstMessage ? [createRpFirstMessageMessage(characterCardId, firstMessage, createdAt)] : [];
      return {
        id: createId("chat"),
        title: t("newChatTitle", { count: titleNumber }),
        systemPrompt: "",
        authorsNote: "",
        rpSummary: "",
        rpSummaryUpdatedMessageCount: 0,
        rpSceneState: "",
        autoTitleGenerated: false,
        titleManuallyEdited: false,
        characterCardId,
        createdAt,
        updatedAt: createdAt,
        messageCount: messages.length,
        messagesLoaded: true,
        messages
      };
    }

    function createRpFirstMessageMessage(characterCardId, content, timestamp = new Date().toISOString()) {
      return {
        id: createId("msg"),
        role: "assistant",
        content: String(content || ""),
        attachments: [],
        timestamp,
        status: "complete",
        isThinking: false,
        isFirstMessage: true,
        characterCardId: typeof characterCardId === "string" ? characterCardId : "",
        personaCardId: ""
      };
    }

    function syncRpCharacterChatFirstMessage(chat, characterCard) {
      if (!chat || !characterCard || chat.characterCardId !== characterCard.id) {
        return false;
      }

      const firstMessage = String(characterCard.firstMessage || "").trim();
      if (!firstMessage) {
        return false;
      }

      const firstMessageIndex = chat.messages.findIndex((message) => message.isFirstMessage);
      const hasConversationStarted = chat.messages.some((message, index) => index !== firstMessageIndex && !message.isFirstMessage);
      if (hasConversationStarted) {
        return false;
      }

      if (firstMessageIndex >= 0) {
        const existingMessage = chat.messages[firstMessageIndex];
        if (existingMessage.content === firstMessage) {
          return false;
        }

        chat.messages[firstMessageIndex] = {
          ...existingMessage,
          role: "assistant",
          content: firstMessage,
          characterCardId: characterCard.id,
          isFirstMessage: true
        };
        return true;
      }

      chat.messages.unshift(createRpFirstMessageMessage(characterCard.id, firstMessage, chat.createdAt || new Date().toISOString()));
      syncChatMessageCount(chat);
      return true;
    }

    function syncRpCharacterChatsFirstMessage(characterCardId) {
      const characterCard = getRpCardById("character", characterCardId);
      if (!characterCard) {
        return false;
      }

      let changed = false;
      getRpChatsForCharacterId(characterCardId).forEach((chat) => {
        if (syncRpCharacterChatFirstMessage(chat, characterCard)) {
          changed = true;
        }
      });
      return changed;
    }

    function createId(prefix) {
      return `${prefix}-${Math.random().toString(36).slice(2, 10)}-${Date.now().toString(36)}`;
    }

    function createModelSettingsDraft() {
      const activeChat = getActiveChat();
      return {
        chatId: activeChat?.id || "",
        selectedModel: state.settings.selectedModel || "",
        auxiliaryModel: state.settings.auxiliaryModel || "",
        temperature: state.settings.temperature,
        thinkingTokenLimit: state.settings.thinkingTokenLimit,
        thinkingUnlimited: state.settings.thinkingUnlimited !== false,
        rpResponsePerspective: normalizeRpResponsePerspective(state.rp?.responsePerspective),
        rpResponseLength: normalizeRpResponseLength(state.rp?.responseLength),
        systemPrompt: state.settings.systemPrompt || "",
        forbiddenWords: normalizeForbiddenWords(state.settings.forbiddenWords)
      };
    }

    function resetModelSettingsDraft() {
      modelSettingsDraft = createModelSettingsDraft();
    }

    function isRpModeActive() {
      return normalizeAppMode(state.activeMode) === "rp";
    }

    function getRpCardCollection(kind) {
      return kind === "character" ? state.rp.characterCards : state.rp.personaCards;
    }

    function getRpCardById(kind, cardId) {
      return getRpCardCollection(kind).find((card) => card.id === cardId) || null;
    }

    function getActiveRpCard(kind) {
      const activeId = kind === "character" ? state.rp.activeCharacterId : state.rp.activePersonaId;
      return getRpCardById(kind, activeId);
    }

    function getActiveRpCharacter() {
      return getActiveRpCard("character");
    }

    function getActiveRpPersona() {
      return getActiveRpCard("persona");
    }

    function moveRpCard(kind, fromCardId, toCardId) {
      if (!fromCardId || !toCardId || fromCardId === toCardId) {
        return false;
      }

      const cards = getRpCardCollection(kind);
      const fromIndex = cards.findIndex((card) => card.id === fromCardId);
      const toIndex = cards.findIndex((card) => card.id === toCardId);
      if (fromIndex < 0 || toIndex < 0 || fromIndex === toIndex) {
        return false;
      }

      const [movedCard] = cards.splice(fromIndex, 1);
      cards.splice(toIndex, 0, movedCard);
      return true;
    }

    function getRpChatsForCharacterId(characterId) {
      if (!characterId) {
        return [];
      }

      if (!Array.isArray(state.rp.chatsByCharacterId[characterId])) {
        state.rp.chatsByCharacterId[characterId] = [];
      }

      return state.rp.chatsByCharacterId[characterId];
    }

    function getCurrentChatCollection() {
      if (!isRpModeActive()) {
        return state.chats;
      }

      ensureRpModeReady();
      return getRpChatsForCharacterId(state.rp.activeCharacterId);
    }

    function getCurrentActiveChatId() {
      if (!isRpModeActive()) {
        return state.activeChatId;
      }

      const characterId = state.rp.activeCharacterId;
      return characterId ? (state.rp.activeChatIdsByCharacterId[characterId] || "") : "";
    }

    function setCurrentActiveChatId(chatId) {
      if (!isRpModeActive()) {
        state.activeChatId = chatId;
        return;
      }

      if (!state.rp.activeCharacterId) {
        return;
      }

      state.rp.activeChatIdsByCharacterId[state.rp.activeCharacterId] = chatId;
    }

    function ensureRpModeReady() {
      if (!state.rp || typeof state.rp !== "object") {
        state.rp = createDefaultRpState();
      }

      if (!state.rp.characterCards.length) {
        const character = createRpCardRecord("character");
        state.rp.characterCards.push(character);
        state.rp.activeCharacterId = character.id;
        state.rp.chatsByCharacterId[character.id] = [createChatRecord({ characterCardId: character.id })];
        state.rp.activeChatIdsByCharacterId[character.id] = state.rp.chatsByCharacterId[character.id][0].id;
      }

      if (!state.rp.personaCards.length) {
        const persona = createRpCardRecord("persona");
        state.rp.personaCards.push(persona);
        state.rp.activePersonaId = persona.id;
      }

      if (!state.rp.characterCards.some((card) => card.id === state.rp.activeCharacterId)) {
        state.rp.activeCharacterId = state.rp.characterCards[0]?.id || "";
      }

      if (!state.rp.personaCards.some((card) => card.id === state.rp.activePersonaId)) {
        state.rp.activePersonaId = state.rp.personaCards[0]?.id || "";
      }

      if (state.rp.activeCharacterId) {
        const chats = getRpChatsForCharacterId(state.rp.activeCharacterId);
        if (!chats.length) {
          const chat = createChatRecord({ characterCardId: state.rp.activeCharacterId });
          chats.push(chat);
          state.rp.activeChatIdsByCharacterId[state.rp.activeCharacterId] = chat.id;
        }

        syncRpCharacterChatsFirstMessage(state.rp.activeCharacterId);

        const activeChatId = state.rp.activeChatIdsByCharacterId[state.rp.activeCharacterId];
        if (!chats.some((chat) => chat.id === activeChatId)) {
          state.rp.activeChatIdsByCharacterId[state.rp.activeCharacterId] = chats[0].id;
        }
      }
    }

    function createRpCardRecord(kind) {
      const createdAt = new Date().toISOString();
      const count = getRpCardCollection(kind).length + 1;
      return {
        id: createId(`${kind}-card`),
        kind,
        name: `${getRpCardKindLabel(kind)} ${count}`,
        description: "",
        isWorldCard: false,
        mainCharacterDescription: "",
        firstMessage: kind === "character" ? "" : "",
        profileImage: null,
        createdAt,
        updatedAt: createdAt
      };
    }

    function createRpCardDraft(kind) {
      const activeCard = getActiveRpCard(kind);
      return {
        cardId: activeCard?.id || "",
        name: activeCard?.name || "",
        description: activeCard?.description || "",
        isWorldCard: kind === "character" ? Boolean(activeCard?.isWorldCard) : false,
        mainCharacterDescription: kind === "character" ? (activeCard?.mainCharacterDescription || "") : "",
        descriptionMode: kind === "character" ? "world" : "world",
        firstMessage: kind === "character" ? (activeCard?.firstMessage || "") : "",
        profileImage: activeCard?.profileImage ? cloneImageAttachment(activeCard.profileImage) : null
      };
    }

    function resetRpCardDraft(kind) {
      rpCardDrafts[kind] = createRpCardDraft(kind);
    }

    function getRpCardDraft(kind) {
      if (!rpCardDrafts[kind]) {
        resetRpCardDraft(kind);
      }

      return rpCardDrafts[kind];
    }

    function updateRpCardDraftField(kind, field, value) {
      const draft = getRpCardDraft(kind);
      draft[field] = value;
    }

    function getCharacterCardDescriptionDraftValue(draft = getRpCardDraft("character")) {
      if (draft?.isWorldCard && normalizeCharacterCardDescriptionMode(draft.descriptionMode) === "main-character") {
        return draft.mainCharacterDescription || "";
      }
      return draft?.description || "";
    }

    function getCharacterCardDescriptionPlaceholderKey(draft = getRpCardDraft("character")) {
      if (!draft?.isWorldCard) {
        return "characterDescriptionPlaceholder";
      }
      return normalizeCharacterCardDescriptionMode(draft.descriptionMode) === "main-character"
        ? "worldCardMainCharacterDescriptionPlaceholder"
        : "worldCardDescriptionPlaceholder";
    }

    function syncCharacterCardEditorModeControls() {
      const draft = getRpCardDraft("character");
      const isWorldCard = Boolean(draft?.isWorldCard);
      const descriptionMode = normalizeCharacterCardDescriptionMode(draft?.descriptionMode);
      elements.characterCardIsWorldCardInput.checked = isWorldCard;
      elements.characterCardDescriptionLabelText.hidden = isWorldCard;
      elements.characterCardDescriptionModeSelect.hidden = !isWorldCard;
      elements.characterCardDescriptionModeSelect.value = descriptionMode;
      elements.characterCardDescriptionInput.value = getCharacterCardDescriptionDraftValue(draft);
      elements.characterCardDescriptionInput.placeholder = t(getCharacterCardDescriptionPlaceholderKey(draft));
    }

    function updateCharacterCardDescriptionDraft() {
      const draft = getRpCardDraft("character");
      const value = elements.characterCardDescriptionInput.value;
      if (draft.isWorldCard && normalizeCharacterCardDescriptionMode(draft.descriptionMode) === "main-character") {
        draft.mainCharacterDescription = value;
        return;
      }
      draft.description = value;
    }

    function updateCharacterCardWorldCardDraft() {
      const draft = getRpCardDraft("character");
      draft.isWorldCard = elements.characterCardIsWorldCardInput.checked;
      if (!draft.isWorldCard) {
        draft.descriptionMode = "world";
      }
      syncCharacterCardEditorModeControls();
    }

    function updateCharacterCardDescriptionModeDraft() {
      const draft = getRpCardDraft("character");
      draft.descriptionMode = normalizeCharacterCardDescriptionMode(elements.characterCardDescriptionModeSelect.value);
      syncCharacterCardEditorModeControls();
    }

    async function switchAppMode(nextMode) {
      const normalizedMode = normalizeAppMode(nextMode);
      if (normalizedMode === normalizeAppMode(state.activeMode)) {
        return;
      }

      state.activeMode = normalizedMode;
      if (normalizedMode === "rp") {
        ensureRpModeReady();
      } else {
        ensureInitialChat();
      }

      resetModelSettingsDraft();
      resetRpCardDraft("character");
      resetRpCardDraft("persona");
      renderAll({ persist: false });
      await ensureCurrentActiveChatLoaded();
      renderAll();
      setSettingsOverlayTab(activeSettingsTab);
      setChatStatus(normalizedMode === "rp" ? t("switchedToRpMode") : t("switchedToChatMode"), "success");
    }

    function setSettingsOverlayTab(nextTab) {
      activeSettingsTab = nextTab === "model" || nextTab === "illustration" ? nextTab : "general";
      const isGeneral = activeSettingsTab === "general";
      const isModel = activeSettingsTab === "model";
      const isIllustration = activeSettingsTab === "illustration";
      elements.settingsIllustrationTabButton.hidden = false;

      elements.settingsGeneralTabButton.classList.toggle("active", isGeneral);
      elements.settingsGeneralTabButton.setAttribute("aria-selected", isGeneral ? "true" : "false");
      elements.settingsGeneralPanel.hidden = !isGeneral;

      elements.settingsModelTabButton.classList.toggle("active", isModel);
      elements.settingsModelTabButton.setAttribute("aria-selected", isModel ? "true" : "false");
      elements.settingsModelPanel.hidden = !isModel;

      elements.settingsIllustrationTabButton.classList.toggle("active", isIllustration);
      elements.settingsIllustrationTabButton.setAttribute("aria-selected", isIllustration ? "true" : "false");
      elements.settingsIllustrationPanel.hidden = !isIllustration;
    }

    function populateSettingsForm() {
      elements.apiBaseUrlInput.value = state.settings.apiBaseUrl || "";
      elements.apiKeyInput.value = state.settings.apiKey || "";
      elements.imageApiBaseUrlInput.value = state.settings.imageApiBaseUrl || DEFAULT_SETTINGS.imageApiBaseUrl;
      elements.imageApiKeyInput.value = state.settings.imageApiKey || "";
      elements.userAliasInput.value = state.settings.userAlias || "";
      elements.modelAliasInput.value = state.settings.modelAlias || "";
      elements.themeModeSelect.value = normalizeThemeMode(state.settings.themeMode);
      elements.languageSelect.value = normalizeAppLanguage(state.settings.language);
      elements.smoothStreamingInput.checked = state.settings.smoothStreaming !== false;
      elements.settingsRpSectionGroup.hidden = !isRpModeActive();
      elements.rpResponsePerspectiveField.hidden = !isRpModeActive();
      elements.rpResponseLengthField.hidden = !isRpModeActive();
      elements.rpAssistanceFields.hidden = !isRpModeActive();
      elements.rpResponsePerspectiveSelect.value = normalizeRpResponsePerspective(state.rp?.responsePerspective);
      elements.rpResponseLengthSelect.value = normalizeRpResponseLength(state.rp?.responseLength);
      const rpAssistance = normalizeRpAssistanceSettings(state.rp?.assistance);
      elements.rpSummaryEnabledInput.checked = rpAssistance.summaryEnabled;
      elements.rpSummaryTokenThresholdInput.value = rpAssistance.summaryTokenThreshold;
      elements.rpSummaryMaxTokensInput.value = rpAssistance.summaryMaxTokens;
      elements.rpInputEnhancementEnabledInput.checked = rpAssistance.inputEnhancementEnabled;
      syncRpAssistanceControls();
      populateIllustrationSettingsForm();
      elements.forbiddenWordsInput.value = formatForbiddenWords(state.settings.forbiddenWords);
    }

    function syncRpAssistanceControls() {
      const summaryEnabled = elements.rpSummaryEnabledInput.checked;
      const shouldShowThreshold = isRpModeActive() && summaryEnabled;
      elements.rpSummaryTokenThresholdField.hidden = !shouldShowThreshold;
      elements.rpSummaryTokenThresholdInput.disabled = !shouldShowThreshold;
      elements.rpSummaryMaxTokensField.hidden = !shouldShowThreshold;
      elements.rpSummaryMaxTokensInput.disabled = !shouldShowThreshold;
    }

    function populateIllustrationSettingsForm() {
      const illustrationSettings = normalizeRpIllustrationSettings(state.rp?.illustration);
      elements.illustrationEnabledInput.checked = illustrationSettings.enabled;
      elements.chatT2iEnabledInput.checked = state.settings.chatT2iEnabled === true;
      elements.illustrationIgnoreNonCharacterPeopleInput.checked = illustrationSettings.ignoreNonCharacterPeople;
      elements.illustrationPromptStyleSelect.value = illustrationSettings.promptStyle;
      elements.illustrationArtStyleSelect.value = illustrationSettings.artStyle;
      renderImageModelSelect(illustrationSettings.imageModel);
      elements.illustrationCfgScaleInput.value = illustrationSettings.cfgScale;
      elements.illustrationStepsInput.value = illustrationSettings.steps;
      elements.illustrationWidthInput.value = illustrationSettings.width;
      elements.illustrationHeightInput.value = illustrationSettings.height;
      syncIllustrationControls();
    }

    function renderImageModelSelect(selectedModel = normalizeRpIllustrationSettings(state.rp?.illustration).imageModel) {
      const models = normalizeImageModelList(state.imageModels);
      elements.imageModelSelect.innerHTML = "";

      appendSelectOption(elements.imageModelSelect, "", t("autoImageModel"));

      models.forEach((model) => {
        appendSelectOption(elements.imageModelSelect, model.id, model.label);
      });

      if (selectedModel && !models.some((model) => model.id === selectedModel)) {
        appendSelectOption(elements.imageModelSelect, selectedModel, selectedModel);
      }

      elements.imageModelSelect.value = selectedModel || "";
    }

    function renderAll(options = {}) {
      const { persist = true } = options;
      applyStaticTranslations();
      renderAppSections({
        persist,
        header: true,
        theme: true,
        chatList: true,
        activeChat: true,
        modelSelect: true,
        modelsPanel: true,
        rpCards: true,
        composerAttachments: true,
        composerControls: true,
        layout: true
      });
    }

    function renderAppSections(options = {}) {
      const {
        persist = true,
        theme = false,
        chatList = false,
        activeChat = false,
        modelSelect = false,
        modelsPanel = false,
        composerAttachments = false,
        composerControls = false,
        layout = false,
        header = false,
        rpCards = false
      } = options;

      ensureSystemThemeWatcher();
      syncChatSelection();
      if (theme) {
        applyThemeMode();
      }
      if (header || chatList || activeChat || composerControls) {
        renderHeader();
      }
      if (chatList) {
        renderChatList();
      }
      if (activeChat) {
        renderActiveChat();
      }
      if (modelSelect) {
        renderModelSelect();
      }
      if (modelsPanel) {
        renderModelsPanel();
      }
      if (rpCards || header || activeChat) {
        renderRpCardPanels();
      }
      if (composerAttachments) {
        renderComposerAttachments();
      }
      if (composerControls) {
        renderComposerControls();
      }
      if (layout) {
        scheduleComposerLayoutUpdate();
      }
      if (persist) {
        persistState();
      }
    }

    function renderHeader() {
      const rpMode = isRpModeActive();
      elements.chatModeButton.classList.toggle("active", !rpMode);
      elements.chatModeButton.setAttribute("aria-selected", rpMode ? "false" : "true");
      elements.rpModeButton.classList.toggle("active", rpMode);
      elements.rpModeButton.setAttribute("aria-selected", rpMode ? "true" : "false");
      elements.rpHeaderActions.hidden = !rpMode;
      renderAuthorsNoteButton();

      const tabTitle = rpMode
        ? t("rpTabTitle", { name: getActiveRpCharacter()?.name || t("character") })
        : t("chatTabTitle");
      elements.desktopTabsTitle.textContent = tabTitle;
      elements.tabsOverlayTitle.textContent = tabTitle;
      elements.tabsOverlayListTitle.textContent = tabTitle;
    }

    function renderAuthorsNoteButton() {
      const hasAuthorsNote = Boolean(getActiveChatAuthorsNote());
      elements.authorsNoteButton.hidden = !isRpModeActive();
      elements.authorsNoteButton.classList.toggle("active", hasAuthorsNote);
      const title = hasAuthorsNote ? t("authorsNoteActive") : t("authorsNote");
      elements.authorsNoteButton.title = title;
      elements.authorsNoteButton.setAttribute("aria-label", title);
    }

    function renderRpCardPanels() {
      renderRpCardPanel("character");
      renderRpCardPanel("persona");
    }

    function getRpCardPanelListSignature(kind, draft) {
      return [
        normalizeAppLanguage(state.settings.language),
        draft?.cardId || "",
        getRpCardCollection(kind)
          .map((card) => [card.id, card.updatedAt || "", card.name || "", card.profileImage?.id || ""].join(":"))
          .join("|")
      ].join("~");
    }

    function renderRpCardPanel(kind) {
      const draft = getRpCardDraft(kind);
      const isCharacter = kind === "character";
      const listElement = isCharacter ? elements.characterCardList : elements.personaCardList;
      const nameInput = isCharacter ? elements.characterCardNameInput : elements.personaCardNameInput;
      const descriptionInput = isCharacter ? elements.characterCardDescriptionInput : elements.personaCardDescriptionInput;
      const firstMessageInput = isCharacter ? elements.characterCardFirstMessageInput : null;

      const listSignature = getRpCardPanelListSignature(kind, draft);
      if (rpCardListRenderSignatures[kind] !== listSignature) {
        listElement.innerHTML = "";
        getRpCardCollection(kind).forEach((card) => {
          const button = createButton({
            className: `card-item${card.id === draft.cardId ? " active" : ""}`,
            label: t("cardSelect", { name: card.name }),
            title: card.name,
            attributes: {
              "data-card-id": card.id,
              "data-rp-card-kind": kind
            },
            onClick: () => {
              void selectRpCard(kind, card.id);
            }
          });

          button.appendChild(createRpCardThumb(card, kind));
          listElement.appendChild(button);
        });
        rpCardListRenderSignatures[kind] = listSignature;
      }

      nameInput.value = draft.name || "";
      if (isCharacter) {
        syncCharacterCardEditorModeControls();
      } else {
        descriptionInput.value = draft.description || "";
      }
      if (firstMessageInput) {
        firstMessageInput.value = draft.firstMessage || "";
      }
    }

    function getCardInitial(name, fallback = "?") {
      const value = String(name || "").trim();
      return value ? value.slice(0, 1).toUpperCase() : fallback;
    }

    function handleRpCardListClickCapture(event) {
      if (!suppressRpCardListClick) {
        return;
      }
      suppressRpCardListClick = false;
      event.preventDefault();
      event.stopPropagation();
    }

    function handleRpCardReorderPointerDown(event) {
      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      const thumb = event.target.closest(".card-thumb");
      const button = thumb?.closest(".card-item");
      const listElement = event.currentTarget;
      const kind = listElement?.dataset?.rpCardKind;
      const cardId = button?.dataset?.cardId;
      if (!thumb || !button || !kind || !cardId || button.parentElement !== listElement) {
        return;
      }

      rpCardDragState = {
        kind,
        cardId,
        pointerId: event.pointerId,
        pointerType: event.pointerType || "mouse",
        listElement,
        startClientX: event.clientX,
        startClientY: event.clientY,
        lastClientY: event.clientY,
        dragging: false,
        touchReady: event.pointerType !== "touch",
        touchCanceled: false,
        holdTimerId: 0
      };
      if (rpCardDragState.pointerType === "touch") {
        rpCardDragState.holdTimerId = window.setTimeout(() => {
          if (rpCardDragState && rpCardDragState.pointerId === event.pointerId) {
            rpCardDragState.touchReady = true;
          }
        }, RP_CARD_TOUCH_HOLD_MS);
      }
    }

    function handleRpCardReorderPointerMove(event) {
      if (!rpCardDragState || rpCardDragState.pointerId !== event.pointerId) {
        return;
      }

      const deltaX = event.clientX - rpCardDragState.startClientX;
      const deltaY = event.clientY - rpCardDragState.startClientY;
      if (!rpCardDragState.dragging) {
        const distance = Math.hypot(deltaX, deltaY);
        if (rpCardDragState.pointerType === "touch" && !rpCardDragState.touchReady) {
          const listElement = rpCardDragState.listElement;
          if (listElement) {
            listElement.scrollTop -= event.clientY - rpCardDragState.lastClientY;
          }
          rpCardDragState.lastClientY = event.clientY;
          if (distance >= RP_CARD_TOUCH_DRAG_THRESHOLD_PX) {
            if (rpCardDragState.holdTimerId) {
              window.clearTimeout(rpCardDragState.holdTimerId);
            }
            rpCardDragState.touchCanceled = true;
          }
          return;
        }
        if (rpCardDragState.pointerType === "touch" && rpCardDragState.touchCanceled) {
          return;
        }
        if (distance < RP_CARD_DRAG_THRESHOLD_PX) {
          return;
        }
        rpCardDragState.dragging = true;
      }

      const listElement = rpCardDragState.kind === "character" ? elements.characterCardList : elements.personaCardList;
      const currentButton = listElement.querySelector(`[data-card-id="${rpCardDragState.cardId}"]`);
      if (currentButton?.setPointerCapture) {
        try {
          currentButton.setPointerCapture(event.pointerId);
        } catch (_error) {
        }
      }
      listElement.classList.add("dragging");
      if (currentButton) {
        currentButton.classList.add("dragging");
      }

      const hoverButton = document.elementFromPoint(event.clientX, event.clientY)?.closest(".card-item");
      const targetCardId = hoverButton?.dataset?.cardId;
      if (!targetCardId || targetCardId === rpCardDragState.cardId || hoverButton.parentElement !== listElement) {
        event.preventDefault();
        return;
      }

      if (moveRpCard(rpCardDragState.kind, rpCardDragState.cardId, targetCardId)) {
        renderAppSections({ rpCards: true });
      }
      event.preventDefault();
    }

    function handleRpCardReorderPointerUp(event) {
      if (!rpCardDragState || rpCardDragState.pointerId !== event.pointerId) {
        return;
      }

      const { kind, cardId, dragging, holdTimerId } = rpCardDragState;
      if (holdTimerId) {
        window.clearTimeout(holdTimerId);
      }
      const listElement = kind === "character" ? elements.characterCardList : elements.personaCardList;
      const currentButton = listElement.querySelector(`[data-card-id="${cardId}"]`);
      listElement.classList.remove("dragging");
      if (currentButton) {
        currentButton.classList.remove("dragging");
        if (currentButton.releasePointerCapture) {
          try {
            currentButton.releasePointerCapture(event.pointerId);
          } catch (_error) {
          }
        }
      }
      if (dragging) {
        suppressRpCardListClick = true;
        window.setTimeout(() => {
          suppressRpCardListClick = false;
        }, 0);
        event.preventDefault();
      }
      rpCardDragState = null;
    }

    async function selectRpCard(kind, cardId) {
      if (!getRpCardCollection(kind).some((card) => card.id === cardId)) {
        return;
      }

      if (kind === "character") {
        state.rp.activeCharacterId = cardId;
        ensureRpModeReady();
        resetModelSettingsDraft();
      } else {
        state.rp.activePersonaId = cardId;
      }

      resetRpCardDraft(kind);
      renderAppSections({ persist: false, chatList: kind === "character", activeChat: true, modelsPanel: kind === "character", composerControls: true, rpCards: true, header: true });
      if (kind === "character") {
        await ensureCurrentActiveChatLoaded();
      }
      renderAppSections({
        chatList: kind === "character",
        activeChat: true,
        modelsPanel: kind === "character",
        composerControls: true,
        rpCards: true,
        header: true
      });
    }

    function getSortedCurrentChats() {
      return getCurrentChatCollection()
        .slice()
        .sort((first, second) => new Date(second.updatedAt) - new Date(first.updatedAt));
    }

    function getChatListRenderSignature(sortedChats = getSortedCurrentChats()) {
      const normalizedChats = Array.isArray(sortedChats) ? sortedChats : [];

      return [
        normalizeAppLanguage(state.settings.language),
        state.activeMode,
        getCurrentActiveChatId(),
        editingChatId,
        normalizedChats.map((chat) => [
          chat.id,
          chat.updatedAt || "",
          chat.title || "",
          getChatMessageCount(chat),
          editingChatId === chat.id ? (chatTitleDrafts.get(chat.id) ?? "") : ""
        ].join(":"))
          .join("|")
      ].join("~");
    }

    function getChatListRenderTargets(options = {}) {
      const includeOverlay = options.includeOverlay === true || elements.tabsOverlay?.classList.contains("open");
      const targets = [];

      if (window.innerWidth > 860 && elements.desktopChatList) {
        targets.push({
          key: "desktop",
          container: elements.desktopChatList,
          closeOverlayOnSelect: false
        });
      }

      if (includeOverlay && elements.chatList) {
        targets.push({
          key: "overlay",
          container: elements.chatList,
          closeOverlayOnSelect: true
        });
      }

      return targets;
    }

    function renderChatList(options = {}) {
      const renderTargets = getChatListRenderTargets(options);
      if (!renderTargets.length) {
        return;
      }

      const sortedChats = getSortedCurrentChats();
      const nextSignature = getChatListRenderSignature(sortedChats);

      renderTargets.forEach(({ key, container, closeOverlayOnSelect }) => {
        if (chatListRenderSignatures[key] === nextSignature) {
          return;
        }

        container.innerHTML = "";
        const fragment = document.createDocumentFragment();

        sortedChats.forEach((chat) => {
          fragment.appendChild(buildChatListItem(chat, { closeOverlayOnSelect }));
        });

        container.appendChild(fragment);
        chatListRenderSignatures[key] = nextSignature;
      });
    }

    function buildChatListItem(chat, options = {}) {
      const item = createElementWithClass("div", `chat-item${chat.id === getCurrentActiveChatId() ? " active" : ""}`);
      const isEditing = editingChatId === chat.id;

      const mainButton = document.createElement("button");
      mainButton.type = "button";
      mainButton.className = "chat-item-main";
      mainButton.addEventListener("click", () => {
        void selectChatById(chat.id, { closeOverlayOnSelect: options.closeOverlayOnSelect });
      });

      const copy = createElementWithClass("div", "chat-item-copy");

      if (isEditing) {
        const titleInput = document.createElement("input");
        titleInput.type = "text";
        titleInput.className = "chat-item-title-input";
        titleInput.value = chatTitleDrafts.get(chat.id) ?? chat.title;
        titleInput.setAttribute("aria-label", t("tabTitleInput"));
        titleInput.addEventListener("click", (event) => event.stopPropagation());
        titleInput.addEventListener("input", () => {
          chatTitleDrafts.set(chat.id, titleInput.value);
        });
        titleInput.addEventListener("keydown", (event) => {
          event.stopPropagation();
          if (event.key === "Enter") {
            event.preventDefault();
            commitChatTitleEdit(chat.id);
          } else if (event.key === "Escape") {
            event.preventDefault();
            cancelChatTitleEdit(chat.id);
          }
        });
        copy.appendChild(titleInput);
      } else {
        copy.appendChild(createElementWithClass("p", "chat-item-title", chat.title));
      }

      const messageCount = getChatMessageCount(chat);
      const meta = createElementWithClass("p", "chat-item-meta", t("chatMeta", { count: messageCount, date: formatDate(chat.updatedAt, true) }));

      copy.appendChild(meta);
      mainButton.appendChild(copy);

      const actions = createElementWithClass("div", "chat-item-actions");
      [
        [isEditing ? t("tabNameDone") : t("tabNameEdit"), "edit", () => toggleChatTitleEdit(chat.id)],
        [t("tabJsonExport"), "export", () => exportChatToJson(chat.id)],
        [t("tabClose"), "close", () => {
          void deleteChatById(chat.id);
        }, "danger"]
      ].forEach(([label, icon, onClick, tone = "default"]) => {
        actions.appendChild(createChatItemIconButton(label, icon, onClick, tone));
      });

      item.append(mainButton, actions);
      return item;
    }

    function createChatItemIconButton(label, icon, onClick, tone = "default") {
      return createIconButton({
        className: "chat-item-icon-button",
        label,
        iconName: icon === "edit" || icon === "export" ? icon : "close",
        tone,
        stopPropagation: true,
        onClick
      });
    }

    function toggleChatTitleEdit(chatId) {
      if (editingChatId === chatId) {
        commitChatTitleEdit(chatId);
        return;
      }

      editingChatId = chatId;
      const chat = findChatById(chatId);
      if (chat) {
        chatTitleDrafts.set(chatId, chat.title);
      }
      renderAppSections({
        chatList: true,
        activeChat: true,
        composerControls: true
      });
    }

    function commitChatTitleEdit(chatId) {
      const chat = findChatById(chatId);
      if (!chat) {
        cancelChatTitleEdit(chatId);
        return;
      }

      const nextTitle = (chatTitleDrafts.get(chatId) ?? "").trim();
      if (nextTitle) {
        chat.title = nextTitle;
        chat.titleManuallyEdited = true;
        chat.updatedAt = new Date().toISOString();
        setTabsStatus(t("tabRenamed"), "success");
      }

      editingChatId = "";
      chatTitleDrafts.delete(chatId);
      renderAppSections({
        chatList: true,
        activeChat: true,
        composerControls: true
      });
    }

    function cancelChatTitleEdit(chatId) {
      if (editingChatId === chatId) {
        editingChatId = "";
      }
      chatTitleDrafts.delete(chatId);
      renderAppSections({
        chatList: true,
        activeChat: true,
        composerControls: true
      });
    }

    function renderActiveChat() {
      const activeChat = getActiveChat();
      clearMessageArticleElementCache();
      if (!activeChat) {
        elements.chatTitle.textContent = t("defaultMissingChat");
        elements.chatTitle.title = elements.chatTitle.textContent;
        elements.chatSubtitle.textContent = t("defaultMissingChatHint");
        elements.chatSubtitle.title = elements.chatSubtitle.textContent;
        elements.messageStream.innerHTML = "";
        elements.systemPromptInput.value = state.settings.systemPrompt || "";
        renderedMessageChatId = "";
        renderedMessageCount = INITIAL_MESSAGE_RENDER_LIMIT;
        return;
      }

      if (renderedMessageChatId !== activeChat.id) {
        renderedMessageChatId = activeChat.id;
        renderedMessageCount = INITIAL_MESSAGE_RENDER_LIMIT;
      }

      elements.chatTitle.textContent = activeChat.title;
      elements.chatTitle.title = activeChat.title;
      if (isRpModeActive()) {
        const characterName = getActiveRpCharacter()?.name || t("characterUnselected");
        const personaName = getActiveRpPersona()?.name || t("personaUnselected");
        const modelName = state.settings.selectedModel ? t("modelTag", { model: state.settings.selectedModel }) : t("modelMissing");
        elements.chatSubtitle.textContent = t("rpSubtitle", { character: characterName, persona: personaName, model: modelName });
      } else {
        elements.chatSubtitle.textContent = state.settings.selectedModel
          ? t("selectedModelPrefix", { model: state.settings.selectedModel })
          : t("chooseOrRefreshModel");
      }
      elements.chatSubtitle.title = elements.chatSubtitle.textContent;
      if (modelSettingsDraft?.chatId === activeChat.id) {
        elements.systemPromptInput.value = modelSettingsDraft.systemPrompt || "";
      } else {
        elements.systemPromptInput.value = state.settings.systemPrompt || "";
      }

      elements.messageStream.innerHTML = "";

      if (activeChat.messagesLoaded === false) {
        elements.messageStream.appendChild(createEmptyState(t("olderMessagesLoading")));
        return;
      }

      if (!activeChat.messages.length) {
        elements.messageStream.appendChild(createEmptyState(t("emptyState")));
      } else {
        const visibleMessages = getRenderedMessagesForActiveChat(activeChat);
        if (visibleMessages.length < activeChat.messages.length) {
          elements.messageStream.appendChild(buildOlderMessagesSentinel());
        }
        visibleMessages.forEach((message) => {
          const article = buildMessageArticle(activeChat, message);
          elements.messageStream.appendChild(article);
          cacheMessageArticleElements(article);
        });
      }

      if (!isLoadingOlderMessages) {
        requestAnimationFrame(() => {
          scrollPageToMessageEnd();
        });
      }
    }

    function getRenderedMessagesForActiveChat(chat) {
      if (chat?.messagesLoaded === false) {
        return [];
      }

      const messages = Array.isArray(chat?.messages) ? chat.messages : [];
      const count = Math.min(messages.length, Math.max(INITIAL_MESSAGE_RENDER_LIMIT, renderedMessageCount));
      renderedMessageCount = count;
      return messages.slice(-count);
    }

    function buildOlderMessagesSentinel() {
      return createElementWithClass("div", "older-messages-sentinel", t("olderMessagesLoading"));
    }

    function maybeLoadOlderMessagesOnScroll() {
      if (isLoadingOlderMessages || isSending) {
        return;
      }

      const activeChat = getActiveChat();
      if (activeChat?.messagesLoaded === false) {
        return;
      }
      const messages = Array.isArray(activeChat?.messages) ? activeChat.messages : [];
      if (!messages.length || renderedMessageCount >= messages.length) {
        return;
      }

      const scrollRoot = getScrollRoot();
      if (scrollRoot.scrollTop > OLDER_MESSAGE_LOAD_THRESHOLD_PX) {
        return;
      }

      isLoadingOlderMessages = true;
      const previousScrollHeight = scrollRoot.scrollHeight;
      renderedMessageCount = Math.min(messages.length, renderedMessageCount + MESSAGE_RENDER_BATCH_SIZE);
      renderActiveChat();
      requestAnimationFrame(() => {
        const nextScrollHeight = scrollRoot.scrollHeight;
        scrollRoot.scrollTop += Math.max(0, nextScrollHeight - previousScrollHeight);
        isLoadingOlderMessages = false;
      });
    }

    function renderModelSelect() {
      const currentModel = (modelSettingsDraft?.selectedModel ?? state.settings.selectedModel) || "";
      const currentAuxiliaryModel = (modelSettingsDraft?.auxiliaryModel ?? state.settings.auxiliaryModel) || "";
      const models = state.models;

      renderModelOptions(elements.modelSelect, {
        models,
        currentValue: currentModel,
        placeholderText: models.length ? t("selectModelPlaceholder") : t("loadModelsFirstPlaceholder")
      });

      renderModelOptions(elements.auxiliaryModelSelect, {
        models,
        currentValue: currentAuxiliaryModel,
        placeholderText: t("noAuxiliaryModel"),
        allowEmptyWhenModelsExist: true
      });
    }

    function renderModelOptions(selectElement, options = {}) {
      const {
        models = [],
        currentValue = "",
        placeholderText = "",
        allowEmptyWhenModelsExist = false
      } = options;

      selectElement.innerHTML = "";

      appendSelectOption(selectElement, "", placeholderText);

      models.forEach((model) => {
        appendSelectOption(selectElement, model.id, model.id);
      });

      selectElement.value = currentValue && models.some((model) => model.id === currentValue)
        ? currentValue
        : "";

      if (!models.length && !allowEmptyWhenModelsExist) {
        selectElement.value = "";
      }
    }

    function renderModelsPanel() {
      if (!modelSettingsDraft) {
        resetModelSettingsDraft();
      }

      elements.modelCount.textContent = String(state.models.length);
      elements.modelsSyncedAt.textContent = state.modelsSyncedAt ? formatRelativeTimeShort(state.modelsSyncedAt) : "-";
      elements.temperatureInput.value = modelSettingsDraft.temperature ?? "";
      elements.thinkingTokenLimitInput.value = modelSettingsDraft.thinkingTokenLimit ?? "";
      elements.systemPromptInput.value = modelSettingsDraft.systemPrompt || "";
      elements.forbiddenWordsInput.value = formatForbiddenWords(modelSettingsDraft.forbiddenWords);
      syncThinkingTokenLimitControls(modelSettingsDraft);
    }

    function getPromptPresets() {
      if (!Array.isArray(state.settings.promptPresets)) {
        state.settings.promptPresets = [];
      }

      return state.settings.promptPresets;
    }

    function getSortedPromptPresets() {
      return [...getPromptPresets()].sort((left, right) => {
        const leftTime = Date.parse(left.updatedAt || "") || 0;
        const rightTime = Date.parse(right.updatedAt || "") || 0;
        return rightTime - leftTime;
      });
    }

    function renderPromptPresetList() {
      const container = elements.promptPresetList;
      if (!container) {
        return;
      }

      container.innerHTML = "";
      const presets = getSortedPromptPresets();
      if (!presets.length) {
        container.appendChild(createEmptyState(t("noPromptPresets")));
        return;
      }

      presets.forEach((preset) => {
        const item = createElementWithClass("article", "prompt-preset-item");
        const main = createElementWithClass("div", "prompt-preset-item-main");
        const name = createElementWithClass("div", "prompt-preset-item-name", preset.name);
        const preview = createElementWithClass("p", "prompt-preset-item-preview", String(preset.prompt || "").trim() || "...");

        main.append(name, preview);

        const actions = createElementWithClass("div", "prompt-preset-item-actions");

        const loadButton = createButton({
          className: "ghost-button",
          textContent: t("loadPreset"),
          onClick: () => loadPromptPreset(preset.id)
        });

        const deleteButton = createButton({
          className: "ghost-button",
          textContent: t("delete"),
          onClick: () => deletePromptPreset(preset.id)
        });

        actions.append(loadButton, deleteButton);
        item.append(main, actions);
        container.appendChild(item);
      });
    }

    function openPromptPresetOverlay() {
      if (!modelSettingsDraft) {
        resetModelSettingsDraft();
      }

      renderPromptPresetList();
      elements.promptPresetNameInput.value = "";
      openOverlay(elements.promptPresetOverlay);
      window.requestAnimationFrame(() => elements.promptPresetNameInput.focus());
    }

    function saveCurrentPromptPreset() {
      const name = elements.promptPresetNameInput.value.trim();
      if (!name) {
        setChatStatus(t("promptPresetNameRequired"), "error");
        elements.promptPresetNameInput.focus();
        return;
      }

      if (!modelSettingsDraft) {
        resetModelSettingsDraft();
      }

      const now = new Date().toISOString();
      const presets = getPromptPresets();
      const existingPreset = presets.find((preset) => preset.name.localeCompare(name, undefined, { sensitivity: "accent" }) === 0);
      if (existingPreset) {
        existingPreset.prompt = modelSettingsDraft.systemPrompt || "";
        existingPreset.updatedAt = now;
      } else {
        presets.push({
          id: createId("prompt-preset"),
          name,
          prompt: modelSettingsDraft.systemPrompt || "",
          updatedAt: now
        });
      }

      persistState();
      renderPromptPresetList();
      elements.promptPresetNameInput.select();
      setChatStatus(t("promptPresetSaved", { name }), "success");
    }

    function loadPromptPreset(presetId) {
      const preset = getPromptPresets().find((entry) => entry.id === presetId);
      if (!preset) {
        setChatStatus(t("promptPresetNotFound"), "error");
        return;
      }

      if (!modelSettingsDraft) {
        resetModelSettingsDraft();
      }

      modelSettingsDraft.systemPrompt = preset.prompt || "";
      elements.systemPromptInput.value = modelSettingsDraft.systemPrompt;
      closeOverlay(elements.promptPresetOverlay);
      elements.systemPromptInput.focus();
      setChatStatus(t("promptPresetLoaded", { name: preset.name }), "success");
    }

    function deletePromptPreset(presetId) {
      const preset = getPromptPresets().find((entry) => entry.id === presetId);
      if (!preset) {
        setChatStatus(t("promptPresetNotFound"), "error");
        return;
      }

      const shouldDelete = window.confirm(t("confirmDeletePromptPreset", { name: preset.name }));
      if (!shouldDelete) {
        return;
      }

      state.settings.promptPresets = getPromptPresets().filter((entry) => entry.id !== presetId);
      persistState();
      renderPromptPresetList();
      setChatStatus(t("promptPresetDeleted", { name: preset.name }), "success");
    }

    function getActiveChat() {
      return getCurrentChatCollection().find((chat) => chat.id === getCurrentActiveChatId()) || null;
    }

    async function selectChatById(chatId, options = {}) {
      if (!findChatById(chatId)) {
        return;
      }

      currentActiveChatLoadRequestId += 1;
      const requestId = currentActiveChatLoadRequestId;
      setCurrentActiveChatId(chatId);
      resetModelSettingsDraft();
      renderAppSections({
        persist: false,
        chatList: true,
        activeChat: true,
        modelsPanel: true,
        composerControls: true,
        header: true
      });

      await ensureCurrentActiveChatLoaded();
      if (requestId !== currentActiveChatLoadRequestId || getCurrentActiveChatId() !== chatId) {
        return;
      }

      renderAppSections({
        chatList: true,
        activeChat: true,
        modelsPanel: true,
        composerControls: true,
        header: true
      });
      if (options.closeOverlayOnSelect) {
        closeOverlay(elements.tabsOverlay);
      }
    }

    function findChatById(chatId) {
      if (!chatId) {
        return null;
      }

      const standardChat = state.chats.find((chat) => chat.id === chatId);
      if (standardChat) {
        return standardChat;
      }

      for (const chats of Object.values(state.rp.chatsByCharacterId || {})) {
        const match = Array.isArray(chats) ? chats.find((chat) => chat.id === chatId) : null;
        if (match) {
          return match;
        }
      }

      return null;
    }

    function clearMessageArticleElementCache() {
      messageArticleElementCache.clear();
    }

    function cacheMessageArticleElements(article) {
      if (!article?.dataset?.messageId) {
        return null;
      }

      const refs = {
        article,
        timeElement: article.querySelector(".message-meta-time"),
        contentElement: article.querySelector(".message-content"),
        footerElement: article.querySelector(".message-footer"),
        metaActionsElement: article.querySelector(".message-meta-actions")
      };
      messageArticleElementCache.set(article.dataset.messageId, refs);
      return refs;
    }

    function getMessageArticleElements(messageId) {
      if (!messageId) {
        return null;
      }

      const cached = messageArticleElementCache.get(messageId);
      if (cached?.article?.isConnected) {
        return cached;
      }
      if (cached) {
        messageArticleElementCache.delete(messageId);
      }

      const article = elements.messageStream?.querySelector(`[data-message-id="${messageId}"]`);
      return article ? cacheMessageArticleElements(article) : null;
    }

    function buildMessageArticle(chat, message) {
      const article = createElementWithClass("article", `message ${message.role}`);
      article.dataset.messageId = message.id;
      article.classList.toggle("editing", isEditingMessage(message.id));

      const meta = createElementWithClass("div", "message-meta");

      const metaMain = createElementWithClass("div", "message-meta-main");
