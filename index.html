<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusAbove</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='14' fill='%23a34b1f'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23fff7ee' stroke-width='6'/%3E%3Ccircle cx='46' cy='18' r='3' fill='%23fff7ee' fill-opacity='0.9'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe6;
      --bg-accent: #efe2cf;
      --panel: #fffbf5;
      --panel-solid: #fffbf5;
      --panel-strong: #fffdf9;
      --border: rgba(88, 64, 38, 0.14);
      --text: #2f2418;
      --muted: #75624b;
      --primary: #a34b1f;
      --primary-strong: #7f3615;
      --primary-soft: rgba(163, 75, 31, 0.12);
      --success: #2b7a4b;
      --danger: #b4412d;
      --shadow: 0 24px 80px rgba(77, 44, 20, 0.14);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --font-display: "Segoe UI Variable Display", "Pretendard Variable", "Noto Sans KR", sans-serif;
      --font-body: "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
      --chat-pane-measured-right-gap: 0px;
      --desktop-sidebar-left: 0px;
      --desktop-sidebar-width: 288px;
      --header-measured-height: 96px;
      --scroll-jump-stack-inner-offset: 24px;
      --scroll-jump-stack-right: calc(var(--chat-pane-measured-right-gap) + var(--scroll-jump-stack-inner-offset));
      --composer-measured-height: 132px;
      --scroll-jump-stack-gap: 16px;
      --scroll-jump-stack-height: 48px;
      --scroll-jump-stack-bottom: calc(var(--composer-measured-height) + var(--scroll-jump-stack-gap));
      --message-stream-bottom-padding: calc(var(--composer-measured-height) + var(--scroll-jump-stack-height) + var(--scroll-jump-stack-gap) + 24px);
    }

    :root[data-resolved-theme="dark"] {
      color-scheme: dark;
      --bg: #17120e;
      --bg-accent: #221a14;
      --panel: #18130f;
      --panel-solid: #18130f;
      --panel-strong: #201812;
      --border: rgba(239, 222, 205, 0.12);
      --text: #f3e8da;
      --muted: #c8b39d;
      --primary: #ca6c3c;
      --primary-strong: #eba170;
      --primary-soft: rgba(202, 108, 60, 0.18);
      --success: #74c291;
      --danger: #ef9380;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(163, 75, 31, 0.42) transparent;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background: linear-gradient(135deg, #f6f0e7 0%, #efe2cf 48%, #ebdbc6 100%);
      overflow-x: hidden;
      overflow-y: auto;
    }

    html.overlay-open,
    body.overlay-open {
      overflow: hidden;
      overscroll-behavior: none;
    }

    :root[data-resolved-theme="dark"] body {
      background: #18120f;
    }

    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    *::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(163, 75, 31, 0.46), rgba(127, 54, 21, 0.28));
      border-radius: 999px;
      border: 1px solid rgba(255, 251, 245, 0.24);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(163, 75, 31, 0.58), rgba(127, 54, 21, 0.38));
    }

    *::-webkit-scrollbar-corner {
      background: transparent;
    }

    :root[data-resolved-theme="dark"] * {
      scrollbar-color: rgba(235, 161, 112, 0.42) transparent;
    }

    :root[data-resolved-theme="dark"] *::-webkit-scrollbar-thumb {
      background: rgba(235, 161, 112, 0.4);
      border-color: rgba(31, 24, 19, 0.42);
    }

    :root[data-resolved-theme="dark"] *::-webkit-scrollbar-thumb:hover {
      background: rgba(235, 161, 112, 0.52);
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(1480px, calc(100vw - 48px));
      min-height: min(980px, calc(100vh - 32px));
      min-height: min(980px, calc(100svh - 32px));
      margin: 16px auto;
    }

    .panel {
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--panel-solid);
      box-shadow: var(--shadow);
    }

    .panel-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .overlay-panel .panel-inner {
      padding: 22px;
      gap: 18px;
    }

    .workspace-layout {
      display: block;
    }

    .desktop-tabs-sidebar {
      display: none;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: riseIn 0.5s ease;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-strong);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-mark svg {
      display: block;
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: var(--primary);
    }

    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .settings-form,
    .chat-form,
    .message-user-stack,
    .model-controls,
    .prompt-preset-form,
    .authors-note-form,
    .card-pane,
    .card-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-inline-grid,
    .model-tuning-grid,
    .illustration-control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .rp-assistance-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #settingsRpSectionGroup {
      display: contents;
    }

    .settings-divider {
      height: 1px;
      border: 0;
      margin: 4px 0;
      background: rgba(88, 64, 38, 0.12);
    }

    :root[data-resolved-theme="dark"] .settings-divider {
      background: rgba(239, 222, 205, 0.12);
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(88, 64, 38, 0.16);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.82);
      color: var(--text);
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    }

    :root[data-resolved-theme="dark"] input,
    :root[data-resolved-theme="dark"] select,
    :root[data-resolved-theme="dark"] textarea {
      border-color: rgba(239, 222, 205, 0.14);
      background: rgba(19, 15, 12, 0.92);
      color: var(--text);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(163, 75, 31, 0.6);
      box-shadow: 0 0 0 4px rgba(163, 75, 31, 0.12);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: var(--primary);
      color: #fff9f4;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, background 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    button:disabled {
      cursor: progress;
      opacity: 0.75;
    }

    .ghost-button,
    .toolbar-button {
      background: rgba(163, 75, 31, 0.1);
      color: var(--primary-strong);
    }

    .danger-button {
      background: rgba(180, 65, 45, 0.12);
      color: var(--danger);
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button-row > * {
      flex: 1 1 0;
    }

    .tab-utility-row,
    .card-editor-actions,
    .card-editor-action-row,
    .scroll-jump-stack {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-utility-row {
      flex-wrap: wrap;
    }

    .tab-utility-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 14px;
      background: rgba(163, 75, 31, 0.1);
      color: var(--primary-strong);
      flex: 0 0 auto;
    }

    .tab-utility-button.secondary {
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      border: 1px solid rgba(88, 64, 38, 0.08);
    }

    :root[data-resolved-theme="dark"] .tab-utility-button {
      background: rgba(202, 108, 60, 0.14);
      color: #f3e8da;
    }

    :root[data-resolved-theme="dark"] .tab-utility-button.secondary {
      background: rgba(24, 19, 15, 0.86);
      border-color: rgba(239, 222, 205, 0.1);
      color: var(--muted);
    }

    .tab-utility-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .chat-list,
    .message-stream,
    .overlay-content,
    .card-list,
    .card-pane,
    .card-fields {
      scrollbar-width: thin;
      scrollbar-color: rgba(163, 75, 31, 0.34) rgba(239, 226, 207, 0.42);
    }

    .chat-list::-webkit-scrollbar,
    .message-stream::-webkit-scrollbar,
    .overlay-content::-webkit-scrollbar,
    .card-list::-webkit-scrollbar,
    .card-pane::-webkit-scrollbar,
    .card-fields::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .chat-list::-webkit-scrollbar-track,
    .message-stream::-webkit-scrollbar-track,
    .overlay-content::-webkit-scrollbar-track,
    .card-list::-webkit-scrollbar-track,
    .card-pane::-webkit-scrollbar-track,
    .card-fields::-webkit-scrollbar-track {
      background: rgba(239, 226, 207, 0.32);
      border-radius: 999px;
    }

    .chat-list::-webkit-scrollbar-thumb,
    .message-stream::-webkit-scrollbar-thumb,
    .overlay-content::-webkit-scrollbar-thumb,
    .card-list::-webkit-scrollbar-thumb,
    .card-pane::-webkit-scrollbar-thumb,
    .card-fields::-webkit-scrollbar-thumb {
      background: rgba(163, 75, 31, 0.34);
      border-radius: 999px;
      border: 1px solid rgba(255, 251, 245, 0.35);
    }

    .chat-list::-webkit-scrollbar-thumb:hover,
    .message-stream::-webkit-scrollbar-thumb:hover,
    .overlay-content::-webkit-scrollbar-thumb:hover,
    .card-list::-webkit-scrollbar-thumb:hover,
    .card-pane::-webkit-scrollbar-thumb:hover,
    .card-fields::-webkit-scrollbar-thumb:hover {
      background: rgba(127, 54, 21, 0.46);
    }

    :root[data-resolved-theme="dark"] .chat-list,
    :root[data-resolved-theme="dark"] .message-stream,
    :root[data-resolved-theme="dark"] .overlay-content,
    :root[data-resolved-theme="dark"] .card-list,
    :root[data-resolved-theme="dark"] .card-pane,
    :root[data-resolved-theme="dark"] .card-fields {
      scrollbar-color: rgba(235, 161, 112, 0.4) rgba(37, 29, 23, 0.5);
    }

    :root[data-resolved-theme="dark"] .chat-list::-webkit-scrollbar-track,
    :root[data-resolved-theme="dark"] .message-stream::-webkit-scrollbar-track,
    :root[data-resolved-theme="dark"] .overlay-content::-webkit-scrollbar-track,
    :root[data-resolved-theme="dark"] .card-list::-webkit-scrollbar-track,
    :root[data-resolved-theme="dark"] .card-pane::-webkit-scrollbar-track,
    :root[data-resolved-theme="dark"] .card-fields::-webkit-scrollbar-track {
      background: rgba(37, 29, 23, 0.5);
    }

    :root[data-resolved-theme="dark"] .chat-list::-webkit-scrollbar-thumb,
    :root[data-resolved-theme="dark"] .message-stream::-webkit-scrollbar-thumb,
    :root[data-resolved-theme="dark"] .overlay-content::-webkit-scrollbar-thumb,
    :root[data-resolved-theme="dark"] .card-list::-webkit-scrollbar-thumb,
    :root[data-resolved-theme="dark"] .card-pane::-webkit-scrollbar-thumb,
    :root[data-resolved-theme="dark"] .card-fields::-webkit-scrollbar-thumb {
      background: rgba(235, 161, 112, 0.36);
      border-color: rgba(27, 21, 17, 0.5);
    }

    :root[data-resolved-theme="dark"] .chat-list::-webkit-scrollbar-thumb:hover,
    :root[data-resolved-theme="dark"] .message-stream::-webkit-scrollbar-thumb:hover,
    :root[data-resolved-theme="dark"] .overlay-content::-webkit-scrollbar-thumb:hover,
    :root[data-resolved-theme="dark"] .card-list::-webkit-scrollbar-thumb:hover,
    :root[data-resolved-theme="dark"] .card-pane::-webkit-scrollbar-thumb:hover,
    :root[data-resolved-theme="dark"] .card-fields::-webkit-scrollbar-thumb:hover {
      background: rgba(235, 161, 112, 0.48);
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    .chat-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.72);
      padding: 14px;
      color: inherit;
      min-height: 130px;
    }

    :root[data-resolved-theme="dark"] .chat-item {
      background: rgba(34, 27, 22, 0.78);
    }

    .chat-item.active {
      border-color: rgba(163, 75, 31, 0.32);
      background: rgba(255, 248, 241, 0.96);
      box-shadow: inset 0 0 0 1px rgba(163, 75, 31, 0.08);
    }

    :root[data-resolved-theme="dark"] .chat-item.active {
      background: rgba(49, 37, 29, 0.95);
      box-shadow: inset 0 0 0 1px rgba(235, 161, 112, 0.12);
    }

    .chat-item-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-self: stretch;
      min-width: 0;
      min-height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      color: inherit;
    }

    .chat-item-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 100%;
      min-width: 0;
    }

    .chat-item-main:focus-visible,
    .chat-item-icon-button:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 4px rgba(163, 75, 31, 0.14);
    }

    .chat-item-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      flex: 0 0 auto;
      margin-left: auto;
      flex-wrap: nowrap;
    }

    .chat-item-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid rgba(88, 64, 38, 0.08);
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
    }

    :root[data-resolved-theme="dark"] .chat-item-icon-button {
      border-color: rgba(239, 222, 205, 0.1);
      background: rgba(24, 19, 15, 0.86);
    }

    .chat-item-icon-button:hover:not(:disabled) {
      background: rgba(163, 75, 31, 0.1);
      color: var(--primary-strong);
      transform: translateY(-1px);
    }

    .chat-item.active .chat-item-icon-button {
      background: rgba(255, 248, 241, 0.96);
    }

    :root[data-resolved-theme="dark"] .chat-item.active .chat-item-icon-button {
      background: rgba(38, 29, 23, 0.92);
    }

    .chat-item-icon-button.danger {
      color: var(--danger);
      background: rgba(180, 65, 45, 0.08);
      border-color: rgba(180, 65, 45, 0.12);
    }

    .chat-item-icon-button.danger:hover:not(:disabled) {
      background: rgba(180, 65, 45, 0.14);
      color: #8e2e1f;
    }

    .chat-item-icon-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .chat-item-title {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .chat-item-title-input {
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
    }

    .chat-item-meta {
      margin: auto 0 0;
      padding-top: 10px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      overflow: visible;
      animation: riseIn 0.45s ease;
      min-height: min(980px, calc(100vh - 32px));
      min-height: min(980px, calc(100svh - 32px));
      min-width: 0;
    }

    :root[data-resolved-theme="dark"] .panel.main-panel {
      background: rgba(23, 18, 14, 0.94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.46);
    }

    .main-header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 12px;
      padding: 18px 24px 12px;
      border-bottom: 1px solid rgba(88, 64, 38, 0.08);
      background: var(--panel-solid);
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: min(1480px, calc(100vw - 48px));
      top: 0;
      z-index: 12;
      box-shadow: 0 16px 34px rgba(77, 44, 20, 0.08);
    }

    :root[data-resolved-theme="dark"] .main-header {
      border-bottom-color: rgba(239, 222, 205, 0.08);
      background: var(--panel-solid);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);
    }

    .main-title {
      min-width: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      flex: 0 0 auto;
    }

    .header-actions button {
      font-size: 13px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .header-mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(88, 64, 38, 0.12);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.64);
    }

    :root[data-resolved-theme="dark"] .header-mode-toggle {
      border-color: rgba(239, 222, 205, 0.12);
      background: rgba(33, 26, 21, 0.92);
      box-shadow: inset 0 1px 0 rgba(255, 245, 234, 0.03);
    }

    .mode-toggle-button {
      min-width: 44px;
      padding: 8px 8px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      box-shadow: none;
    }

    .mode-toggle-button.active {
      background: linear-gradient(180deg, rgba(163, 75, 31, 0.18), rgba(163, 75, 31, 0.12));
      color: var(--primary-strong);
    }

    :root[data-resolved-theme="dark"] .mode-toggle-button.active {
      background: rgba(202, 108, 60, 0.18);
      color: #ffd8be;
    }

    .header-rp-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .main-title h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: -0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .message-stream {
      flex: 0 0 auto;
      min-height: 0;
      overflow: visible;
      padding: 156px 24px var(--message-stream-bottom-padding);
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    :root[data-resolved-theme="dark"] .message-stream {
      background: rgba(31, 24, 20, 0.18);
    }

    .empty-state {
      margin: auto;
      max-width: 520px;
      padding: 28px;
      border-radius: var(--radius-xl);

    .message.user {

    :root[data-resolved-theme="dark"] .message.user {

      background: rgba(52, 42, 36, 0.96);
    }

    .message.system {

      background: rgba(117, 98, 75, 0.12);
      color: var(--muted);

      gap: 12px;
      min-width: 0;
    }

    .message.user .message-shell {

    }

    .message-body {

      min-width: 0;
    }

    .message-avatar {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(88, 64, 38, 0.12);
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 10px 24px rgba(77, 44, 20, 0.12);
    }

    :root[data-resolved-theme="dark"] .message-avatar {
      border-color: rgba(239, 222, 205, 0.12);
      background: rgba(29, 23, 18, 0.9);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
    }

    .message-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    :root[data-resolved-theme="dark"] .message.system {
      background: rgba(200, 179, 157, 0.08);
    }

    .message-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      opacity: 0.85;
    }

    .message-meta-main,
    .message-meta-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .message-meta-main {
      flex: 1 1 auto;
      min-width: 0;
    }

    .message-meta-label,
    .message-meta-time {
      white-space: nowrap;
    }

    .message-meta-time {
      color: inherit;
      opacity: 0.78;
    }

    .message-action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 999px;
      background: rgba(88, 64, 38, 0.1);
      color: inherit;
    }

    :root[data-resolved-theme="dark"] .message-action-button {
      background: rgba(239, 222, 205, 0.1);
    }

    .message-action-button:hover:not(:disabled) {
      transform: none;
      filter: brightness(1.02);
    }

    .message.user .message-action-button {
      background: rgba(255, 255, 255, 0.14);
      color: #fff8f2;
    }

    .message-action-button.active {
      background: rgba(163, 75, 31, 0.18);
      color: var(--primary-strong);
    }

    .message.user .message-action-button.active {
      background: rgba(255, 255, 255, 0.22);
      color: #fff8f2;
    }

    .message-action-button.danger {
      color: var(--danger);
      background: rgba(180, 65, 45, 0.12);
    }

    .message.user .message-action-button.danger {
      color: #fff8f2;
      background: rgba(255, 255, 255, 0.18);
    }

    .message-action-button svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .message-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .message-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 20px;
    }

    .message-token-usage {
      flex: 0 1 auto;
      min-width: 0;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .message-state-spinner,
    .message-state-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .message-state-spinner {
      border: 2px solid rgba(163, 75, 31, 0.18);
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    .message-state-dot {
      background: rgba(43, 122, 75, 0.72);
      box-shadow: 0 0 0 4px rgba(43, 122, 75, 0.12);
    }

    .message-state-dot.processing {
      background: rgba(196, 138, 33, 0.82);
      box-shadow: 0 0 0 4px rgba(196, 138, 33, 0.16);
    }

    .message-state-dot.error {
      background: rgba(180, 65, 45, 0.78);
      box-shadow: 0 0 0 4px rgba(180, 65, 45, 0.14);
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .message-content {
      word-break: break-word;
      line-height: 1.68;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .message-streaming-text,
    .message.user .message-content,
    .message.system .message-content,
    .message-user-text {
      white-space: pre-wrap;
    }

    .message-content-editor {
      width: 100%;
      min-height: 164px;
      padding: 14px 15px;
      border-radius: 14px;
      border: 1px solid rgba(88, 64, 38, 0.18);
      background: rgba(255, 255, 255, 0.78);
      color: inherit;
      line-height: 1.68;
      resize: vertical;
    }

    :root[data-resolved-theme="dark"] .message-content-editor {
      border-color: rgba(239, 222, 205, 0.14);
      background: rgba(18, 15, 12, 0.86);
    }

    .message.user .message-content-editor {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.16);
      color: #fff8f2;
    }

    .message-content-editor:focus {
      box-shadow: 0 0 0 4px rgba(163, 75, 31, 0.14);
    }

    .message.user .message-content-editor:focus {
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.18);
    }

    .message-content > :first-child {
      margin-top: 0;
    }

    .message-content > :last-child {
      margin-bottom: 0;
    }

    .message-content p,
    .message-content ul,
    .message-content ol,
    .message-content pre,
    .message-content blockquote,
    .message-content table {
      margin: 0.75em 0;
    }

    .message-content ul,
    .message-content ol {
      padding-left: 1.35em;
    }

    .message-content li + li {
      margin-top: 0.25em;
    }

    .message-content blockquote {
      margin-left: 0;
      padding: 0.1em 0 0.1em 1em;
      border-left: 3px solid rgba(163, 75, 31, 0.28);
      color: var(--muted);
    }

    .message-content code {
      padding: 0.12em 0.38em;
      border-radius: 7px;
      background: rgba(88, 64, 38, 0.1);
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 0.92em;
    }

    :root[data-resolved-theme="dark"] .message-content code {
      background: rgba(239, 222, 205, 0.1);
    }

    .message-content pre {
      overflow: auto;
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(47, 36, 24, 0.92);
      color: #f4ede5;
    }

    :root[data-resolved-theme="dark"] .message-content pre {
      background: rgba(8, 7, 6, 0.94);
    }

    .message-content pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .message-content a {
      color: var(--primary-strong);
    }

    .message-content .katex {
      max-width: 100%;
      font-size: 1.02em;
    }

    .message-content .katex-display {
      margin: 1em 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
    }

    .older-messages-sentinel {
      display: grid;
      place-items: center;
      width: min(100%, 520px);
      min-height: 44px;
      margin: 0 auto 12px;
      border-radius: 999px;
      border: 1px solid rgba(88, 64, 38, 0.1);
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    :root[data-resolved-theme="dark"] .older-messages-sentinel {
      border-color: rgba(239, 222, 205, 0.08);
      background: rgba(31, 24, 19, 0.82);
    }
    .message-content .katex-display > .katex {
      display: inline-block;
      min-width: max-content;
    }

    .message-content table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(88, 64, 38, 0.12);
      background: rgba(255, 255, 255, 0.72);
    }

    :root[data-resolved-theme="dark"] .message-content table {
      border-color: rgba(239, 222, 205, 0.1);
      background: rgba(27, 22, 18, 0.84);
    }

    .message-content th,
    .message-content td {
      padding: 10px 12px;
      border: 1px solid rgba(88, 64, 38, 0.1);
      text-align: left;
      vertical-align: top;
    }

    :root[data-resolved-theme="dark"] .message-content th,
    :root[data-resolved-theme="dark"] .message-content td {
      border-color: rgba(239, 222, 205, 0.08);
    }

    .message-content th {
      background: rgba(163, 75, 31, 0.08);
      font-weight: 800;
    }

    :root[data-resolved-theme="dark"] .message-content th {
      background: rgba(202, 108, 60, 0.16);
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 108px;
      align-items: stretch;
      gap: 12px;
      padding: 12px 24px 20px;
      border-top: 1px solid rgba(88, 64, 38, 0.08);
      background: var(--panel-solid);
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: min(1480px, calc(100vw - 48px));
      bottom: 0;
      z-index: 12;
      box-shadow: 0 18px 40px rgba(77, 44, 20, 0.12);
    }

    :root[data-resolved-theme="dark"] .composer {
      border-top-color: rgba(239, 222, 205, 0.08);
      background: var(--panel-solid);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }

    .composer > label {
      min-width: 0;
    }

    .composer-input-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
      height: 100%;
    }

    .composer-input-stack > label {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
    }

    .composer textarea {
      min-height: 84px;
      flex: 1 1 auto;
    }

    :root[data-resolved-theme="dark"] .composer textarea {
      border-color: rgba(255, 214, 187, 0.14);
      background: rgba(30, 24, 20, 0.98);
      box-shadow: inset 0 1px 0 rgba(255, 245, 234, 0.04);
    }

    :root[data-resolved-theme="dark"] .composer textarea:focus {
      border-color: rgba(235, 161, 112, 0.5);
      box-shadow: 0 0 0 4px rgba(202, 108, 60, 0.16), inset 0 1px 0 rgba(255, 245, 234, 0.05);
    }

    .composer-upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 40px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid rgba(163, 75, 31, 0.18);
      background: rgba(163, 75, 31, 0.1);
      color: var(--primary-strong);
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, background 120ms ease;
    }

    :root[data-resolved-theme="dark"] .ghost-button,
    :root[data-resolved-theme="dark"] .toolbar-button,
    :root[data-resolved-theme="dark"] .composer-upload-button {
      background: rgba(202, 108, 60, 0.14);
    }

    .composer-upload-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .composer-upload-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .composer-attachment-hint {
      font-size: 12px;
      color: var(--muted);
    }

    .composer-attachments {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .composer-attachment-chip {
      position: relative;
      flex: 0 0 auto;
      width: 88px;
      padding: 6px;
      border: 1px solid rgba(88, 64, 38, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 10px 24px rgba(77, 44, 20, 0.08);

    :root[data-resolved-theme="dark"] .composer-attachment-chip {
      border-color: rgba(239, 222, 205, 0.1);
      background: rgba(25, 20, 16, 0.82);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);

    .composer-attachment-chip img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      background: rgba(239, 226, 207, 0.7);
    }

    .composer-attachment-name {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .composer-attachment-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 999px;
      background: rgba(39, 24, 12, 0.72);
      color: #fff7ee;

    .composer-attachment-remove:hover:not(:disabled) {
      transform: none;
      filter: brightness(1.08);
    }

    .composer-attachment-remove svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .message-image-grid {
      display: grid;

      gap: 10px;
    }

    .message-image-card {

      flex-direction: column;
      gap: 6px;
      min-width: 0;
      margin: 0;
    }

    .message-image-button {

      padding: 0;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: inherit;
      overflow: hidden;
    }

    .message-image-button:hover:not(:disabled) {
      transform: none;
      filter: none;
    }

    .message-image-button:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.22);
    }

    .message.assistant .message-image-button:focus-visible,
    .message.system .message-image-button:focus-visible {
      box-shadow: 0 0 0 4px rgba(163, 75, 31, 0.18);
    }

    .message-image-card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 260px;
      object-fit: contain;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(88, 64, 38, 0.1);
    }

    .message-image-placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 220px;
      border-radius: 14px;
      border: 1px solid rgba(88, 64, 38, 0.1);
      background: rgba(255, 255, 255, 0.16);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    :root[data-resolved-theme="dark"] .message-image-card img,
    :root[data-resolved-theme="dark"] .message-image-placeholder {
      background: rgba(18, 15, 12, 0.8);
      border-color: rgba(239, 222, 205, 0.08);
    }

    .message-illustration {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .message-illustration-header {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .message-illustration-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    .message-illustration-action {
      width: 26px;
      height: 26px;
      color: var(--muted);
    }

    .message-illustration-placeholder {
      display: grid;
      place-items: center;
      width: min(100%, 512px);
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      border: 1px solid rgba(88, 64, 38, 0.12);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.15), rgba(163, 75, 31, 0.16), rgba(255, 255, 255, 0.15));
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    :root[data-resolved-theme="dark"] .message-illustration-placeholder {
      border-color: rgba(239, 222, 205, 0.1);
      background:
        linear-gradient(90deg, rgba(239, 222, 205, 0.04), rgba(163, 75, 31, 0.18), rgba(239, 222, 205, 0.04));
    }

    .message-illustration-error {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(211, 75, 42, 0.08);
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;

    .message-rp-state {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(88, 64, 38, 0.1);

    :root[data-resolved-theme="dark"] .message-rp-state {
      border-top-color: rgba(239, 222, 205, 0.1);
    }

    .message-rp-state-toggle {
      align-self: flex-start;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--primary-strong);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
      box-shadow: none;
    }

    .message-rp-state-toggle:hover:not(:disabled) {
      transform: none;
      box-shadow: none;
    }

    .message-rp-state-content {
      margin: 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(88, 64, 38, 0.06);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    :root[data-resolved-theme="dark"] .message-rp-state-content {
      background: rgba(239, 222, 205, 0.06);
    }

    .message-image-card figcaption {
      font-size: 12px;
      color: inherit;
      opacity: 0.82;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .message-image-only-label {
      font-size: 13px;
      opacity: 0.78;
    }

    .media-overlay {
      padding: 28px;
      background: #140c06;
    }

    }

    .media-overlay-panel {

      flex-direction: column;
      overflow: hidden;
    }

    .image-preview-panel {
      width: min(1280px, calc(100vw - 40px));
      height: min(calc(100vh - 56px), 1120px);

      max-height: min(96vh, 1120px);

      border: 1px solid rgba(88, 64, 38, 0.08);

      :root {
        --scroll-jump-stack-inner-offset: 18px;
        --scroll-jump-stack-gap: 12px;
      }

      .card-layout {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 12px;
        overflow: hidden;
      }

      .card-side {
        min-height: 0;
        max-width: 92px;
      }

      .card-tools {
        flex-direction: column;
        flex-wrap: nowrap;
      }

      .card-fields {
        padding-right: 0;
      }

      .card-editor-actions {
        flex-wrap: wrap;
      }

      .app-shell {
        width: 100vw;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
      }

      .main-header,
      .composer,
      .overlay-panel .panel-inner {
        padding-left: 18px;
        padding-right: 18px;
      }

      .panel.main-panel {
        min-height: 100vh;
        min-height: 100svh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-top: 0;
      }

      .main-header {
        left: 0;
        transform: none;
        width: 100vw;
        top: 0;
        padding-top: 16px;
        padding-bottom: 10px;
      }

      .main-title h2 {
        font-size: 20px;
      }

      .main-title p {
        font-size: 12px;
      }

      .header-actions {
        gap: 6px;
      }

      .header-actions button {
        padding: 8px 10px;
        font-size: 12px;
      }

      .header-rp-actions {
        gap: 6px;
      }

      .header-mode-toggle {
        gap: 1px;
        padding: 2px;
      }

      .header-actions .mode-toggle-button {
        min-width: 34px;
        padding: 7px 6px;
        font-size: 12px;
      }

      .composer {
        left: 0;
        transform: none;
        width: 100vw;
        grid-template-columns: minmax(0, 1fr) 92px;
        gap: 10px;
        bottom: 0;
      }

      .message-stream {
        padding: 150px 18px var(--message-stream-bottom-padding);
      }

      .overlay-shell {
        padding: 0;
        align-items: stretch;
        justify-content: stretch;
      }

      .overlay-panel {
        width: 100vw;
        max-height: none;
        height: 100vh;
        height: 100svh;
        border-radius: 0;
        border: 0;
      }

      .media-overlay {
        padding: 0;
      }

      .media-overlay-panel {
        width: 100vw;
        max-height: none;
        height: 100vh;
        height: 100svh;
        border-radius: 0;
        border: 0;
      }

      .media-overlay-panel .panel-inner {
        gap: 12px;
        padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
      }

      .image-crop-body {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .image-crop-viewport {
        width: min(100%, 360px);
      }

      .image-crop-actions {
        margin-top: 0;
      }

      .image-preview-body img {
        max-height: 100%;
      }

      .overlay-content {
        padding-bottom: 18px;
      }

      .desktop-tabs-sidebar {
        display: none;
      }

    }

    @media (max-width: 860px) and (orientation: landscape) {
      :root {
        --scroll-jump-stack-gap: 10px;
        --scroll-jump-stack-height: 42px;
      }

      .main-header {
        padding-top: 12px;
        padding-bottom: 8px;
        gap: 10px;
      }

      .message-stream {
        padding: 130px 18px var(--message-stream-bottom-padding);
      }

      .empty-state {
        margin: 0 auto;
        max-width: 100%;
        padding: 20px;
      }

      .composer {
        gap: 8px;
        padding-top: 10px;
        padding-bottom: 12px;
      }

      .scroll-jump-button {
        width: 42px;
        height: 42px;
      }

      .composer textarea {
        min-height: 76px;
      }

      .composer {
        grid-template-columns: minmax(0, 1fr) 84px;
      }

      .composer-actions button {
        min-height: 34px;
        padding: 8px 10px;
        font-size: 12px;
      }

      .composer-actions button.composer-upload-button {
        min-height: 34px;
        padding: 5px 10px;
        line-height: 0;
      }
    }

    @media (max-width: 860px) {
      .panel,
      .main-header,
      .composer,
      .scroll-jump-button,
      .status-toast {
        box-shadow: none;
      }

      :root[data-resolved-theme="dark"] .scroll-clear-button {
        background: #2a1917;
      }

      :root[data-resolved-theme="dark"] .status-toast.success {
        background: #18261c;
      }

      :root[data-resolved-theme="dark"] .status-toast.error {
        background: #2a1917;
      }

    }

  <script>
    const APP_STORAGE_KEY = "focusabove.app-state.v1";
    const APP_STATE_SYNC_KEY = "focusabove.app-state-sync.v1";
    const APP_DB_NAME = "focusabove.storage.v1";
    const APP_DB_VERSION = 1;
    const APP_DB_STORE = "focusabove";
    const APP_DB_RECORD_KEY = "app-state";
    const APP_CHAT_RECORD_PREFIX = "chat:";
    const APP_MEDIA_RECORD_PREFIX = "media:";
    const APP_SECRET_RECORD_KEY = "app-secrets";
    const APP_SECRET_KEY_RECORD_PREFIX = "app-secret-key-";
    const APP_SECRET_KEY_RING_SIZE = 13;
    const APP_SECRET_PROBE_TEXT = "focusabove-secret-probe-v1";
    const APP_SPLIT_CHAT_STORAGE_VERSION = 2;
    const RP_CARD_DRAG_THRESHOLD_PX = 6;
    const RP_CARD_TOUCH_DRAG_THRESHOLD_PX = 10;
    const RP_CARD_TOUCH_HOLD_MS = 150;
    function iconSvg(iconName, viewBox = "0 0 24 24") {
      return `<svg viewBox="${viewBox}" aria-hidden="true"><use href="#icon-${iconName}"></use></svg>`;
    }

    function createButton(options = {}) {
      const {
        className = "",
        label = "",
        title = "",
        textContent = null,
        html = "",
        attributes = null,
        disabled = false,
        stopPropagation = false,
        onClick = null
      } = options;
      const button = document.createElement("button");
      button.type = "button";
      if (className) {
        button.className = className;
      }
      if (label) {
        button.setAttribute("aria-label", label);
      }
      if (title) {
        button.title = title;
      }
      if (textContent !== null) {
        button.textContent = String(textContent);
      }
      if (html) {
        button.innerHTML = html;
      }
      if (attributes && typeof attributes === "object") {
        Object.entries(attributes).forEach(([name, value]) => {
          button.setAttribute(name, String(value));
        });
      }
      button.disabled = Boolean(disabled);
      if (typeof onClick === "function") {
        button.addEventListener("click", (event) => {
          if (stopPropagation) {
            event.stopPropagation();
          }
          onClick(event);
        });
      }
      return button;
    }

    function createElementWithClass(tagName, className, textContent = null) {
      const element = document.createElement(tagName);
      if (className) {
        element.className = className;
      }
      if (textContent !== null) {
        element.textContent = String(textContent);
      }
      return element;
    }

    function createEmptyState(text) {
      return createElementWithClass("div", "empty-state", text);
    }

    function getRpCardControlButtonId(kind, action) {
      const suffixByAction = {
        new: "New",
        import: "Import",
        save: "Save",
        export: "Export",
        delete: "Delete",
        image: "Image",
        imageClear: "ImageClear"
      };
      return `${kind}${suffixByAction[action]}Button`;
    }

    function appendSelectOption(selectElement, value, textContent) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = textContent;
      selectElement.appendChild(option);
      return option;
    }

    function createRpCardThumb(card, kind) {
      const thumb = document.createElement("div");
      thumb.className = "card-thumb";
      if (card.profileImage?.dataUrl || card.profileImage?.mediaId) {
        const image = document.createElement("img");
        image.alt = card.name;
        image.draggable = false;
        queueImageElementSource(image, card.profileImage);
        thumb.appendChild(image);
      } else {
        thumb.textContent = getCardInitial(card.name, kind === "character" ? "C" : "P");
      }
      return thumb;
    }

    function createIconButton(options = {}) {
      const {
        className = "",
        label = "",
        title = label,
        iconName = "",
        tone = "default",
        active = false,
        disabled = false,
        stopPropagation = false,
        onClick = null,
        attributes = null
      } = options;
      return createButton({
        className: [className, tone === "default" ? "" : tone, active ? "active" : ""].filter(Boolean).join(" "),
        label,
        title,
        html: iconName ? iconSvg(iconName) : "",
        attributes,
        disabled,
        stopPropagation,
        onClick
      });
    }

    function appendGeneratedButton(container, options, defaults = {}) {
      if (!container) {
        return;
      }

      const mergedOptions = {
        ...defaults,
        ...options,
        className: [defaults.className || "", options.className || ""].filter(Boolean).join(" "),
        attributes: {
          ...(defaults.attributes || {}),
          ...(options.attributes || {})
        }
      };

      container.appendChild((mergedOptions.variant === "icon" ? createIconButton : createButton)(mergedOptions));
    }

    function populateGeneratedButtons(container, specs, defaults = {}) {
      if (!container || container.childElementCount) {
        return;
      }

      specs.forEach((spec) => appendGeneratedButton(container, spec, defaults));
    }

    function populateOverlayHeaderMarkup() {
      document.querySelectorAll(".overlay-header[data-overlay-title-id][data-overlay-close-id]").forEach((header) => {
        if (header.childElementCount) {
          return;
        }

        const title = document.createElement("h2");
        title.id = header.dataset.overlayTitleId || "";
        title.className = "section-title";

        const closeButton = createButton({
          className: "overlay-close",
          attributes: {
            id: header.dataset.overlayCloseId || ""
          }
        });

        header.append(title, closeButton);
      });
    }

    function populateRpCardControlMarkup(kind) {
      const toolbar = document.querySelector(`[data-rp-card-toolbar="${kind}"]`);
      const actionRow = document.querySelector(`[data-rp-card-action-row="${kind}"]`);

        ["new", ""],
        ["import", "ghost-button"]
      ].map(([action, className]) => ({
        className,
        attributes: { id: getRpCardControlButtonId(kind, action) }
      })));

      populateGeneratedButtons(actionRow,
        [
          ["save", "save", "default"],
          ["export", "export", "default"],
          ["trash", "delete", "danger"]
        ].map(([iconName, action, tone]) => ({
          iconName,
          tone,
          attributes: {

          }
        })),
        {
          variant: "icon",
          className: "chat-item-icon-button card-action-icon-button"
        }
      );

        className: "ghost-button",
        attributes: { id: getRpCardControlButtonId(kind, action) }
      })));

      }

        return '<label><input id="personaCardNameInput" type="text"></label><label><textarea id="personaCardDescriptionInput"></textarea></label>';
    }

    function populateRpCardEditorMarkup(kind) {
      const editor = document.querySelector(`[data-rp-card-editor="${kind}"]`);
      if (!editor || editor.childElementCount) {
        return;
      }

      editor.innerHTML = `<section class="card-pane"><div class="card-fields">${getRpCardEditorFieldsMarkup(kind)}</div><div class="card-editor-toolbar"><div class="card-editor-actions card-editor-action-row" data-rp-card-action-row="${kind}"></div><div class="card-media-actions" data-rp-card-media-actions="${kind}"></div></div></section>`;
    }

        ["desktop", "desktopNewChatButton", "desktopImportChatsButton"],
        ["overlay", "newChatButton", "importChatsButton"]
      ].forEach(([row, newId, importId]) => {
        populateGeneratedButtons(
          document.querySelector(`[data-tab-utility-row="${row}"]`),

            { iconName: "import", tone: "secondary", label: "JSON 임포트", attributes: { id: importId } }
          ],
          {
            variant: "icon",
            className: "tab-utility-button"
          }
        );
      });
    }

    function handleDesktopSidebarInnerWheel(event) {
      if (event.ctrlKey || window.innerWidth <= 860) {
        return;
      }

      const sidebar = elements.desktopTabsSidebar;
      const sidebarInner = sidebar?.querySelector?.(".desktop-tabs-sidebar-inner");
      const eventTarget = event.target;
      if (!(eventTarget instanceof Node) || !sidebar || !sidebarInner || !sidebar.contains(eventTarget)) {
        return;
      }

      const deltaY = normalizeWheelDelta(event.deltaY, event.deltaMode);
      const deltaX = normalizeWheelDelta(event.deltaX, event.deltaMode);
      if (!deltaX && !deltaY) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();
      sidebarInner.scrollTop += deltaY;
      sidebarInner.scrollLeft += deltaX;
    }

    function normalizeWheelDelta(delta, deltaMode) {
      if (!delta) {
        return 0;
      }

      if (deltaMode === WheelEvent.DOM_DELTA_LINE) {
        return delta * 16;
      }

      if (deltaMode === WheelEvent.DOM_DELTA_PAGE) {
        return delta * window.innerHeight;
      }

      return delta;
    }

    async function loadState() {
      const legacyState = readLegacyLocalStorageState();

      if (!supportsIndexedDb()) {
        return legacyState || structuredClone(DEFAULT_APP_STATE);
      }

      try {
        const storedState = await readStateFromIndexedDb();
        if (storedState) {
          const normalizedState = normalizeStoredAppState(storedState);
          const secretHydration = await hydrateSettingsSecrets(normalizedState);
          const mediaMigrated = await migrateStateMediaToIndexedDb(normalizedState);
          if (secretHydration.hadPlaintextSecrets || mediaMigrated || !isSplitChatStorageState(storedState)) {
            await writeStoredState(cloneStateForPersistence(normalizedState));
          }
          localStorage.removeItem(APP_STORAGE_KEY);
          return normalizedState;
        }

        if (legacyState) {
          await hydrateSettingsSecrets(legacyState);
          await migrateStateMediaToIndexedDb(legacyState);
          await writeStoredState(cloneStateForPersistence(legacyState));
          localStorage.removeItem(APP_STORAGE_KEY);
          return legacyState;
        }
      } catch (error) {
        console.error("Failed to load state from IndexedDB", error);
        if (legacyState) {
          return legacyState;
        }
      }

      const defaultState = structuredClone(DEFAULT_APP_STATE);
      await hydrateSettingsSecrets(defaultState);
      return defaultState;
    }

    function readLegacyLocalStorageState() {
      try {
        const raw = localStorage.getItem(APP_STORAGE_KEY);
        if (!raw) {
          return null;
        }

        return normalizeStoredAppState(JSON.parse(raw));
      } catch (error) {
        console.error("Failed to load legacy state", error);
        return null;
      }
    }

    function normalizeStoredAppState(parsed) {
      const legacyChat = Array.isArray(parsed?.chats)
          ? parsed.chats.find((chat) => chat?.id === parsed?.activeChatId) || parsed.chats[0] || null
          : null;
      const settingsTemperature = normalizeOptionalNumber(parsed?.settings?.temperature, { min: 0, max: 2 });
      const legacyTemperature = normalizeOptionalNumber(legacyChat?.temperature, { min: 0, max: 2 });
      const settingsThinkingLimit = normalizeOptionalInteger(parsed?.settings?.thinkingTokenLimit, { min: 0 });
      const legacyThinkingLimit = normalizeOptionalInteger(legacyChat?.thinkingTokenLimit, { min: 0 });
      const thinkingUnlimited = typeof parsed?.settings?.thinkingUnlimited === "boolean"
        ? parsed.settings.thinkingUnlimited
        : typeof legacyChat?.thinkingUnlimited === "boolean"
          ? legacyChat.thinkingUnlimited
          : DEFAULT_SETTINGS.thinkingUnlimited;
      const smoothStreaming = typeof parsed?.settings?.smoothStreaming === "boolean"
        ? parsed.settings.smoothStreaming
        : DEFAULT_SETTINGS.smoothStreaming;
      const language = normalizeAppLanguage(parsed?.settings?.language);
      const chats = Array.isArray(parsed?.chats) ? parsed.chats.map(normalizeChat).filter(Boolean) : [];
      const rp = normalizeRpState(parsed?.rp);
      const activeMode = normalizeAppMode(parsed?.activeMode);
      migrateLegacyAuthorsNoteToActiveChat(parsed, chats, rp, activeMode);
      const settings = {
        apiBaseUrl: parsed?.settings?.apiBaseUrl || DEFAULT_SETTINGS.apiBaseUrl,
        apiKey: parsed?.settings?.apiKey || DEFAULT_SETTINGS.apiKey,
        imageApiBaseUrl: parsed?.settings?.imageApiBaseUrl || DEFAULT_SETTINGS.imageApiBaseUrl,
        imageApiKey: typeof parsed?.settings?.imageApiKey === "string" ? parsed.settings.imageApiKey : DEFAULT_SETTINGS.imageApiKey,
        userAlias: parsed?.settings?.userAlias || getDefaultUserAlias(language),
        modelAlias: parsed?.settings?.modelAlias || getDefaultModelAlias(language),
        language,
        themeMode: normalizeThemeMode(parsed?.settings?.themeMode),
        smoothStreaming,
        chatT2iEnabled: typeof parsed?.settings?.chatT2iEnabled === "boolean"
          ? parsed.settings.chatT2iEnabled
          : DEFAULT_SETTINGS.chatT2iEnabled,
        selectedModel: typeof parsed?.settings?.selectedModel === "string"
          ? parsed.settings.selectedModel
          : typeof legacyChat?.model === "string"
            ? legacyChat.model
            : DEFAULT_SETTINGS.selectedModel,
        auxiliaryModel: typeof parsed?.settings?.auxiliaryModel === "string"
          ? parsed.settings.auxiliaryModel
          : DEFAULT_SETTINGS.auxiliaryModel,
        systemPrompt: deriveGlobalSystemPrompt(parsed, chats, rp, activeMode),
        forbiddenWords: normalizeForbiddenWords(parsed?.settings?.forbiddenWords),
        promptPresets: normalizePromptPresets(parsed?.settings?.promptPresets),
        temperature: settingsTemperature ?? legacyTemperature ?? DEFAULT_SETTINGS.temperature,
        thinkingTokenLimit: thinkingUnlimited
          ? null
          : settingsThinkingLimit ?? legacyThinkingLimit ?? DEFAULT_SETTINGS.thinkingTokenLimit,
        thinkingUnlimited
      };

      return {
        settings,
        models: Array.isArray(parsed?.models) ? parsed.models : [],
        modelsSyncedAt: typeof parsed?.modelsSyncedAt === "string" ? parsed.modelsSyncedAt : "",
        imageModels: normalizeImageModelList(parsed?.imageModels),
        imageModelsSyncedAt: typeof parsed?.imageModelsSyncedAt === "string" ? parsed.imageModelsSyncedAt : "",
        storageVersion: isSplitChatStorageState(parsed) ? APP_SPLIT_CHAT_STORAGE_VERSION : 1,
        activeMode,
        activeChatId: typeof parsed?.activeChatId === "string" ? parsed.activeChatId : "",
        chats,
        rp
      };
    }

    function isSplitChatStorageState(parsed) {
      return parsed?.chatStorage === "split" || Number(parsed?.storageVersion || 0) >= APP_SPLIT_CHAT_STORAGE_VERSION;
    }

    function migrateLegacyAuthorsNoteToActiveChat(parsed, chats, rp, activeMode) {
      const legacyAuthorsNote = typeof parsed?.authorsNote === "string" ? parsed.authorsNote : "";
      if (!legacyAuthorsNote.trim()) {
        return;
      }

      const targetChat = activeMode === "rp"
        ? getLegacyActiveRpChat(parsed, rp)
        : chats.find((chat) => chat.id === parsed?.activeChatId) || chats[0] || null;
      if (targetChat && !String(targetChat.authorsNote || "").trim()) {
        targetChat.authorsNote = legacyAuthorsNote;
      }
    }

    function getLegacyActiveRpChat(parsed, rp) {
      const activeCharacterId = rp?.activeCharacterId || "";
      const activeChatId = rp?.activeChatIdsByCharacterId?.[activeCharacterId] || parsed?.activeChatId || "";
      const chats = Array.isArray(rp?.chatsByCharacterId?.[activeCharacterId]) ? rp.chatsByCharacterId[activeCharacterId] : [];
      return chats.find((chat) => chat.id === activeChatId) || chats[0] || null;
    }

    function deriveGlobalSystemPrompt(parsed, chats, rpState, activeMode) {
      if (typeof parsed?.settings?.systemPrompt === "string") {
        return parsed.settings.systemPrompt;
      }

      if (activeMode === "rp") {
        const activeCharacterId = rpState?.activeCharacterId || "";
        const activeChatId = rpState?.activeChatIdsByCharacterId?.[activeCharacterId] || "";
        const activeChats = Array.isArray(rpState?.chatsByCharacterId?.[activeCharacterId])
          ? rpState.chatsByCharacterId[activeCharacterId]
          : [];
        const activeRpChat = activeChats.find((chat) => chat.id === activeChatId) || activeChats[0] || null;
        return activeRpChat?.systemPrompt || "";
      }

      const activeChat = chats.find((chat) => chat.id === parsed?.activeChatId) || chats[0] || null;
      return activeChat?.systemPrompt || "";
    }

    function normalizePromptPresets(value) {
      return Array.isArray(value)
        ? value.map(normalizePromptPreset).filter(Boolean)
        : [];
    }

    function normalizeForbiddenWords(value) {
      if (Array.isArray(value)) {
        return value
          .map((entry) => String(entry || "").trim())
          .filter(Boolean);
      }

      if (typeof value !== "string") {
        return [];
      }

      return value
        .split(",")
        .map((entry) => entry.trim())
        .filter(Boolean);
    }

    function formatForbiddenWords(value) {
      return normalizeForbiddenWords(value).join(", ");
    }

    function buildForbiddenWordsInstruction(forbiddenWords) {
      const normalizedForbiddenWords = normalizeForbiddenWords(forbiddenWords);
      if (!normalizedForbiddenWords.length) {
        return "";
      }

      return [
        `[Forbidden Words]`,
        `- Never use: ${normalizedForbiddenWords.join(", ")}`,
        `- Rephrase before answering if needed.`
      ].join("\n");
    }

    function bindClickActions(bindings) {
      bindings.forEach(([element, handler]) => {
        element.addEventListener("click", handler);
      });
    }

    function bindInputActions(bindings, eventName = "input") {
      bindings.forEach(([element, handler]) => {
        element.addEventListener(eventName, handler);
      });
    }

    function bindOverlayOpenAction(button, overlay, prepare = null) {
      button.addEventListener("click", () => {
        if (typeof prepare === "function") {
          prepare();
        }
        openOverlay(overlay);
      });
    }

    function bindProxyClickAction(button, target) {
      button.addEventListener("click", () => target.click());
    }
    function normalizePromptPreset(preset) {
      if (!preset || typeof preset !== "object") {
        return null;
      }

      const name = typeof preset.name === "string" ? preset.name.trim() : "";
      if (!name) {
        return null;
      }

      return {
        id: typeof preset.id === "string" && preset.id ? preset.id : createId("prompt-preset"),
        name,
        prompt: typeof preset.prompt === "string" ? preset.prompt : "",
        updatedAt: typeof preset.updatedAt === "string" ? preset.updatedAt : new Date().toISOString()
      };
    }

    function createDefaultRpState() {
      return {
        characterCards: [],
        activeCharacterId: "",
        personaCards: [],
        activePersonaId: "",
        responsePerspective: DEFAULT_RP_RESPONSE_PERSPECTIVE,
        responseLength: DEFAULT_RP_RESPONSE_LENGTH,
        illustration: { ...DEFAULT_RP_ILLUSTRATION_SETTINGS },
        assistance: { ...DEFAULT_RP_ASSISTANCE_SETTINGS },
        chatsByCharacterId: {},
        activeChatIdsByCharacterId: {}
      };
    }

    function normalizeRpAssistanceSettings(settings) {
      return {
        summaryEnabled: Boolean(settings?.summaryEnabled),
        summaryTokenThreshold: normalizeRpSummaryTokenThreshold(settings?.summaryTokenThreshold),
        summaryMaxTokens: normalizeRpSummaryMaxTokens(settings?.summaryMaxTokens),
        inputEnhancementEnabled: Boolean(settings?.inputEnhancementEnabled)
      };
    }

    function normalizeRpSummaryTokenThreshold(value) {
      return normalizeOptionalInteger(value, { min: 1000 }) ?? DEFAULT_RP_ASSISTANCE_SETTINGS.summaryTokenThreshold;
    }

    function normalizeRpSummaryMaxTokens(value) {
      return normalizeOptionalInteger(value, { min: 128 }) ?? DEFAULT_RP_ASSISTANCE_SETTINGS.summaryMaxTokens;
    }

    function normalizeRpIllustrationSettings(settings) {
      return {
        enabled: Boolean(settings?.enabled),
        promptStyle: normalizeIllustrationPromptStyle(settings?.promptStyle),
        artStyle: normalizeIllustrationArtStyle(settings?.artStyle),
        imageModel: typeof settings?.imageModel === "string" ? settings.imageModel : "",
        ignoreNonCharacterPeople: Boolean(settings?.ignoreNonCharacterPeople),
        cfgScale: normalizeOptionalNumber(settings?.cfgScale, { min: 1, max: 20 }) ?? DEFAULT_RP_ILLUSTRATION_SETTINGS.cfgScale,
        steps: normalizeOptionalInteger(settings?.steps, { min: 1, max: 60 }) ?? DEFAULT_RP_ILLUSTRATION_SETTINGS.steps,
        width: normalizeImageGenerationDimension(settings?.width),
        height: normalizeImageGenerationDimension(settings?.height)
      };
    }

    function normalizeIllustrationPromptStyle(value) {
      return value === "natural-language" ? "natural-language" : "tag-list";
    }

    function normalizeIllustrationArtStyle(value) {
      return value === "anime" || value === "photo" ? value : "";
    }

    function normalizeImageModelList(value) {
      if (!Array.isArray(value)) {
        return [];
      }

      const seen = new Set();
      return value
        .map((model) => normalizeImageModelOption(model))
        .filter((model) => {
          if (!model || seen.has(model.id)) {
            return false;
          }
          seen.add(model.id);
          return true;
        });
    }

    function normalizeImageModelOption(model) {
      if (typeof model === "string") {
        const id = model.trim();
        return id ? { id, label: id } : null;
      }

      if (!model || typeof model !== "object") {
        return null;
      }

      const id = String(model.id || model.title || model.model_name || model.name || model.filename || "").trim();
      if (!id) {
        return null;
      }

      const label = String(model.label || model.title || model.model_name || model.name || id).trim() || id;
      return { id, label };
    }

    function normalizeImageGenerationDimension(value) {
      const normalized = normalizeOptionalInteger(value, { min: 512, max: 1024 });
      if (typeof normalized !== "number") {
        return DEFAULT_RP_ILLUSTRATION_SETTINGS.width;
      }

      return Math.min(1024, Math.max(512, Math.round(normalized / 64) * 64));
    }

    function normalizeAppMode(mode) {
      return mode === "rp" ? "rp" : "chat";
    }

    function normalizeRpState(rpState) {
      const base = createDefaultRpState();
      const characterCards = Array.isArray(rpState?.characterCards)
        ? rpState.characterCards.map((card) => normalizeRpCard(card, "character")).filter(Boolean)
        : [];
      const personaCards = Array.isArray(rpState?.personaCards)
        ? rpState.personaCards.map((card) => normalizeRpCard(card, "persona")).filter(Boolean)
        : [];
      const validCharacterIds = new Set(characterCards.map((card) => card.id));
      const chatsByCharacterId = {};

      characterCards.forEach((card) => {
        chatsByCharacterId[card.id] = Array.isArray(rpState?.chatsByCharacterId?.[card.id])
          ? rpState.chatsByCharacterId[card.id].map(normalizeChat).filter(Boolean)
          : [];
      });

      const activeChatIdsByCharacterId = {};
      Object.entries(rpState?.activeChatIdsByCharacterId || {}).forEach(([characterId, chatId]) => {
        if (validCharacterIds.has(characterId) && typeof chatId === "string") {
          activeChatIdsByCharacterId[characterId] = chatId;
        }
      });

      return {
        ...base,
        characterCards,
        activeCharacterId: validCharacterIds.has(rpState?.activeCharacterId) ? rpState.activeCharacterId : (characterCards[0]?.id || ""),
        personaCards,
        activePersonaId: personaCards.some((card) => card.id === rpState?.activePersonaId) ? rpState.activePersonaId : (personaCards[0]?.id || ""),
        responsePerspective: normalizeRpResponsePerspective(rpState?.responsePerspective),
        responseLength: normalizeRpResponseLength(rpState?.responseLength),
        illustration: normalizeRpIllustrationSettings(rpState?.illustration),
        assistance: normalizeRpAssistanceSettings(rpState?.assistance),
        chatsByCharacterId,
        activeChatIdsByCharacterId
      };
    }

    function normalizeRpCard(card, kind) {
      if (!card || typeof card !== "object") {
        return null;
      }

      const label = getRpCardKindLabel(kind);
      const isWorldCard = kind === "character" && normalizeWorldCardFlag(card.isWorldCard ?? card.IsWorldCard);
      return {
        id: typeof card.id === "string" && card.id ? card.id : createId(`${kind}-card`),
        kind,
        name: typeof card.name === "string" && card.name.trim() ? card.name.trim() : t("newKindName", { kind: label }),
        description: typeof card.description === "string" ? card.description : "",
        firstMessage: kind === "character" && typeof card.firstMessage === "string" ? card.firstMessage : "",
        isWorldCard,
        mainCharacterDescription: isWorldCard && typeof card.mainCharacterDescription === "string" ? card.mainCharacterDescription : "",
        profileImage: normalizeCardProfileImage(card.profileImage || card.image || card.avatar),
        createdAt: typeof card.createdAt === "string" ? card.createdAt : new Date().toISOString(),
        updatedAt: typeof card.updatedAt === "string" ? card.updatedAt : new Date().toISOString()
      };
    }

    function normalizeWorldCardFlag(value) {
      return value === true;
    }

    function normalizeCharacterCardDescriptionMode(value) {
      return value === "main-character" ? "main-character" : "world";
    }

    function isWorldRpCard(card) {
      return Boolean(card?.kind === "character" && card?.isWorldCard);
    }

    function normalizeCardProfileImage(image) {
      return normalizeImageAttachments(image ? [image] : [])[0] || null;
    }

    function getAllStateChats(targetState = state) {
      return [targetState?.chats, ...Object.values(targetState?.rp?.chatsByCharacterId || {})]
        .flatMap((chats) => Array.isArray(chats) ? chats : []);
    }

    function syncPersistedChatRecordIds(targetState = state) {
      persistedChatRecordIds = new Set(getAllStateChats(targetState).map((chat) => chat.id).filter(Boolean));
    }

    function supportsIndexedDb() {
      return typeof window.indexedDB !== "undefined";
    }

    function supportsSettingsSecretStorage() {
      return supportsIndexedDb()
        && typeof window.crypto?.subtle !== "undefined"
        && typeof window.crypto?.getRandomValues === "function"
        && typeof TextEncoder !== "undefined"
        && typeof TextDecoder !== "undefined";
    }

    function openStateDatabase() {
      if (!supportsIndexedDb()) {
        return Promise.reject(new Error("IndexedDB를 사용할 수 없습니다."));
      }

      if (storageDbPromise) {
        return storageDbPromise;
      }

      storageDbPromise = new Promise((resolve, reject) => {
        const request = window.indexedDB.open(APP_DB_NAME, APP_DB_VERSION);

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(APP_DB_STORE)) {
            db.createObjectStore(APP_DB_STORE);
          }
        };

        request.onsuccess = () => {
          const db = request.result;
          db.onversionchange = () => db.close();
          resolve(db);
        };

        request.onerror = () => {
          storageDbPromise = null;
          reject(request.error || new Error("IndexedDB를 열지 못했습니다."));
        };

        request.onblocked = () => {
          storageDbPromise = null;
          reject(new Error("IndexedDB가 다른 탭에 의해 잠겨 있습니다."));
        };
      });

      return storageDbPromise;
    }

    async function readStateFromIndexedDb() {
      return readIndexedDbRecord(APP_DB_RECORD_KEY);
    }

    async function readChatMessagesFromIndexedDb(chatId) {
      return readIndexedDbRecord(`${APP_CHAT_RECORD_PREFIX}${chatId}`);
    }

    async function readIndexedDbRecord(recordKey) {
      const db = await openStateDatabase();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(APP_DB_STORE, "readonly");
        const request = transaction.objectStore(APP_DB_STORE).get(recordKey);

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error || new Error("IndexedDB 데이터를 읽지 못했습니다."));
      });
    }

    async function readIndexedDbRecordsByKeyPrefix(recordKeyPrefix) {
      const db = await openStateDatabase();
      return new Promise((resolve, reject) => {
        const records = [];
        const transaction = db.transaction(APP_DB_STORE, "readonly");
        const store = transaction.objectStore(APP_DB_STORE);
        const lowerBound = String(recordKeyPrefix || "");
        const upperBound = `${lowerBound}\uffff`;
        const keyRange = window.IDBKeyRange
          ? window.IDBKeyRange.bound(lowerBound, upperBound)
          : null;
        const request = keyRange
          ? store.openCursor(keyRange)
          : store.openCursor();

        request.onsuccess = () => {
          const cursor = request.result;
          if (!cursor) {
            resolve(records);
            return;
          }

          if (!keyRange) {
            if (typeof cursor.key === "string" && cursor.key.startsWith(lowerBound)) {
              records.push({ id: cursor.key, value: cursor.value });
            }
          } else {
            records.push({ id: cursor.key, value: cursor.value });
          }
          cursor.continue();
        };
        request.onerror = () => reject(request.error || new Error("IndexedDB 데이터를 읽지 못했습니다."));
        transaction.onerror = () => reject(transaction.error || new Error("IndexedDB 데이터를 읽지 못했습니다."));
      });
    }

    async function writeIndexedDbRecord(recordKey, value) {
      const db = await openStateDatabase();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(APP_DB_STORE, "readwrite");

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error("IndexedDB 데이터를 저장하지 못했습니다."));
        transaction.onabort = () => reject(transaction.error || new Error("IndexedDB 저장이 중단되었습니다."));

        transaction.objectStore(APP_DB_STORE).put(value, recordKey);
      });
    }

    async function deleteIndexedDbRecord(recordKey) {
      const db = await openStateDatabase();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(APP_DB_STORE, "readwrite");

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error("IndexedDB 데이터를 삭제하지 못했습니다."));
        transaction.onabort = () => reject(transaction.error || new Error("IndexedDB 삭제가 중단되었습니다."));

        transaction.objectStore(APP_DB_STORE).delete(recordKey);
      });
    }

    function createIndexedDbStateWritePlan(snapshot) {
      const metadataState = snapshot;
      const chatIds = new Set();
      const chatRecords = [];

      getAllStateChats(metadataState).forEach((chat) => {
        if (!chat?.id) {
          return;
        }

        const messages = Array.isArray(chat.messages) ? chat.messages : [];
        const messagesLoaded = chat.messagesLoaded !== false;
        chat.messageCount = messagesLoaded
          ? messages.length
          : normalizeOptionalInteger(chat.messageCount, { min: 0 }) ?? 0;
        chatIds.add(chat.id);

        if (messagesLoaded) {
          chatRecords.push({
            key: `${APP_CHAT_RECORD_PREFIX}${chat.id}`,
            value: {
              version: 1,
              chatId: chat.id,
              messages
            }
          });
        }

        chat.messages = [];
        chat.messagesLoaded = false;
      });

      metadataState.storageVersion = APP_SPLIT_CHAT_STORAGE_VERSION;
      metadataState.chatStorage = "split";
      return { metadataState, chatIds, chatRecords };
    }

    async function writeMediaRecord(mediaId, attachment, options = {}) {
      if (!supportsIndexedDb() || !mediaId || !attachment?.dataUrl) {
        return false;
      }

      await writeIndexedDbRecord(`${APP_MEDIA_RECORD_PREFIX}${mediaId}`, { dataUrl: attachment.dataUrl });
      if (options.cache !== false) {
        mediaDataUrlCache.set(mediaId, attachment.dataUrl);
      }
      return true;
    }

    async function resolveImageAttachmentDataUrl(attachment) {
      if (typeof attachment?.dataUrl === "string" && attachment.dataUrl) {
        return attachment.dataUrl;
      }
      const mediaId = attachment?.mediaId || "";
      if (!mediaId) {
        return "";
      }

      if (mediaDataUrlCache.has(mediaId)) {
        return mediaDataUrlCache.get(mediaId) || "";
      }

      if (!supportsIndexedDb()) {
        return "";
      }

      try {
        const record = await readIndexedDbRecord(`${APP_MEDIA_RECORD_PREFIX}${mediaId}`);
        const dataUrl = typeof record?.dataUrl === "string" ? record.dataUrl : "";
        if (dataUrl) {
          mediaDataUrlCache.set(mediaId, dataUrl);
        }
        return dataUrl;
      } catch (error) {
